function applyTheme() { const t = settings().theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ===== ΑΝΑΛΥΣΗ ΠΡΟΠΟΝΗΣΗΣ ===== */
function programAttendance(start,end){
  let expected=0,attended=0,weeks=0;
  const all=programs();
  for(const p of all.list){const hs=(p.scheduleHistory||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
    // Ανενεργό πρόγραμμα: μετρά μόνο μέχρι την εβδομάδα της τελευταίας του προπόνησης.
    const lastDone=p.id===all.active?null:allSessions().filter(x=>x.ex.prog?.pid===p.id&&Calc.sessionStats(x.ex)).map(x=>x.date).sort().at(-1);
    if(p.id!==all.active&&!lastDone)continue;
    for(let w=Dates.weekStart(start);Dates.add(w,7)<=end;w=Dates.add(w,7)){if(w<start)continue;if(lastDone&&w>lastDone)break;
      const target=hs.filter(x=>x.from<=w).at(-1)?.weekly||0;if(!target)continue;
      const actual=new Set(allSessions().filter(x=>x.date>=w&&x.date<Dates.add(w,7)&&x.ex.prog?.pid===p.id&&Calc.sessionStats(x.ex)).map(x=>x.date)).size;
      expected+=target;attended+=Math.min(actual,target);weeks++;
    }
  }return {expected,attended,weeks,pct:expected?attended/expected:null};
}
function trainingAnalysis(days,date=Dates.today()) {
  return cached('ta' + days + date, () => {
    const end = date, start = Dates.add(end, -(days - 1));
    const sess = allSessions().filter(s => s.date >= start && s.date <= end).map(s => ({ date: s.date, ex: s.ex, def: exById(s.ex.exId) }));
    const vol = Calc.muscleVolume(sess, days / 7);
    const workoutDays = new Set(sess.filter(s => Calc.sessionStats(s.ex)).map(s => s.date)).size;
    // Τάσεις ασκήσεων (τελευταίες 8 εβδομάδες)
    const from8 = Dates.add(end, -55), byEx = new Map();
    for (const s of allSessions()) { if (s.date > end || s.date < from8 || s.ex.type === 'c') continue; const st = Calc.sessionStats(s.ex, s.ex.type === 'bw' ? weightTrendOn(s.date) : null); if (!st) continue; if (!byEx.has(s.ex.exId)) byEx.set(s.ex.exId, []); byEx.get(s.ex.exId).push({ date: s.date, dayIdx: Dates.idx(s.date), stats: st }); }
    const trends = [...byEx.entries()].map(([id, h]) => { h.sort((a, b) => a.date < b.date ? -1 : 1); const def = exById(id); return { id, name: def ? def.name : id, type: def ? def.type : 'w', n: h.length, tr: Calc.trend(h, def ? def.type : 'w'), last: h[h.length - 1] }; })
      .filter(x => x.n >= 2).sort((a, b) => b.n - a.n);
    // Ολοκλήρωση: προγραμματισμένα σετ έναντι ολοκληρωμένων (μόνο ασκήσεις που ξεκίνησαν από πρόγραμμα)
    let planned = 0, done = 0; const progDays = new Set();
    for (const s of sess) if (s.ex.plan && s.ex.type !== 'c') { progDays.add(s.date); planned += +s.ex.plan.sets || 0; done += Math.min(+s.ex.plan.sets || 0, (s.ex.sets || []).filter(x => !x.wu && +x.r > 0).length); }
    const adh = { sessions: progDays.size, planned, done, pct: planned ? done / planned : null };
    return { vol, workoutDays, trends, days, sessions: sess.length, adh,attendance:programAttendance(start,end) };
  });
}
function suggestExercisesFor(m, n = 2) {
  const used = new Set(allSessions().map(s => s.ex.exId));
  return exercises().filter(e => (e.prim || []).includes(m)).sort((a, b) => (used.has(b.id) ? 1 : 0) - (used.has(a.id) ? 1 : 0)).slice(0, n).map(e => e.name);
}

/* Εναλλακτικές ασκήσεις: ίδιοι κύριοι μύες, ίδιος τύπος */
function substitutesFor(exId) {
  const def=exById(exId);if(!def||!def.movement)return [];
  return exercises().filter(e=>e.id!==exId&&e.movement===def.movement).slice(0,6);
}

/* Ιεράρχηση (1 ασφάλεια/ανάκαμψη, 2 δεδομένα/συνέπεια, 3 ενέργεια & σώμα, 4 απόδοση, 5 όγκος/ισορροπία) και επίπεδο τεκμηρίωσης */
const REC_CLASS = [
  [/Χωρίς έλλειμμα/, 1, 'high'], [/Λίγος ύπνος|Ύπνος λίγο κάτω|Επαρκής ύπνος/, 1, 'moderate'], [/Διάλειμμα από τη δίαιτα|Πείνα και κούραση/, 1, 'moderate'], [/Υψηλό στρες|Καλή εβδομάδα/, 1, 'heuristic'],

  [/απώλεια|παίρνεις βάρος|Τρως λιγότερο|Τρως περισσότερο|βάρος ανεβαίνει|Ρυθμός εντός|πραγματική σου κατανάλωση/, 3, 'high'], [/πρωτεΐνη/, 3, 'moderate'],
  [/ΣΚ/, 3, 'heuristic'], [/άνετο όριο/, 3, 'heuristic'], [/βήματα|κίνηση/, 3, 'moderate'], [/γλυκά|Γλυκά/, 3, 'heuristic'], [/μείωση λίπους/, 3, 'moderate'],
  [/μέσης\/ύψους/, 3, 'high'], [/Αναδόμηση|μέση αυξάνεται/, 3, 'moderate'],
  [/αποτυχία|Καλή ένταση/, 4, 'moderate'], [/Στασιμότητα|Ώρα για εναλλαγή|Διατηρείς|Πτώση δύναμης|^Πρόοδος/, 4, 'moderate'],

function classifyRecs(recs) {
  for (const r of recs) { const c = REC_CLASS.find(([re]) => re.test(r.title)); r.prio = c ? c[1] : 3; r.ev = c ? c[2] : 'moderate'; }
  // Αν υπάρχει θέμα ανάκαμψης, ασφάλειας ή συνέπειας, δεν προτείνεται αύξηση όγκου
  const blocker = recs.find(r => r.prio <= 2 && (r.lvl === 'act' || r.lvl === 'watch'));
  if (blocker) recs.filter(r => r.prio === 5 && r.lvl === 'act').forEach(r => { r.suppressed = true; r.note = `Σε αναμονή: πρώτα «${blocker.title.toLowerCase()}».`; });
}
const EV_LBL = { high: 'ισχυρή τεκμηρίωση', moderate: 'μέτρια τεκμηρίωση', heuristic: 'πρακτικός κανόνας' };
function coachSummary(recs, ad) {
  const today = Dates.today(), st = [];
  if (ad.ready) st.push(`Βάρος ${sfmt(ad.ratePctWk, 2)}%/εβδ.`);
  const ms = measures().filter(m => numIn(m.waist) !== null && m.d <= today), mL = ms[ms.length - 1], m0 = mL ? ms.filter(m => m.d <= Dates.add(mL.d, -14)).pop() : null;
  if (mL && m0) st.push(`μέση ${sfmt(mL.waist - m0.waist, 1)} cm σε ${Math.round((Dates.idx(mL.d) - Dates.idx(m0.d)) / 7)} εβδ.`);
  const tr = trainingAnalysis(28).trends.filter(x => x.tr?.eligible);
  if (tr.length) { const up = tr.filter(x => x.tr.pctWk >= 0.25).length, dn = tr.filter(x => x.tr.pctWk <= -1).length; st.push(`δύναμη: ${up} ↑, ${tr.length - up - dn} σταθερές, ${dn} ↓`); }
  if (ad.loggedN) st.push(`πλήρεις μέρες ${ad.completeN}/${ad.loggedN}`);
  const act = recs.filter(r => r.lvl === 'act' && !r.suppressed), watch = recs.filter(r => !r.suppressed && (r.lvl === 'watch' || (r.lvl === 'info' && r.prio <= 2))), good = recs.filter(r => r.lvl === 'good' && !r.suppressed);
  const keep = good.slice(0, 3).map(r => ({ title: r.title, text: r.text }));
  if (!act.some(r => r.effect === 'calories')) keep.unshift({ title: 'Θερμίδες χωρίς αλλαγή', text: ad.eligible ? 'Διατήρησε τον τρέχοντα στόχο μέχρι την επόμενη αξιολόγηση.' : 'Ο στόχος παραμένει σταθερός επειδή δεν υπάρχουν επαρκή δεδομένα για προσαρμογή.' });
  if (!recs.some(r=>r.area==='Προπόνηση'&&(r.lvl==='watch'||r.lvl==='act')&&!r.suppressed)) keep.push({ title: 'Πρόγραμμα χωρίς αλλαγή', text: 'Συνέχισε το πρόγραμμα όπως είναι.' });

}

/* ===== ΜΗΧΑΝΗ ΠΡΟΤΑΣΕΩΝ =====
   Διαφανείς κανόνες βασισμένοι στα δεδομένα σου. lvl: 'act' (πρόταση αλλαγής), 'watch' (προσοχή), 'good' (πάει καλά), 'info' */
function buildRecs() {
  return cached('recs' + Dates.today(), () => {
    const recs = [], today = Dates.today(), p = profile(), s = settings(), goal = p.goal;
    const t = baseTargets(today); if (!t) return { recs, learning: null };
    const G0 = Calc.GOALS[goal] || Calc.GOALS.maintain;
    const G = (t.minor || t.lowBmi) && (goal === 'cut' || goal === 'recomp') ? Object.assign({}, G0, { rate: [-0.1, 0.25] }) : t.lean && goal === 'cut' ? Object.assign({}, G0, { rate: [-0.5, -0.25] }) : G0;

    // Δεδομένα 14/28 ημερών
    const last = n => { const out = []; for (let i = 1; i <= n; i++) { const dd = Dates.add(today, -i), d = Store.get('day:' + dd); if (d) out.push(d); } return out; };
    const d14 = last(14).filter(d => d.complete&&d.meals.length), d28 = last(28).filter(d => d.complete&&d.meals.length);
    const incomplete=last(14).filter(d=>d.meals.length&&!d.complete).length;if(incomplete)add('info','Διατροφή','Ελλιπείς ημέρες καταγραφής',`${incomplete} ημέρες δεν δηλώθηκαν ολοκληρωμένες. Δεν χρησιμοποιούνται για συμπεράσματα ημερήσιας πρωτεΐνης ή μοτίβου ΣΚ.`,'Ποιότητα δεδομένων');
    const learning = { logged14: d14.length, weigh14: weights().filter(w => w.d >= Dates.add(today, -14)).length };
    const ad = adaptiveOn(today), kg = t.weight;

    /* 1. Ρυθμός μεταβολής βάρους */
    if (ad.eligible && !s.useAdaptive && numIn(p.overrides?.kcal)===null && recoveryGate(today,ad).calorieChange && ad.span >= 20) {
      const rate = ad.ratePctWk, [lo, hi] = G.rate, mid = (lo + hi) / 2;
      const kcalRaw = (mid - rate) / 100 * kg * ad.density.v / 7, kcalFix = Math.sign(kcalRaw) * Math.min(150, Math.round(Math.abs(kcalRaw) / 50) * 50), capped = Math.abs(kcalRaw) > 325;
      const avgTarget = d28.length ? d28.reduce((a, d) => a + (d.snap ? d.snap.kcal : t.kcal), 0) / d28.length : t.kcal;
      const adherence = ad.avgIntake - avgTarget;
      const firstLog = Store.keys('day:')[0], young = firstLog && Dates.idx(today) - Dates.idx(firstLog.slice(4)) < 21;
      const rTxt = `${sfmt(rate, 2)}% του βάρους την εβδομάδα (${sfmt(ad.slopeKgWk, 2)} kg)`;
      if (rate < lo) {
        if (goal === 'cut' && young) add('watch', 'Διατροφή', 'Γρήγορη αρχική απώλεια', `Χάνεις ${rTxt}. Τις πρώτες 2–3 εβδομάδες ελλείμματος χάνεται και νερό μαζί με γλυκογόνο, οπότε η πτώση φαίνεται μεγαλύτερη. Περίμενε μία ακόμα εβδομάδα πριν αλλάξεις κάτι.`, 'Φυσιολογία γλυκογόνου· Hall 2008');
        else if (adherence < -150) add('act', 'Διατροφή', 'Τρως λιγότερο από τον στόχο', `Χάνεις ${rTxt}, πιο γρήγορα από το εύρος ${sfmt(lo, 2)} έως ${sfmt(hi, 2)}% που ταιριάζει στον στόχο σου. Κατά μέσο όρο τρως ${fmt(-adherence)} kcal λιγότερο από τον στόχο. Φάε κοντά στον στόχο, για να κρατήσεις μυϊκή μάζα και απόδοση.`, 'Helms 2014, Garthe 2011: 0,5–1%/εβδ. σε έλλειμμα');
        else add('act', 'Διατροφή', goal === 'bulk' ? 'Δεν παίρνεις βάρος' : 'Πολύ γρήγορη απώλεια', `Ρυθμός ${rTxt}. Πρόσθεσε περίπου ${fmt(Math.abs(kcalFix))} kcal την ημέρα, κυρίως από υδατάνθρακες γύρω από την προπόνηση${capped ? ', και ξαναδές σε 2 εβδομάδες. Οι μικρές, σταδιακές αλλαγές είναι πιο εύκολο να τηρηθούν' : ''}.`, goal === 'bulk' ? 'Iraki 2019: ~0,25–0,5%/εβδ. σε πλεόνασμα' : 'Helms 2014: >1%/εβδ. αυξάνει την απώλεια άλιπης μάζας');
      } else if (rate > hi && t.kcal-Math.abs(kcalFix)>=Math.max(t.floor,numIn(s.minKcal)||0)) {
        if (adherence > 150) add('act', 'Διατροφή', 'Τρως περισσότερο από τον στόχο', `Ρυθμός ${rTxt}, πάνω από το εύρος του στόχου σου. Κατά μέσο όρο τρως ${fmt(adherence)} kcal πάνω από τον στόχο. Δες στην Εβδομάδα ποιες μέρες ξεφεύγουν.`, 'Ενεργειακό ισοζύγιο');
        else add('act', 'Διατροφή', goal === 'bulk' ? 'Πολύ γρήγορη αύξηση' : goal === 'cut' ? 'Η απώλεια είναι αργή' : 'Το βάρος ανεβαίνει', `Ρυθμός ${rTxt}. Αφαίρεσε περίπου ${fmt(Math.abs(kcalFix))} kcal την ημέρα${capped ? '. Ξαναδές σε 2 εβδομάδες. Οι μικρές, σταδιακές αλλαγές είναι πιο εύκολο να τηρηθούν' : ''}.`, goal === 'bulk' ? 'Iraki 2019: ταχύτερη αύξηση σημαίνει κυρίως περισσότερο λίπος' : 'Ενεργειακό ισοζύγιο');
      } else if(rate>hi)add('watch','Διατροφή','Ρυθμός εκτός στόχου — διατήρηση θερμίδων',`Ρυθμός ${rTxt}. Δεν προτείνεται περαιτέρω μείωση επειδή θα παραβίαζε το όριο θερμίδων. Έλεγξε τη συνέπεια των καταγραφών.`,'Περιορισμός εφαρμογής');
      else add('good', 'Διατροφή', 'Ρυθμός εντός στόχου', `Ρυθμός ${rTxt}, μέσα στο εύρος για ${G.label.toLowerCase()} (${sfmt(lo, 2)} έως ${sfmt(hi, 2)}%).`, 'Helms 2014· Iraki 2019');
    }

      add('act', 'Διατροφή', 'Η εκτίμηση από τις καταγραφές διαφέρει', `Από τα δεδομένα σου, η κατανάλωση είναι ≈${fmt(ad.tdee)} kcal, ενώ ο τύπος δίνει ${fmt(t.formulaTdee)}. Ενεργοποίησε το προσαρμοστικό TDEE στο Προφίλ.`, 'Εκτίμηση από καταγραφές', 'calories');

      if (share < 0.6) {

        const perMeal = 0.4 * kg, weak = per.find(x => x.avg < perMeal * 0.85);
        const avgP = d14.reduce((a, d) => a + dayTotals(d).p, 0) / d14.length, tgtP = t.p;
        add('act', 'Διατροφή', 'Λίγη πρωτεΐνη', `Έπιασες τον στόχο πρωτεΐνης (${fmt(tgtP)} g) ${hit} στις ${d14.length} μέρες, με μέσο όρο ${fmt(avgP)} g.${weak ? ` Το ${weak.m.label.toLowerCase()} έχει κατά μέσο όρο ${fmt(weak.avg)} g: ανέβασέ το κοντά στα ${fmt(perMeal)} g, π.χ. με γιαούρτι στραγγιστό (200 g ≈ 20 g), αυγά, τόνο ή κοτόπουλο.` : ` Λείπουν περίπου ${fmt(tgtP - avgP)} g την ημέρα: πρόσθεσε ένα σνακ με πρωτεΐνη (π.χ. γιαούρτι στραγγιστό ή cottage) ή λίγο μεγαλύτερες μερίδες κρέατος και ψαριού.`}`, 'Morton 2018· Schoenfeld & Aragon 2018: ~0,4 g/kg ανά γεύμα');
      } else if (share >= 0.8) add('good', 'Διατροφή', 'Σταθερή πρωτεΐνη', `Έπιασες τον στόχο πρωτεΐνης ${hit} στις ${d14.length} μέρες.`, 'Morton 2018');
    }
    /* 4. Μοτίβο Σαββατοκύριακου */
    if (d28.length >= 10) {
      const hiDays = s.highMode === 'long' ? [5, 6, 0] : [6, 0], wk = d28.filter(d => hiDays.includes(Dates.dowNum(d.date))), wd = d28.filter(d => !hiDays.includes(Dates.dowNum(d.date)));
      if (wk.length >= 2 && wd.length >= 4) {
        const avg = a => a.reduce((x, d) => x + dayTotals(d).kcal, 0) / a.length, diff = avg(wk) - avg(wd);
        if (s.highMode === 'none' && diff > 350) add('act', 'Διατροφή', 'Τρως περισσότερο το ΣΚ', `Τα Σαββατοκύριακα τρως κατά μέσο όρο ${fmt(diff)} kcal περισσότερο από τις καθημερινές. Ενεργοποίησε την κατανομή ΣΚ στο Προφίλ, ώστε να το σχεδιάζεις αντί να «χαλάει» την εβδομάδα.`, 'Ευελιξία στη δίαιτα και μακροχρόνια τήρηση (Westenhoefer 1999· Byrne 2018)', 'calories');
        if (s.highMode !== 'none') { const over = wk.map(d => dayTotals(d).kcal - (d.snap ? d.snap.kcal : t.kcal)); const avgOver = over.reduce((a, b) => a + b, 0) / over.length; if (avgOver > 300) add('watch', 'Διατροφή', 'Οι μέρες ΣΚ ξεπερνούν τον στόχο τους', `Ακόμα και με την επιπλέον ποσότητα, οι μέρες ΣΚ είναι κατά μέσο όρο ${fmt(avgOver)} kcal πάνω από τον στόχο. Σκέψου μεγαλύτερη αύξηση για το ΣΚ, με ανάλογη μείωση τις καθημερινές.`, 'Ενεργειακό ισοζύγιο εβδομάδας', 'calories'); }

    const order = { act: 0, watch: 1, info: 2, good: 3 };
    recs.sort((a, b) => a.prio - b.prio || order[a.lvl] - order[b.lvl]);
    return { recs, learning };
  });
}

/* Αυτόματη επιδιόρθωση σε επίπεδο εγγραφής: διορθώνει ή απομονώνει μόνο ό,τι είναι άκυρο,
   κρατά ολόκληρο το αρχικό αντίγραφο και ενημερώνει τον χρήστη. Ποτέ σιωπηρή απώλεια. */
async function autoRepair() {
  const info = Store.info(); if (info.conflict || info.unavailable || !(info.validationErrors || []).length) return;
  const original = Store.dump(), pub = Object.fromEntries(Object.entries(original).filter(([k]) => !k.startsWith('_')));
  const { data, fixes, quarantine } = Reliability.repairData(pub);
  if (validateBackup(data).length) return; // τελευταία λύση: η χειροκίνητη οθόνη ανάκτησης
  const priv = Object.fromEntries(Object.entries(original).filter(([k]) => k.startsWith('_') && k !== '_repairLog'));
  const log = { at: Date.now(), fixes, quarantine, original: Object.fromEntries(Object.entries(pub).filter(([k]) => !k.startsWith('photo:') || quarantine.some(q => q.key === k))) };
  try { await Store.replaceAll({ ...data, ...priv, _repairLog: log }); foodCache = null; UI.repairNotice = true; }
  catch (e) { console.warn('auto repair', e); }
}

    <p class="note"><b>Μόνο σήμερα</b>: π.χ. όταν το μηχάνημα είναι πιασμένο. Το πρόγραμμα δεν αλλάζει. <b>Στο πρόγραμμα</b>: μόνιμη αλλαγή, με σετ, επαναλήψεις και RIR ίδια. Αναιρείται. Η εναλλαγή ασκήσεων κάθε 4–8 εβδομάδες όταν υπάρχει στασιμότητα μπορεί να βοηθήσει, όχι όμως η συνεχής αλλαγή. Καλό είναι να το συζητάς με τον γυμναστή σου.</p>`);

const Timer = (() => {
  let end = 0, iv = null, total = 0, actx = null;
  const el = () => $('#timer');
  function beep() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); [0, 0.25].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.2); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.2); }); } catch {}
    try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch {}
  }
  function tick() {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000)), e = el(); if (!e) return;
    $('#tmTxt').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    $('#tmBar').style.width = `${total ? (1 - left / total) * 100 : 0}%`;
    if (left <= 0) { stop(); beep(); toast('Τέλος διαλείμματος: επόμενο σετ.', 3000); }
  }
  function start(sec) {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    total = sec; end = Date.now() + sec * 1000; el().hidden = false; clearInterval(iv); iv = setInterval(tick, 250); tick();
  }
  function add(sec) { if (!iv) return; end += sec * 1000; total = Math.max(total + sec, 1); tick(); }
  function stop() { clearInterval(iv); iv = null; if (el()) el().hidden = true; }
  return { start, add, stop };
})();

/* ----- «Τι να φάω για να κλείσω τη μέρα» ----- */
function closingSuggestions(d, snap, tot) {
  const kLeft = snap.kcal - tot.kcal, pLeft = snap.p - tot.p, s = settings();
  const freq = new Map(), from = Dates.add(d.date, -30);
  for (const k of dayKeysBetween(from, null)) { const x = Store.get(k); for (const e of x.meals) if (e.foodId) freq.set(e.foodId, (freq.get(e.foodId) || 0) + 1); }
  const ok = f => f && !f.sweet && !(s.noSupplements && f.supp);
  const protIds = ['chk_breast_cooked', 'tuna_water', 'egg', 'cottage', 'yog_greek_2', 'salmon_cooked', 'turkey_deli', 'beef_patty', 'shrimp', 'yog_greek_0', 'egg_white', 'lentils'];
  const prot = [...new Set([...[...freq.keys()], ...protIds])].map(id => foods().byId.get(id)).filter(f => ok(f) && f.p * 4 / f.kcal >= 0.3)
    .sort((a, b) => (freq.get(b.id) || 0) - (freq.get(a.id) || 0) || b.p / b.kcal - a.p / a.kcal).slice(0, 6);
  const carbIds = ['rice_white_cooked', 'pasta_cooked', 'bread_whole', 'potato_boiled', 'banana', 'pita_arabic'];
  const carbs = [...new Set([...[...freq.keys()].filter(id => { const f = foods().byId.get(id); return f && ['grain_cooked', 'bread', 'fruit'].includes(f.cat); }), ...carbIds])].map(id => foods().byId.get(id)).filter(ok).slice(0, 4);
  const unitOf = f => f.piece && f.piece >= 30 && f.cat !== 'grain_cooked' ? 'piece' : 'portion';
  const out = [];
  prot.forEach((pf, i) => {
    const u = unitOf(pf), ug = Parser.unitGrams(pf, u).g, pu = ug * pf.p / 100, ku = ug * pf.kcal / 100, cap = u === 'piece' ? (pf.id === 'egg' ? 4 : 2) : 2;
    let n = pLeft > 10 ? Math.min(cap, Math.max(u === 'piece' ? 1 : 0.5, Math.ceil(pLeft * 0.85 / pu * 2) / 2)) : 0;
    if (u === 'piece') n = Math.ceil(n);
    while (n > 0 && n * ku > kLeft + 120) n -= u === 'piece' ? 1 : 0.5;
    if (n <= 0) return;
    const items = [{ f: pf, qty: n, unit: u, g: n * ug }];
    let R = kLeft - n * ku;
    const cf = carbs[i % Math.max(1, carbs.length)];
    if (cf && R >= 150) { const cu = unitOf(cf), cg = Parser.unitGrams(cf, cu).g, ck = cg * cf.kcal / 100; let q = Math.min(1.5, Math.floor(R / ck * 2) / 2); if (cu === 'piece') q = Math.floor(q); if (q > 0) { items.push({ f: cf, qty: q, unit: cu, g: q * cg }); R -= q * ck; } }
    const kc = items.reduce((a, x) => a + x.g * x.f.kcal / 100, 0), pc = items.reduce((a, x) => a + x.g * x.f.p / 100, 0);
    out.push({ items, kcal: kc, p: pc });
  });
  return { kLeft, pLeft, combos: out.sort((a, b) => Math.abs(pLeft - a.p) - Math.abs(pLeft - b.p)).slice(0, 4) };
}
function openCloseDay() {
  const d = getDay(UI.date), snap = daySnap(d), tot = dayTotals(d); if (!snap) return;
  const r = closingSuggestions(d, snap, tot);
  window._closeCombos = r.combos;
  const hour = new Date().getHours(), defMeal = hour < 11 ? 'b' : hour < 17 ? 'l' : 'd';
  openDlg('Τι να φάω για να κλείσω τη μέρα', `<p class="small">Υπόλοιπο: <b class="est">${fmt(r.kLeft)}</b> kcal και <b class="est">${fmt(Math.max(0, r.pLeft))}</b> g πρωτεΐνης.</p>
    <label class="f"><span>Γεύμα</span>${mealSelect(defMeal)}</label>
    ${r.combos.length ? `<ul class="plain">${r.combos.map((c, i) => `<li class="row sweet-opt"><span class="grow"><b>${c.items.map(x => `${qtyLabel(x.qty, x.unit)} ${esc(x.f.name.toLowerCase())}`).join(' + ')}</b><br><span class="small muted">≈${fmt(c.kcal)} kcal, ${fmt(c.p)} g πρωτεΐνη</span></span><button class="btn sm" data-act="closeAdd" data-i="${i}">Προσθήκη</button></li>`).join('')}</ul>`
      : `<p class="empty">${r.pLeft <= 10 ? 'Η πρωτεΐνη έχει καλυφθεί. Οι υπόλοιπες θερμίδες είναι ελεύθερες, και μπορεί να χωράει και γλυκό.' : 'Δεν χωράει συνδυασμός στις θερμίδες που απομένουν. Για πρωτεΐνη με λίγες θερμίδες: γιαούρτι 0%, τόνος σε νερό, ασπράδια.'}</p>`}

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1080 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}

const Translit = (() => {
  const L2G = [['th', 'θ'], ['ch', 'χ'], ['ps', 'ψ'], ['ks', 'ξ'], ['ou', 'ου'], ['a', 'α'], ['b', 'μπ'], ['c', 'κ'], ['d', 'δ'], ['e', 'ε'], ['f', 'φ'], ['g', 'γ'], ['h', 'χ'], ['i', 'ι'], ['j', 'τζ'], ['k', 'κ'], ['l', 'λ'], ['m', 'μ'], ['n', 'ν'], ['o', 'ο'], ['p', 'π'], ['q', 'κ'], ['r', 'ρ'], ['s', 'σ'], ['t', 'τ'], ['u', 'ου'], ['v', 'β'], ['w', 'ου'], ['x', 'ξ'], ['y', 'ι'], ['z', 'ζ']];
  const G2L = { 'α': 'a', 'β': 'v', 'γ': 'g', 'δ': 'd', 'ε': 'e', 'ζ': 'z', 'η': 'i', 'θ': 'th', 'ι': 'i', 'κ': 'k', 'λ': 'l', 'μ': 'm', 'ν': 'n', 'ξ': 'x', 'ο': 'o', 'π': 'p', 'ρ': 'r', 'σ': 's', 'τ': 't', 'υ': 'y', 'φ': 'f', 'χ': 'ch', 'ψ': 'ps', 'ω': 'o' };

  /* Επιπλέον ονομασίες: μάρκα μεταγραμμένη + όνομα προϊόντος */
  function aliasesFor(brand, pname) {
    const out = [];
    if (brand && isLatin(brand)) { out.push(toGreek(brand)); if (pname) out.push(toGreek(brand) + ' ' + pname); }
    if (brand && isGreek(brand)) { out.push(toLatin(brand)); if (pname) out.push(toLatin(brand) + ' ' + pname); }

/* ----- Σαρωτής barcode: BarcodeDetector (Android/Chrome) ή ZXing (iPhone κ.ά.) ----- */
const Scanner = (() => {
  let stream = null, raf = null, zx = null, active = false, session = 0;
  function stop() { active = false; session++; if (raf) cancelAnimationFrame(raf); raf = null; if (zx) { try { zx.reset(); } catch {} zx = null; } if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } const b = $('#scanBox'); if (b) b.remove(); }
  function loadZX() {
    if (window.ZXing) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = () => rej(new Error('zxing')); document.head.appendChild(s); });
  }
  async function open(anchor, onCode) {
    stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Η κάμερα δεν είναι διαθέσιμη. Χρειάζεται https. Γράψε το barcode με το χέρι.', 4000); return; }
    const box = document.createElement('div'); box.id = 'scanBox'; box.className = 'scanbox';
    box.innerHTML = `<video playsinline muted></video><div class="scanframe"></div><div class="row between" style="margin-top:6px"><span class="small muted" id="scanSt">Στρέψε την κάμερα στο barcode…</span><button class="btn sm" id="scanStop">Κλείσιμο</button></div>`;
    anchor.parentNode.insertBefore(box, anchor);
    const video = $('video', box); $('#scanStop', box).addEventListener('click', stop);
    const done = code => { if (!active) return; try { navigator.vibrate && navigator.vibrate(80); } catch {} stop(); onCode(code); };
    active = true; const my = session, gone = () => my !== session;
    try {
      if ('BarcodeDetector' in window) {
        const fm = await BarcodeDetector.getSupportedFormats().catch(() => []);
        // Χωρίς υποστηριζόμενες μορφές ή με αποτυχία δημιουργίας: συνέχεια με ZXing αντί για σφάλμα.
        const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(x => fm.includes(x));
        let det = null; if (want.length) try { det = new BarcodeDetector({ formats: want }); } catch {}
        if (det) {
          const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
          if (gone()) { st.getTracks().forEach(t => t.stop()); return; }
          stream = st; video.srcObject = stream; await video.play(); if (gone()) return;
          let last = 0;
          const loop = async t => { if (!active) return; if (t - last > 180 && video.readyState >= 2) { last = t; try { const r = await det.detect(video); if (r.length) return done(r[0].rawValue); } catch {} } raf = requestAnimationFrame(loop); };
          raf = requestAnimationFrame(loop); return;
        }
      }
      $('#scanSt').textContent = 'Φόρτωση σαρωτή…';
      await loadZX(); if (gone()) return;
      const reader = zx = new ZXing.BrowserMultiFormatReader();
      $('#scanSt').textContent = 'Στρέψε την κάμερα στο barcode…';
      await reader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, (result) => { if (result && !gone()) done(result.getText()); });
      if (gone()) { try { reader.reset(); } catch {} const so = video.srcObject; if (so && so.getTracks) so.getTracks().forEach(t => t.stop()); }
    } catch (e) {
      if (gone()) return; stop(); toast(e && e.name === 'NotAllowedError' ? 'Δεν δόθηκε άδεια για την κάμερα.' : 'Δεν ήταν δυνατή η σάρωση. Γράψε το barcode με το χέρι.', 4000);
    }
  }
  return { open, stop };
})();

  if (settings().showSteps) items.push({ k: 'steps', role: 'info', freq: 'Κάθε μέρα', t: 'Βήματα', w: 'Το βράδυ. Δεν αλλάζουν τους στόχους· δείχνουν μόνο αν άλλαξε η κίνησή σου', done: hasSteps, act: 'goSteps', opt: true });
  const trains = activeProgram() || allSessions().some(x => daysSince(x.date) <= 14);
  if (trains) items.push({ k: 'train', role: 'train', freq: 'Μέρες προπόνησης', t: 'Προπόνηση', w: 'Κιλά, επαναλήψεις και RIR σε κάθε σετ· δεν αλλάζει τις θερμίδες', done: d.ex.some(e => Calc.sessionStats(e)), act: 'goEx', opt: true });
  // Κάθε εβδομάδα (την ημέρα που επέλεξες ή την επόμενη αν ξεχάστηκε)
  const lastM = measures().length ? measures()[measures().length - 1].d : null, sinceM = lastM ? Dates.idx(date) - Dates.idx(lastM) : Infinity;

  if (lastM === date || (sinceM >= 6 && (weeklyDue || sinceM >= 9))) items.push({ k: 'measure', role: 'info', freq: 'Κάθε εβδομάδα', t: 'Μεζούρα', w: 'Μέση, λαιμός, γλουτοί, πρωί πριν φας (2 λεπτά)', done: lastM === date, act: 'measureAdd' });
  const ws = Dates.weekStart(date), ci = checkins();

/* Για το ποσοστό λίπους: η τελευταία μέση, και λαιμός/γλουτοί από την πιο πρόσφατη μέτρηση που τους έχει (έως 120 ημέρες πίσω) */
/* Για το ποσοστό λίπους: η τελευταία μέση (έως 30 ημέρες) και λαιμός/γλουτοί από την πιο πρόσφατη
   μέτρηση που τους έχει, επίσης έως 30 ημέρες πριν από την ημερομηνία. */
const BF_CARRY_DAYS = 30;
function measureForBf(date) {
  const ms = measures().filter(x => x.d <= date && Dates.idx(date) - Dates.idx(x.d) <= BF_CARRY_DAYS);
  const last = ms.at(-1); if (!last) return null;
  const out = { ...last };
  for (const k of ['neck', 'hip']) if (numIn(out[k]) === null) { const src = ms.slice().reverse().find(x => numIn(x[k]) !== null); if (src) out[k] = src[k]; else delete out[k]; }
  return out;
}

/* ----- Σύνθετο πιάτο: μία καταχώρηση με υλικά ----- */
function combineEntries(title, entries) {
  const sum = k => entries.reduce((a, e) => a + (+e[k] || 0), 0);
  return { id: uid(), name: title, foodId: null, per100: null, g: Math.round(sum('g')), kcal: sum('kcal'), p: sum('p'), c: sum('c'), f: sum('f'), src: 'text', est: true,
    sweetKcal: entries.filter(e => e.sweet).reduce((a, e) => a + e.kcal, 0),
    items: entries.map(e => ({ foodId: e.foodId, name: e.name, qty: e.qty, unit: e.unit, g: e.g, kcal: e.kcal, p: e.p, c: e.c, f: e.f, per100: e.per100, fiber:e.fiber,satfat:e.satfat,salt:e.salt,sugars:e.sugars, sweet: e.sweet })) };
}
/* Διάσπαση πιάτου. Αν το σύνολο έχει διορθωθεί χειροκίνητα, τα υλικά προσαρμόζονται αναλογικά
   ώστε το σύνολο να μείνει ίδιο (μετά από ρητή επιβεβαίωση στη φόρμα). */
function splitScale(e) {
  const items = e.items || [], sum = k => items.reduce((a, it) => a + (+it[k] || 0), 0), out = {};
  for (const k of ['kcal', 'p', 'c', 'f']) out[k] = sum(k) > 0 ? (+e[k] || 0) / sum(k) : 1;
  out.changed = ['kcal', 'p', 'c', 'f'].some(k => Math.abs((+e[k] || 0) - sum(k)) > (k === 'kcal' ? 1 : 0.2));
  return out;
}
function splitEntry(e) {
  const sc = splitScale(e), items = e.items || [], n = items.length, kcalSum = items.reduce((a, it) => a + (+it.kcal || 0), 0);
  return items.map(it => { const x = Object.assign({ id: uid(), meal: e.meal, src: 'text', est: true, foodId: it.foodId || null }, it, { id: uid(), meal: e.meal });
    if (sc.changed) {
      for (const k of ['kcal', 'p', 'c', 'f']) {
        const sum = items.reduce((a, y) => a + (+y[k] || 0), 0), target = +e[k] || 0;
        // Άθροισμα υλικών 0 αλλά διορθωμένο σύνολο > 0: κατανομή με βάση τις θερμίδες (ή ισόποσα), ώστε να μη χαθεί η διόρθωση.
        x[k] = sum > 0 ? (+it[k] || 0) * target / sum : target * (kcalSum > 0 ? (+it.kcal || 0) / kcalSum : 1 / n);
      }
      x.edited = true; for (const k of ['fiber', 'salt', 'satfat', 'sugars']) x[k] = null;
    }
    if (e.sweetKcal !== undefined) x.sweet = !!it.sweet && +e.sweetKcal > 0;
    return x; });
}
function suggestTitle(foodsArr) {
  const short = f => f.name.split(/[(\/]/)[0].trim().split(' ').slice(0, 2).join(' ');
  const n = foodsArr.map((f, i) => i ? short(f).toLocaleLowerCase('el') : short(f));
  if (n.length === 1) return n[0];
  if (n.length === 2) return `${n[0]} με ${n[1]}`;
  if (n.length === 3) return `${n[0]} με ${n[1]} και ${n[2]}`;
  return `${n[0]} με ${n[1]}, ${n[2]} και άλλα`;
}

/* ----- Εκτίμηση σύνθετου φαγητού με AI (copy–paste, χωρίς σύνδεση της εφαρμογής) ----- */
function aiFoodPrompt(desc, qty) {
  return `Είσαι διατροφολόγος. Εκτίμησε τη διατροφική αξία του παρακάτω φαγητού, όπως φτιάχνεται ή σερβίρεται συνήθως στην Ελλάδα.
Φαγητό: ${desc || '(περιγραφή)'}
Ποσότητα: ${qty || '1 κανονική μερίδα ενήλικα'}
Αν η περιγραφή είναι ασαφής, κάνε λογικές υποθέσεις (π.χ. λάδι στο μαγείρεμα) και γράψ' τες στο "notes".
Απάντησε ΜΟΝΟ με μία γραμμή JSON, χωρίς άλλο κείμενο, σε αυτή τη μορφή:
{"name":"σύντομο όνομα","portion_g":350,"kcal":520,"protein":28,"carbs":45,"fat":24,"confidence":"low|medium|high","notes":"υποθέσεις"}
Οι τιμές αφορούν ΟΛΗ την ποσότητα, όχι τα 100 g.`;
}
function parseAiFood(txt) {
  const t = (txt || '').replace(/[“”«»]/g, '"'), first = t.indexOf('{');
  if (first < 0) return null;
  // Δοκιμάζει από το πρώτο «{» έως κάθε «}» (από το τελευταίο προς τα πίσω), ώστε άγκιστρα μέσα στις σημειώσεις να μη σπάνε την ανάγνωση.
  let o = null;
  for (let end = t.lastIndexOf('}'); end > first && !o; end = t.lastIndexOf('}', end - 1)) {
    const c = t.slice(first, end + 1);
    for (const v of [c, c.replace(/(\d),(\d)/g, '$1.$2').replace(/'/g, '"')]) { try { const x = JSON.parse(v); if (x && typeof x === 'object' && !Array.isArray(x)) { o = x; break; } } catch {} }
  }
  if (!o) return null;
  // Αριθμοί ως κείμενο: «520 kcal», «350 g», «1.200» (διαχωριστικό χιλιάδων) = 1200, «7,5» = 7.5
  const n = v => { if (typeof v === 'number') return Number.isFinite(v) && v >= 0 ? v : null; if (v === null || v === undefined || v === '') return null; const s = String(v).trim().replace(/\s*(kcal|g|gr|γρ|ml)\.?$/i, '');
    // Εύρος («24-30»), αβεβαιότητα («45±5») ή άλλο κείμενο («520oops», «28kg») απορρίπτονται αντί να κρατηθεί ο πρώτος αριθμός.
    if (/^\d{1,3}(?:\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, '')); if (!/^\d+(?:[.,]\d+)?$/.test(s)) return null; return Number(s.replace(',', '.')); };
  const r = { name: String(o.name || '').trim(), g: n(o.portion_g), kcal: n(o.kcal), p: n(o.protein), c: n(o.carbs), f: n(o.fat), conf: o.confidence || '', notes: o.notes || '' };
  if (r.kcal === null || r.p === null || r.c === null || r.f === null) return null;
  return r;
}
function openAIFood(prefill) {
  const meal = $('#mealSel') ? $('#mealSel').value : autoMeal();
  openDlg('Σύνθετο φαγητό με AI', `<p class="small">Για φαγητό έξω, σπιτικό πιάτο χωρίς συνταγή ή οτιδήποτε δεν υπάρχει στη βάση. Η εφαρμογή δεν στέλνει τίποτα μόνη της: αντιγράφεις ένα έτοιμο μήνυμα στο AI και επικολλάς πίσω την απάντηση.</p>
    <h3 class="gh">1. Περιέγραψε το φαγητό</h3>
    <label class="f"><span>Τι έφαγες</span><input type="text" id="afD" value="${esc(prefill || '')}" placeholder="π.χ. παστίτσιο ταβέρνας, σουβλάκι μερίδα με πατάτες"></label>
    <label class="f"><span>Πόσο</span><input type="text" id="afQ" placeholder="π.χ. 1 μερίδα, μισό πιάτο, 1 τεμάχιο"></label>
    <h3 class="gh">2. Αντίγραψε και στείλε στο AI</h3>
    <div class="row" style="flex-wrap:wrap;gap:6px"><button class="btn pri sm" id="afCopy">Αντιγραφή μηνύματος</button><a class="btn sm" href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a><a class="btn sm" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini</a><a class="btn sm" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a></div>
    <h3 class="gh">3. Επικόλλησε την απάντηση</h3>${navigator.clipboard && navigator.clipboard.readText ? '<button class="btn sm" id="afPaste" style="margin-bottom:6px">Επικόλληση από το πρόχειρο</button>' : ''}
    <textarea id="afA" placeholder='{"name":"Παστίτσιο","portion_g":380,"kcal":640,...}'></textarea>
    <div id="afPv"></div>`, body => {
    $('#afCopy', body).addEventListener('click', async () => { const t = aiFoodPrompt($('#afD', body).value.trim(), $('#afQ', body).value.trim()); try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast('Αντιγράφηκε. Επικόλλησέ το στο AI.'); });
    const pv = $('#afPv', body);
    const ps = $('#afPaste', body); if (ps) ps.addEventListener('click', async () => { try { const t = await navigator.clipboard.readText(); $('#afA', body).value = t; $('#afA', body).dispatchEvent(new Event('input')); } catch { toast('Δεν επιτράπηκε η ανάγνωση του προχείρου. Επικόλλησε με παρατεταμένο πάτημα.'); } });
    $('#afA', body).addEventListener('input', () => {
      const r = parseAiFood($('#afA', body).value);
      if (!r) { pv.innerHTML = $('#afA', body).value.trim() ? '<p class="note" style="border-color:var(--warn)">Δεν αναγνωρίζω την απάντηση. Επικόλλησε ολόκληρη τη γραμμή που ξεκινά με { και τελειώνει με }.</p>' : ''; return; }
      const at = r.p * 4 + r.c * 4 + r.f * 9, off = Math.abs(at - r.kcal) > Math.max(40, r.kcal * 0.2);
      pv.innerHTML = `<div class="parsed"><label class="f"><span>Όνομα</span><input type="text" id="afN" value="${esc(r.name || $('#afD', body).value)}"></label>
        <div class="grid4"><label class="f"><span>kcal</span><input type="text" inputmode="decimal" id="afK" value="${Math.round(r.kcal)}"></label><label class="f"><span>Πρωτ.</span><input type="text" inputmode="decimal" id="afP" value="${Math.round(r.p)}"></label><label class="f"><span>Υδατ.</span><input type="text" inputmode="decimal" id="afC" value="${Math.round(r.c)}"></label><label class="f"><span>Λίπος</span><input type="text" inputmode="decimal" id="afF" value="${Math.round(r.f)}"></label></div>
        ${r.g ? `<p class="small muted">Ποσότητα ≈${fmt(r.g)} g. Βεβαιότητα AI: ${esc(r.conf)}.</p>` : ''}${r.notes ? `<p class="small muted">Υποθέσεις: ${esc(r.notes)}</p>` : ''}
        ${off ? `<p class="note" style="border-color:var(--warn)">Τα μακροθρεπτικά αντιστοιχούν σε ≈${fmt(at)} kcal. Έλεγξε τις τιμές.</p>` : ''}
        <label class="f"><span>Γεύμα</span>${mealSelect(meal)}</label>
        <div class="radios"><label><input type="checkbox" id="afSave" checked>Αποθήκευση στα φαγητά μου, για να το βρίσκω ξανά</label></div>
        <div class="dlg-f"><button class="btn pri" id="afAdd">Προσθήκη</button></div></div>`;
      $('#afAdd', pv).addEventListener('click', () => {
        const name = $('#afN', pv).value.trim() || 'Φαγητό', fv = id => fieldNum($('#' + id, pv).value, 0, 20000, id === 'afK' ? intIn : numIn), bads = ['afK', 'afP', 'afC', 'afF'].filter(id => fv(id).bad); if (bads.length) { toast('Μη έγκυρος αριθμός. Δεν προστέθηκε.'); return; } const v = id => fv(id).v ?? 0, k = v('afK');
        if (!(k > 0)) { toast('Χρειάζονται θερμίδες.'); return; }
        const portionG = Reliability.inRange(r.g, 1, 5000) ? r.g : null;
        const entry = { id: uid(), name, foodId: null, g: portionG, per100: null, kcal: k, p: v('afP'), c: v('afC'), f: v('afF'), src: 'ai', est: true };
        let notSaved = false;
        if ($('#afSave', pv).checked) {
          const g = portionG || 100, id = 'ai_' + uid();
          const food = { id, name, aliases: [name], src: 'ai', est: true, cat: 'dish', kcal: Math.round(k / g * 1000) / 10, p: Math.round(entry.p / g * 1000) / 10, c: Math.round(entry.c / g * 1000) / 10, f: Math.round(entry.f / g * 1000) / 10, portion: Math.round(g), piece: Math.round(g) };
          // Μη ρεαλιστικές τιμές ανά 100 g (π.χ. πολύ μικρή μερίδα): η καταχώρηση προστίθεται, το τρόφιμο δεν αποθηκεύεται.
          if (Reliability.validateData({ foods: [food] }).length) notSaved = true;
          else { saveCustomFood(food); entry.foodId = id; entry.per100 = { kcal: k / g * 100, p: entry.p / g * 100, c: entry.c / g * 100, f: entry.f / g * 100 }; entry.g = g; entry.qty = 1; entry.unit = 'portion'; }
        }
        addEntries([entry], $('#mealSel', pv).value); closeDlg();
        if (notSaved) toast('Προστέθηκε μόνο η καταχώρηση. Οι τιμές ανά 100 g δεν είναι ρεαλιστικές, γι\' αυτό δεν αποθηκεύτηκε στα φαγητά μου.', 5000);
      });
    });
  });
}

/* ----- «Δικά μου» ----- */
const myFoods = () => foods().list.filter(f => f.custom || f.modified || ['off', 'label', 'recipe', 'ai'].includes(f.src)).sort((a, b) => a.name.localeCompare(b.name, 'el'));
const srcLabel = f => f.src === 'recipe' ? 'συνταγή' : f.src === 'off' ? 'προϊόν' : f.src === 'label' ? 'από ετικέτα' : f.src === 'ai' ? 'εκτίμηση AI' : f.modified ? 'τροποποιημένο' : 'δικό μου';

/* Νέα απόδοση από γεγονός στο παρασκήνιο (νέα έκδοση, πρόταση εγκατάστασης): όχι ενώ γράφεις σε πεδίο της σελίδας,
   γιατί τα πεδία αποθηκεύονται όταν ολοκληρωθεί η πληκτρολόγηση και θα χανόταν ό,τι γράφεται. */
let renderDeferred = false;
function renderSoon() {
  const a = document.activeElement, main = $('#main');
  if (!main || !a || !main.contains(a) || !a.matches('textarea,select,input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit])')) { renderDeferred = false; render(); return; }
  if (renderDeferred) return; renderDeferred = true;
  main.addEventListener('focusout', () => setTimeout(() => { renderDeferred = false; renderSoon(); }, 0), { once: true });
}

/* ----- Αποθηκευτικός χώρος: παρακολούθηση και προειδοποίηση πριν γεμίσει ----- */
const Quota = (() => {
  let est = null;
  async function refresh() { try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); est = { usage: +e.usage || 0, quota: +e.quota || 0 }; } } catch {} return est; }
  // Κρίσιμο: >90% ή <30 MB ελεύθερα· προειδοποίηση: >75% ή <100 MB ελεύθερα.
  function level() { if (!est || !est.quota) return 'unknown'; const free = est.quota - est.usage, r = est.usage / est.quota; return r > 0.9 || free < 30e6 ? 'critical' : r > 0.75 || free < 100e6 ? 'warn' : 'ok'; }
  const photoBytes = () => photoKeys().reduce((a, k) => a + ((Store.peek(k) || {}).data || '').length, 0);
  return { refresh, level, get: () => est, photoBytes };
})();
const MB = b => fmt(b / 1048576, b < 10485760 ? 1 : 0) + ' MB';
function quotaBannerHTML() {
  const l = Quota.level(), e = Quota.get(); if (l !== 'warn' && l !== 'critical') return '';
  return `<div class="banner" style="border-color:var(--over)"><span><b>${l === 'critical' ? 'Ο χώρος αποθήκευσης σχεδόν γέμισε' : 'Ο χώρος αποθήκευσης γεμίζει'}</b><br><span class="small muted">Χρησιμοποιούνται ${MB(e.usage)} από ${MB(e.quota)}. Κάνε Export και σβήσε παλιές φωτογραφίες προόδου (${MB(Quota.photoBytes())}), για να μη χαθούν νέες καταγραφές.</span></span><button class="btn sm pri" data-act="export">Export</button></div>`;
}

/* ----- Ενημερώσεις εφαρμογής ----- */
/* Η νέα έκδοση εγκαθίσταται στο παρασκήνιο και ενεργοποιείται όταν ξανανοίξει η εφαρμογή, ή αμέσως με «Ενημέρωση τώρα»,
   μόνο αφού επιβεβαιωθεί ότι αποθηκεύτηκαν όλα τα δεδομένα. */
const Updates = (() => {
  let reg = null, state = '';
  const TEXT = { ready: 'Υπάρχει νέα έκδοση, έτοιμη για εγκατάσταση.', current: 'Έχεις την τελευταία έκδοση.', checking: 'Έλεγχος για νέα έκδοση…', downloading: 'Η νέα έκδοση κατεβαίνει. Θα εμφανιστεί «Ενημέρωση τώρα» μόλις ολοκληρωθεί.', offline: 'Δεν έγινε έλεγχος: δεν υπάρχει σύνδεση ή ο ιστότοπος δεν απάντησε.', unsupported: 'Ο έλεγχος ενημερώσεων λειτουργεί όταν η εφαρμογή ανοίγει από τη διεύθυνσή της (https).' };
  const text = () => TEXT[state] || '';
  function set(s) { const was = state; state = s; const el = document.getElementById('updStatus'); if (el) el.textContent = text(); if (s === 'ready' && was !== 'ready' && booted) renderSoon(); }
  function watch(r) {
    if (reg === r) return;
    reg = r; if (r.waiting && navigator.serviceWorker.controller) set('ready');
    r.addEventListener('updatefound', () => { const w = r.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) set('ready'); else if (w.state === 'redundant' && state === 'downloading') set('offline'); }); });
  }
  async function check(manual) {
    // Αμέσως μετά το άνοιγμα η καταχώριση του service worker μπορεί να μην έχει ολοκληρωθεί ακόμη.
    if (!reg && 'serviceWorker' in navigator && location.protocol.startsWith('http')) { try { const r = await navigator.serviceWorker.getRegistration(); if (r) watch(r); } catch {} }
    if (!reg) { set('unsupported'); return; }
    set('checking');
    // Όριο χρόνου: σε δίκτυο που δεν απαντά, το μήνυμα δεν μένει για πάντα στο «Έλεγχος…».
    try { await Promise.race([reg.update(), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 30000))]); } catch { set('offline'); return; }
    const w = reg.installing;
    if (w) await new Promise(res => { const t = setTimeout(res, 20000); w.addEventListener('statechange', () => { if (w.state !== 'installing') { clearTimeout(t); res(); } }); });
    set(reg.waiting ? 'ready' : reg.installing ? 'downloading' : 'current'); if (manual && state === 'current') toast(TEXT.current);
  }
  async function apply() {
    if (!reg || !reg.waiting) { check(true); return; }
    try { await Store.flush(); } catch {}
    const i = Store.info();
    if (i.pending || i.lastError || i.mode === 'memory') { toast('Η αποθήκευση δεν επιβεβαιώθηκε. Κάνε Export πριν την ενημέρωση.', 6000); return; }
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
    reg.waiting.postMessage('skipWaiting');
  }
  return { watch, check, apply, text, ready: () => state === 'ready' };
})();
function updateBannerHTML() {
  return Updates.ready() ? '<div class="banner"><span><b>Νέα έκδοση διαθέσιμη</b><br><span class="small muted">Τα δεδομένα σου δεν επηρεάζονται.</span></span><button class="btn sm pri" data-act="applyUpdate">Ενημέρωση τώρα</button></div>' : '';
}

/* ----- Αναίρεση (αντί για «Είσαι σίγουρος;») ----- */
let undoT;
function undoToast(msg, fn) {
  const u = $('#undo'); if (!u) { toast(msg); return; }
  window._undoFn = fn; $('#undoMsg').textContent = msg; u.classList.add('show');
  clearTimeout(undoT); undoT = setTimeout(() => { u.classList.remove('show'); window._undoFn = null; }, 6000);
}

</script>
