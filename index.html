<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weight me up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Weight me up</title>
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E8ECF1; --ink:#0F1E3D; --muted:#6A7488; --line:#E1E6ED;
  --accent:#1B3A6B; --accent-ink:#FFFFFF; --accent-soft:#DCE5F2; --over:#C0443B; --warn:#B7791F;
  --p:#1B3A6B; --c:#5E82BE; --f:#A3AFC2;
  --r-lg:16px; --r-sm:10px; --shadow:0 1px 2px rgba(15,30,61,.04),0 4px 16px rgba(15,30,61,.04);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#111B2E; --sunk:#18253C; --ink:#E7ECF4; --muted:#8B98AF; --line:#1F2D46;
  --accent:#8EB0E6; --accent-ink:#0A1220; --accent-soft:#1C2C4A; --over:#E57368; --warn:#E0A43A;
  --p:#8EB0E6; --c:#5677AE; --f:#5E6B82; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111B2E; --sunk:#18253C; --ink:#E7ECF4; --muted:#8B98AF; --line:#1F2D46;
  --accent:#8EB0E6; --accent-ink:#0A1220; --accent-soft:#1C2C4A; --over:#E57368; --warn:#E0A43A;
  --p:#8EB0E6; --c:#5677AE; --f:#5E6B82; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.05rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
p{margin:.3rem 0}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* Κεφαλίδα */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.brand{font-weight:750;letter-spacing:-.01em;font-size:1.05rem}
.brand small{font-weight:500;color:var(--muted);margin-left:6px;font-size:.8rem}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{border:0;background:none;padding:8px 10px;border-radius:var(--r-sm)}
.datenav button:hover{background:var(--sunk)}
.datenav .lbl{font-weight:600;min-width:9.5em;text-align:center}
.datenav .lbl.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

/* Κάτω πλοήγηση */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.bottom button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--accent);font-weight:650}

/* Ενότητες */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.sec > h2{margin-bottom:10px}
.sec.flat{background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1}
.hr{height:1px;background:var(--line);margin:12px 0}

/* Σήμανση εκτιμώμενων / χειροκίνητων τιμών */
.est{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px}
.est::before{content:"≈";margin-right:1px;opacity:.75}
.man::after{content:"✎";font-size:.75em;margin-left:3px;color:var(--warn)}

/* Ισοζύγιο ημέρας */
.ledger .remain{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ledger .big{font-size:2.6rem;font-weight:780;letter-spacing:-.03em;line-height:1}
.ledger .big.over{color:var(--over)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:10px 0 6px}
.bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.bar > i.over{background:var(--over)}
.bar.thin{height:7px;margin:4px 0 0}
.ledger .figs{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.ledger .figs b{color:var(--ink);font-weight:650}
.macros{display:grid;gap:9px;margin-top:14px}
.macro .row{font-size:.86rem}
.macro .name{font-weight:600}
.macro[data-m="p"] .bar > i{background:var(--p)} .macro[data-m="c"] .bar > i{background:var(--c)} .macro[data-m="f"] .bar > i{background:var(--f)}
.macro .bar > i.over{background:var(--over)}

/* Διακόπτης καρτελών */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;margin:14px 0 4px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Γεύματα */
.meal{margin:12px 0}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list li + li{border-top:1px solid var(--line)}
.item{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border:0;background:none;text-align:left}
.item:hover{background:var(--sunk)}
.item .nm{font-weight:550}
.item .sub{font-size:.8rem;color:var(--muted)}
.item .kc{margin-left:auto;font-weight:650;white-space:nowrap}
.addbtn{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px dashed var(--line);
  border-radius:var(--r-lg);background:none;color:var(--accent);font-weight:600;margin-top:6px}
.addbtn:hover{background:var(--surface)}
.empty{padding:12px;color:var(--muted);font-size:.88rem;text-align:center}

/* Κουμπιά & πεδία */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--over)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.linkish{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
label.f{display:block;font-size:.84rem;color:var(--muted);margin-bottom:10px}
label.f > span{display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:40px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media (max-width:380px){.grid4{grid-template-columns:1fr 1fr}}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.9rem;color:var(--ink);background:var(--surface)}
.radios input{margin:0;accent-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:var(--r-lg);padding:10px 12px;margin:12px 0;font-size:.9rem}

/* Άσκηση */
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin:10px 0}
.exc .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.exc .hd .linkish{text-align:left;color:var(--ink);font-size:1rem}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:.75rem;font-weight:600;color:var(--muted);text-align:left;padding:2px 4px}
.sets td{padding:3px 4px}
.sets td:first-child{width:2em;color:var(--muted);font-size:.85rem}
.sets td:last-child{width:2.4em;text-align:right}
.sets input{min-height:38px;text-align:center}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:6px}
.x:hover{color:var(--over)}
.fb{font-size:.86rem;margin-top:8px;padding:7px 10px;border-radius:var(--r-sm);background:var(--sunk)}
.fb.up{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.fb.stall{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.fb.down{background:color-mix(in srgb,var(--over) 14%,transparent)}
.fb:empty{display:none}

/* Εβδομάδα */
.weekbal .big{font-size:2.4rem;font-weight:780;letter-spacing:-.03em;line-height:1.05}
.weekbal .big.neg{color:var(--accent)} .weekbal .big.pos{color:var(--over)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-weight:650;font-size:1.05rem}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:right;font-weight:600;color:var(--muted);font-size:.76rem;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--sunk)}
.tbl .neg{color:var(--accent)} .tbl .pos{color:var(--over)}
.scroll-x{overflow-x:auto}
canvas.chart{width:100%;height:180px;display:block}

/* Διάλογος */
dialog{border:0;padding:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;margin:auto auto 0;
  background:var(--surface);color:var(--ink);overflow:hidden}
@media (min-width:700px){dialog{border-radius:18px;margin:auto}}
dialog::backdrop{background:rgba(5,15,18,.5)}
dialog[open]{display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.dlg-b{padding:4px 16px 16px;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.results{list-style:none;padding:0;margin:8px 0;max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.results li + li{border-top:1px solid var(--line)}
.results .item{padding:9px 10px}
.results .item[aria-selected="true"]{background:var(--sunk)}
.parsed{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;margin:8px 0}
.parsed.miss{border-style:dashed}
.preview{display:flex;gap:12px;flex-wrap:wrap;font-size:.88rem;margin:6px 0}
.preview b{font-weight:650}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:10px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}

/* v2 */
.daykind{margin:8px 0 0;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}
.sweet{border-color:var(--accent-soft);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.sweet h2{color:var(--accent)}
ul.plain{list-style:none;margin:8px 0 0;padding:0}
.sweet-opt{padding:8px 0;border-top:1px solid var(--line)}
.qtyw{display:grid;grid-template-columns:5.5em 1fr;gap:8px}
.sets td.rir{width:4.2em}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rec{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:var(--r-sm);padding:9px 12px}
.rec p{margin:.25rem 0 0;font-size:.92rem}
.rec .src{font-size:.78rem}
.rec.act{border-left-color:var(--p)} .rec.watch{border-left-color:var(--warn)} .rec.good{border-left-color:var(--accent)}
.big2{font-size:2.1rem;font-weight:780;letter-spacing:-.03em}
.vol{display:grid;gap:6px;margin-top:6px}
.volrow{display:grid;grid-template-columns:8.6em 1fr 4.6em;align-items:center;gap:8px;font-size:.84rem}
.volrow .vn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.vb .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.vb .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--ink);border-radius:3px;opacity:.75}
.volrow.low .fill{background:var(--warn);opacity:1} .volrow.high .fill{background:var(--over);opacity:1} .volrow.ok .fill{background:var(--accent);opacity:1}
.volrow .vv{text-align:right;font-weight:650} .volrow .vv small{font-weight:400;color:var(--muted)}
@media (max-width:360px){.volrow{grid-template-columns:7em 1fr 4.4em}}

/* v3 */
#timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg)}
.tm-in{display:flex;align-items:center;gap:8px;padding:8px 14px}
.tm-in b{font-size:1.4rem;font-weight:780;min-width:3.2em}
.tm-bar{flex:1;height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--accent);width:0}
#timer .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
#timer .x{color:var(--bg)}
.plan{margin-top:4px;color:var(--p)}
.sets.pg td{padding:2px}.sets.pg input{min-height:34px;padding:4px;text-align:center}
.sets.pg .pgname{font-size:.84rem;color:var(--ink);width:auto}
.sets.pg .rng{white-space:nowrap}.sets.pg .rng input{width:2.6em}
.sets.pg td:first-child{width:auto}
.sets.pg td:nth-child(2) input,.sets.pg td:nth-child(4) input{width:3em}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph{border:0;padding:0;background:none;text-align:left}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.ph span{font-size:.75rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp figure{margin:0}.cmp img{width:100%;border-radius:8px;display:block}
.cmp figcaption{font-size:.8rem;color:var(--muted);text-align:center}
.ci{margin:8px 0}.ci .chips{margin:4px 0 0}.ci .chip{min-width:44px;text-align:center}
a.btn{text-decoration:none;color:inherit;display:inline-block}
#timer:not([hidden]) ~ #toast{bottom:calc(136px + env(safe-area-inset-bottom,0px))}

/* v4 */
.seg5 button{font-size:.78rem;padding:8px 2px}
.pthumb{width:40px;height:40px;object-fit:contain;border-radius:6px;background:#fff;flex:none}
.pthumb.lg{width:64px;height:64px}
.tbl.nut td{padding:5px 4px}
.scanbox{position:relative;margin:10px 0}
.scanbox video{width:100%;max-height:52vh;object-fit:cover;border-radius:10px;background:#000;display:block}
.scanframe{position:absolute;left:12%;right:12%;top:32%;height:22%;border:3px solid var(--accent);border-radius:10px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.25)}

/* v4.2 σχεδιασμός */
h2{font-size:.98rem;font-weight:650;letter-spacing:-.005em}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.brand{color:var(--accent);letter-spacing:-.02em}
.bottom{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.list,.exc,.parsed,.results{border-radius:var(--r-lg)}
.list,.exc{box-shadow:var(--shadow)}
.btn{border-radius:12px}
.btn.pri{box-shadow:0 1px 2px rgba(15,30,61,.15)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{background:var(--sunk);border-radius:12px}
.seg button[aria-selected="true"]{color:var(--accent)}
.addbtn{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.bar{height:10px;background:var(--sunk)}
.bar.thin{height:6px}
.ledger-top{display:grid;grid-template-columns:136px 1fr;gap:16px;align-items:center}
.ring{width:136px;height:136px;display:block}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--accent);transition:stroke-dasharray .5s ease} .ring .ov{stroke:var(--over)}
.ring .num{font-size:25px;font-weight:780;fill:var(--ink);letter-spacing:-.5px}
.ring .num.over{fill:var(--over)}
.ring .lbl{font-size:10.5px;fill:var(--muted)}
.ledger .kv{display:grid;gap:8px}
.ledger .kv div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:.88rem;color:var(--muted)}
.ledger .kv div:last-child{border-bottom:0}
.ledger .kv b{color:var(--ink);font-weight:650;font-size:1rem}
.macros{margin-top:16px}
.macro .name{font-weight:550;font-size:.86rem}
.macro .name::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--mc)}
.macro[data-m="p"]{--mc:var(--p)} .macro[data-m="c"]{--mc:var(--c)} .macro[data-m="f"]{--mc:var(--f)}
.macro .bar > i{background:var(--mc)!important}
.macro .bar > i.over{background:var(--over)!important}
canvas.chart{height:200px}
.rec{border:1px solid var(--line);border-left-width:3px;background:var(--surface)}
.rec.act{border-left-color:var(--accent)} .rec.good{border-left-color:var(--c)}
.vb .fill{top:2px;bottom:2px;border-radius:4px}
.volrow.ok .fill{background:var(--accent)}
.weekbal .big.neg{color:var(--accent)}
.tbl .neg{color:var(--accent)}
@media (max-width:360px){.ledger-top{grid-template-columns:112px 1fr}.ring{width:112px;height:112px}}

/* v5 */
.rcrow{border-top:1px solid var(--line);padding:8px 0}
.rcrow .qtyw{flex:1}

/* ================= v6: μοντέρνος σχεδιασμός ================= */
:root{--r-lg:22px;--r-sm:12px;--shadow:0 1px 2px rgba(15,30,61,.04),0 10px 30px rgba(15,30,61,.07);--hero1:#0F1E3D;--hero2:#23427A}
:root[data-theme="dark"]{--hero1:#15264A;--hero2:#2A4B85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero1:#15264A;--hero2:#2A4B85}}
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--accent) 9%,var(--bg)) 0%,var(--bg) 60%) fixed;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{border-bottom:0;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.top .wrap{min-height:58px}
.brand{font-size:1.12rem;font-weight:800;letter-spacing:-.03em;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{width:28px;height:28px;flex:none;background:var(--accent);-webkit-mask:url(logo-mask.png) center/contain no-repeat;mask:url(logo-mask.png) center/contain no-repeat}
.datenav{background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:2px}
.datenav button{border-radius:999px;padding:7px 10px}
.datenav .lbl{font-size:.88rem;min-width:5.6em;white-space:nowrap}
.sec{border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.sec > h2{font-size:1rem;margin-bottom:12px}
/* Hero */
.hero{position:relative;overflow:hidden;margin:14px 0 12px;padding:20px 20px 16px;border-radius:26px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,var(--hero2) 0%,var(--hero1) 60%);box-shadow:0 14px 34px rgba(15,30,61,.28)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .eyebrow{font-size:.78rem;letter-spacing:.04em;opacity:.7}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero-num{font-size:3rem;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin-top:4px}
.hero-num.over{color:#FFB4AB}
.hero-sub{font-size:.88rem;opacity:.75}
.hero-ring{width:96px;height:96px;flex:none}
.hero-ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.hr-bg{stroke:rgba(255,255,255,.14)} .hr-fg{stroke:#fff;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)} .hr-ov{stroke:#FF8A80}
.hr-pct{fill:#fff;font-size:19px;font-weight:750}
.hero-kv{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:16px}
.hero-kv div{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 10px;display:grid;grid-template-columns:18px 1fr;column-gap:6px;align-items:center}
.hero-kv svg{width:16px;height:16px;opacity:.7;grid-row:span 2}
.hero-kv span{font-size:.72rem;opacity:.7}
.hero-kv b{font-size:1rem;font-weight:700}
.hero-tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.78rem;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:999px}
.hero-tag svg{width:14px;height:14px}
.mrings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.mring{display:flex;align-items:center;gap:7px;min-width:0}
.mring svg{width:34px;height:34px;flex:none}
.mring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.mr-t{min-width:0}
.mr-bg{stroke:rgba(255,255,255,.14)}
.mring[data-m="p"] .mr-fg{stroke:#fff} .mring[data-m="c"] .mr-fg{stroke:#9DBBEA} .mring[data-m="f"] .mr-fg{stroke:#C9D3E3}
.mr-fg.over{stroke:#FF8A80!important}
.mring b{display:block;font-size:.92rem;font-weight:750;line-height:1.15;white-space:nowrap}
.mring b span{font-size:.68rem;font-weight:500;opacity:.65}
.mring small{font-size:.7rem;opacity:.7}
/* Γρήγορες ενέργειες */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}
.quick button{border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:.76rem;font-weight:600}
.quick button svg{width:22px;height:22px;color:var(--accent)}
.quick button:active{transform:scale(.97)}
/* Κάρτες γευμάτων */
.mealcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.mc-h{display:flex;align-items:center;gap:12px;padding:14px 14px 12px}
.mc-h h3{font-size:1rem}
.mc-ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.mc-ic svg{width:21px;height:21px}
.pill{background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:650;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.list.inner{border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
.mc-f{border-top:1px solid var(--line);padding:9px 14px}
.mc-f .linkish{display:inline-flex;align-items:center;gap:6px}
.mc-f svg{width:15px;height:15px}
/* Αιωρούμενη πλοήγηση */
.bottom{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:0;border:0;border-radius:24px;box-shadow:0 10px 30px rgba(15,30,61,.16);background:color-mix(in srgb,var(--surface) 90%,transparent)}
.bottom .wrap{padding:6px}
.bottom button{border-radius:18px;padding:8px 0 7px;font-size:.72rem;transition:background .2s,color .2s}
.bottom button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
#fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;z-index:6;
  background:linear-gradient(145deg,var(--hero2),var(--hero1));color:#fff;box-shadow:0 10px 24px rgba(15,30,61,.35);display:grid;place-items:center}
#fab[hidden]{display:none}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.95)}
#timer{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:12px;right:12px;border-radius:18px}
#timer:not([hidden]) ~ #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:14px}
/* Φόρμες & κουμπιά */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.btn{border:0;background:var(--sunk);border-radius:14px;padding:10px 16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;border-radius:12px}
.seg{padding:4px;border-radius:16px}
.seg button{border-radius:12px;padding:9px 4px}
.addbtn{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:18px;padding:14px}
.exc{border:0;border-radius:var(--r-lg);padding:16px}
.banner{border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.banner .btn{white-space:nowrap;flex:none}
.list{border:0;box-shadow:var(--shadow)}
.results{border:0;background:var(--sunk)}
.parsed{border:0;background:var(--sunk);border-radius:16px}
.parsed.miss{background:transparent;border:1px dashed var(--line)}
dialog{border-radius:26px 26px 0 0}
.dlg-h{padding:18px 18px 8px}
.dlg-h::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px}
.stats{gap:8px}
.weekbal .big{font-size:2.3rem;letter-spacing:-.04em}
.rec{border:0;border-radius:16px;background:var(--sunk);border-left:4px solid var(--muted)}
.rec.act{border-left-color:var(--accent)} .rec.watch{border-left-color:var(--warn)} .rec.good{border-left-color:var(--c)}
.sweet{border:0;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 65%)}
@media (max-width:360px){.hero-num{font-size:2.5rem}.hero-ring{width:80px;height:80px}.quick button span{font-size:.7rem}}
@media (prefers-reduced-motion:reduce){.hr-fg{transition:none}}

/* v7 */
.rt{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rtrow{display:flex;gap:6px;align-items:stretch}
.rtrow > button:first-child{flex:1}
.rt .skip{border:0;background:none;color:var(--muted);font-size:.74rem;padding:0 6px;border-radius:10px;white-space:nowrap}
.rt li button:not(.skip){width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:var(--sunk);border-radius:14px;padding:10px 12px;color:var(--ink)}
.rt li.done button{background:transparent;opacity:.62}
.rt li.done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.rt .ck{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.rt li.done .ck{background:var(--accent);border-color:var(--accent)}
.rt .ck svg{width:15px;height:15px}
.rt .go{color:var(--muted);font-size:1.2rem}
.rt .freq{display:block;font-size:.68rem;font-weight:650;letter-spacing:.03em;color:var(--accent);text-transform:none}
.opt{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-weight:500}
.rt-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:0;color:var(--ink);margin-bottom:10px}
.rt-prog{position:relative;width:44px;height:44px;flex:none}
.rt-prog svg{width:44px;height:44px}
.rt-prog circle{fill:none;stroke-width:4;stroke-linecap:round}
.mr-bg2{stroke:var(--sunk)} .mr-fg2{stroke:var(--accent)}
.rt-prog b{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem}
.rtcard .go{font-size:1rem}
.gh{font-size:.9rem;margin:14px 0 6px;color:var(--accent)}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guide li{background:var(--sunk);border-radius:14px;padding:10px 12px}
.mf{margin:0 0 12px}
.how{font-size:.8rem;color:var(--muted);margin:5px 2px 0;line-height:1.4}
.bulk{display:grid;gap:4px;margin-top:8px}
.bh,.br{display:grid;grid-template-columns:5.2em repeat(4,1fr);gap:4px;align-items:center}
.bh span{font-size:.72rem;color:var(--muted);font-weight:600}
.br input{min-height:38px;padding:6px;text-align:center}
.bd{font-size:.8rem;font-weight:600}
.br.has{opacity:.6}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}#toast{transition:none}.ring .fg{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" id="title">Weight me up</div>

    <button data-act="dayPrev" aria-label="Προηγούμενη ημέρα">‹</button>

  </div>
</div></header>

<nav class="bottom" aria-label="Κύρια πλοήγηση"><div class="wrap">

  <button data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Πρόοδος</button>
  <button data-nav="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Προφίλ</button>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg-h"><h2 id="dlgTitle"></h2><button class="x" data-act="dlgClose" aria-label="Κλείσιμο">✕</button></div><div class="dlg-b" id="dlgBody"></div></dialog>

<div id="timer" hidden><div class="wrap tm-in"><b id="tmTxt">0:00</b><div class="tm-bar"><i id="tmBar"></i></div><button class="btn sm" data-act="tmSub">−15″</button><button class="btn sm" data-act="tmAdd">+15″</button><button class="x" data-act="tmStop" aria-label="Διακοπή χρονομέτρου">✕</button></div></div>

/* ===== ΚΑΘΑΡΗ ΛΟΓΙΚΗ (χωρίς DOM) ===== */
const Calc = (() => {
  const ACTIVITY = {
    sedentary: { f: 1.2,   label: 'Καθιστική (γραφείο, ελάχιστη κίνηση)' },
    light:     { f: 1.375, label: 'Ελαφριά (1–3 προπονήσεις/εβδ.)' },
    moderate:  { f: 1.55,  label: 'Μέτρια (3–5 προπονήσεις/εβδ.)' },
    active:    { f: 1.725, label: 'Έντονη (6–7 προπονήσεις/εβδ.)' },
    very:      { f: 1.9,   label: 'Πολύ έντονη (χειρωνακτική εργασία + προπόνηση)' },
  };
  /* pct: μεταβολή θερμίδων έναντι TDEE. ppk: g πρωτεΐνης/kg σωματικού βάρους (Morton 2018: 1,6 με άνω όριο ~2,2).
     pffm: g/kg άλιπης μάζας όταν υπάρχει εκτίμηση λίπους (Helms 2014: 2,3–3,1 g/kg FFM σε έλλειμμα).
     rate: επιθυμητός ρυθμός μεταβολής βάρους, % σωματικού βάρους/εβδομάδα
     (Helms 2014, Garthe 2011: 0,5–1% σε έλλειμμα· Iraki 2019: ~0,25–0,5% σε πλεόνασμα). */
  const GOALS = {
    cut:      { pct: -17.5, ppk: 2.2, pffm: 2.6, rate: [-1.0, -0.5],  label: 'Μείωση λίπους', minSets: 8 },
    bulk:     { pct: 10,    ppk: 1.8, pffm: 2.2, rate: [0.1, 0.5],    label: 'Αύξηση μυϊκής μάζας', minSets: 10 },
    recomp:   { pct: -5,    ppk: 2.0, pffm: 2.4, rate: [-0.4, 0.05],  label: 'Μείωση λίπους + αύξηση μυών', minSets: 10 },
    maintain: { pct: 0,     ppk: 1.6, pffm: 2.0, rate: [-0.2, 0.2],   label: 'Διατήρηση', minSets: 6 },
  };
  const num = v => v === '' || v === null || v === undefined || isNaN(+v) ? null : +v;

  /* ---- BMR ---- */
  function mifflin(sex, kg, cm, age) { return (kg > 0 && cm > 0 && age > 0) ? 10 * kg + 6.25 * cm - 5 * age + (sex === 'f' ? -161 : 5) : null; }
  function katch(ffm) { return ffm > 0 ? 370 + 21.6 * ffm : null; }

  /* ---- Σύσταση σώματος ---- */
  // RFM (Woolcott & Bergman 2018), επικυρωμένο έναντι DXA
  function rfm(sex, hCm, waistCm) { return hCm > 0 && waistCm > 0 ? (sex === 'f' ? 76 : 64) - 20 * (hCm / waistCm) : null; }
  // US Navy (Hodgdon & Beckett 1984) σε ίντσες
  function navy(sex, hCm, waist, neck, hip) {
    const i = x => x / 2.54;
    if (!(hCm > 0 && waist > 0 && neck > 0)) return null;
    if (sex === 'f') { if (!(hip > 0) || waist + hip - neck <= 0) return null; return 163.205 * Math.log10(i(waist + hip - neck)) - 97.684 * Math.log10(i(hCm)) - 78.387; }
    if (waist - neck <= 0) return null;
    return 86.010 * Math.log10(i(waist - neck)) - 70.041 * Math.log10(i(hCm)) + 36.76;
  }
  // Deurenberg 1991: μόνο ως χονδρική εφεδρεία όταν δεν υπάρχουν μετρήσεις
  function deurenberg(sex, kg, hCm, age) { if (!(kg > 0 && hCm > 0 && age > 0)) return null; const bmi = kg / (hCm / 100) ** 2; return 1.2 * bmi + 0.23 * age - 10.8 * (sex === 'f' ? 0 : 1) - 5.4; }
  /* Επιστρέφει {bf, src, parts}. Προτεραιότητα: χειροκίνητη τιμή > μέσος όρος RFM & Navy > ζυγαριά > Deurenberg */
  function bodyFat(profile, m, kg, scaleAvg) {
    const h = num(profile.height), manual = num(profile.bfManual);
    if (manual !== null) return { bf: manual, src: 'manual', parts: [], scale: scaleAvg ?? null };
    const parts = [];
    if (m) {
      const r = rfm(profile.sex, h, num(m.waist)); if (r !== null && r > 2 && r < 60) parts.push({ k: 'RFM', v: r });
      const n = navy(profile.sex, h, num(m.waist), num(m.neck), num(m.hip)); if (n !== null && n > 2 && n < 60) parts.push({ k: 'US Navy', v: n });
    }
    const sc = scaleAvg ?? (m ? num(m.scaleBf) : null);
    // Η μεζούρα προηγείται· η ζυγαριά BIA χρησιμοποιείται μόνο αν δεν υπάρχουν μετρήσεις
    if (parts.length) return { bf: parts.reduce((a, p) => a + p.v, 0) / parts.length, src: 'tape', parts, scale: sc };
    if (sc !== null && sc !== undefined) return { bf: sc, src: 'scale', parts: [], scale: sc };
    const d = deurenberg(profile.sex, kg, h, num(profile.age));
    return d !== null ? { bf: d, src: 'bmi', parts: [] } : null;
  }

  /* ---- Στόχοι ----
     opts: {bf (0-100 ή null), bfSrc, adaptive: {tdee, confidence} ή null, useAdaptive} */
  function targets(profile, kg, opts = {}) {
    const g = GOALS[profile.goal] || GOALS.maintain, o = profile.overrides || {};
    const mif = mifflin(profile.sex, kg, num(profile.height), num(profile.age));
    if (mif === null) return null;
    // Άλιπη μάζα μόνο από μετρήσεις/χειροκίνητη τιμή (όχι από BMI)
    const bfReliable = opts.bf !== null && opts.bf !== undefined && opts.bfSrc !== 'bmi';
    const ffm = bfReliable ? kg * (1 - opts.bf / 100) : null;
    const kat = ffm ? katch(ffm) : null;
    // Katch-McArdle όταν υπάρχει άλιπη μάζα (ακριβέστερο σε γυμνασμένους), αλλιώς Mifflin-St Jeor
    const bmr = kat ?? mif, bmrMethod = kat ? 'Katch-McArdle' : 'Mifflin-St Jeor';
    const actF = (ACTIVITY[profile.activity] || ACTIVITY.moderate).f;
    const formulaTdee = bmr * actF;
    const ad = opts.adaptive;
    let tdee = formulaTdee, tdeeSrc = 'formula';
    if (num(o.tdee) !== null) { tdee = num(o.tdee); tdeeSrc = 'manual'; }
    else if (opts.useAdaptive && ad && ad.confidence > 0) { tdee = ad.confidence * ad.tdee + (1 - ad.confidence) * formulaTdee; tdeeSrc = ad.confidence >= 0.99 ? 'adaptive' : 'blend'; }
    const pct = num(profile.goalPct) ?? g.pct;
    const kcal = num(o.kcal) ?? tdee * (1 + pct / 100);
    let p, pBasis;
    if (num(o.p) !== null) { p = num(o.p); pBasis = 'manual'; }
    else if (num(profile.proteinPerKg) !== null) { p = num(profile.proteinPerKg) * kg; pBasis = 'bw'; }
    else if (ffm) { p = Math.min(g.pffm * ffm, 2.4 * kg); pBasis = 'ffm'; }
    else { p = g.ppk * kg; pBasis = 'bw'; }
    const fatPct = num(profile.fatPct) ?? 27;
    const f = num(o.f) ?? Math.max((kcal * fatPct / 100) / 9, 0.6 * kg);
    const cRaw = (kcal - p * 4 - f * 9) / 4;
    const c = num(o.c) ?? Math.max(0, cRaw);
    return {
      bmr, bmrMethod, mifflin: mif, katch: kat, ffm, bf: opts.bf ?? null, bfSrc: opts.bfSrc || null,
      actF, formulaTdee, tdee, tdeeSrc, tdeeManual: tdeeSrc === 'manual', pct, ppk: g.ppk, pffm: g.pffm, pBasis, fatPct,
      kcal, kcalManual: num(o.kcal) !== null, p, pManual: pBasis === 'manual', f, fManual: num(o.f) !== null, c, cManual: num(o.c) !== null,
      carbWarning: num(o.c) === null && cRaw < 0, macroKcal: p * 4 + c * 4 + f * 9, weight: kg, goal: profile.goal,
    };
  }

  /* ---- Κατανομή θερμίδων: περισσότερες το ΣΚ ή το ΠΣΚ, ίδιο εβδομαδιαίο σύνολο ----
     mode: 'none' | 'weekend' (Σάβ-Κυρ) | 'long' (Παρ-Κυρ). boost: kcal ανά «υψηλή» ημέρα (null = αυτόματο).
     Αυτόματο: +20% της βάσης, έως 450 kcal, χωρίς οι καθημερινές να πέφτουν κάτω από το ελάχιστο. */
  function highDaysOf(mode) { return mode === 'weekend' ? [6, 0] : mode === 'long' ? [5, 6, 0] : []; }
  function split(baseKcal, mode, boostSetting, minKcal) {
    const hi = highDaysOf(mode);
    if (!hi.length) return { hiDays: [], boost: 0, cut: 0, limited: false };
    const nH = hi.length, nL = 7 - nH, floor = minKcal || 0;
    const maxByFloor = Math.max(0, (baseKcal - floor) * nL / nH);
    const want = boostSetting !== null && boostSetting !== undefined ? boostSetting : Math.min(0.2 * baseKcal, 450);
    const boost = Math.max(0, Math.min(want, maxByFloor));
    return { hiDays: hi, boost, cut: boost * nH / nL, limited: boost < want - 1 };
  }
  /* Στόχος συγκεκριμένης ημέρας. Η πρωτεΐνη μένει σταθερή· λίπος και υδατάνθρακες κλιμακώνονται. */
  function dayTarget(t, dow, sp) {
    if (!t) return null;
    let delta = 0, kind = 'normal';
    if (sp && sp.hiDays.length) { if (sp.hiDays.includes(dow)) { delta = sp.boost; kind = 'high'; } else { delta = -sp.cut; kind = 'low'; } }
    const kcal = t.kcal + delta;
    const nonP = t.kcal - t.p * 4, k = nonP > 0 ? (kcal - t.p * 4) / nonP : 1;
    return { kcal, p: t.p, c: t.c * k, f: t.f * k, tdee: t.tdee, bmr: t.bmr, kind, delta, base: t.kcal };
  }

  function watchAdjusted(reported, correctionPct) {
    if (reported === null || reported === undefined || reported === '') return null;
    return reported * (1 - (correctionPct || 0) / 100);
  }
  function dayExpenditure(snap, watch, settings) {
    if (!snap) return null;
    if (settings.energyMode === 'watch' && watch && num(watch.kcal) !== null) {
      const adj = num(watch.kcalOverride) ?? watchAdjusted(num(watch.kcal), settings.watchCorrection);
      return { v: snap.bmr * (settings.baseFactor || 1.15) + adj, how: 'watch' };
    }
    return { v: snap.tdee, how: 'tdee' };
  }

  /* ---- Ενεργειακή πυκνότητα μεταβολής βάρους (Forbes / Hall 2008) ----
     Αναλογία άλιπης μάζας στη μεταβολή: p = 10,4 / (10,4 + FM). Λίπος 9.440 kcal/kg, άλιπη 1.816 kcal/kg. */
  function energyDensity(fmKg) {
    if (!(fmKg > 0)) return { v: 7700, how: 'σταθερά 7.700 kcal/kg' };
    const p = 10.4 / (10.4 + fmKg);
    return { v: p * 1816 + (1 - p) * 9440, how: `${Math.round((1 - p) * 100)}% λίπος / ${Math.round(p * 100)}% άλιπη μάζα (Forbes/Hall)` };
  }

  function linreg(xs, ys) {
    const n = xs.length; if (n < 2) return null;
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    let sxx = 0, sxy = 0; for (let i = 0; i < n; i++) { sxx += (xs[i] - mx) ** 2; sxy += (xs[i] - mx) * (ys[i] - my); }
    if (sxx === 0) return null;
    const b = sxy / sxx, a = my - b * mx;
    let sse = 0; for (let i = 0; i < n; i++) sse += (ys[i] - a - b * xs[i]) ** 2;
    const se = n > 2 ? Math.sqrt(sse / (n - 2) / sxx) : Infinity;
    return { a, b, se, n };
  }

  /* ---- Προσαρμοστικό TDEE ----
     Κατανάλωση = μέση πρόσληψη − (κλίση τάσης βάρους × ενεργειακή πυκνότητα).

/* ===== ΑΠΟΘΗΚΕΥΣΗ: IndexedDB με εφεδρεία localStorage ===== */
const Store = (() => {

  const cache = new Map(), timers = new Map();
  const LS = 'isozygio:';
  function openDB() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const r = indexedDB.open('isozygio', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    });
  }
  async function init() {
    try {
      db = await openDB();

        const rq = db.transaction('kv').objectStore('kv').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { cache.set(c.key, c.value); c.continue(); } else res(); };
        rq.onerror = () => rej(rq.error);
      });
    } catch (e) {
      mode = 'ls'; db = null;
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(LS)) try { cache.set(k.slice(LS.length), JSON.parse(localStorage.getItem(k))); } catch {} }
    }
    try { if (navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); } catch {}
  }
  function fail(e) { lastError = e; toast('Σφάλμα αποθήκευσης. Κάνε export των δεδομένων σου από το Προφίλ.', 5000); console.error(e); }
  function write(k) {
    const v = cache.get(k);
    if (mode === 'idb') return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
      v === undefined ? st.delete(k) : st.put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);

    return Promise.resolve();
  }
  function set(k, v) { ver++; cache.set(k, v); clearTimeout(timers.get(k)); timers.set(k, setTimeout(() => { timers.delete(k); write(k); }, 250)); }
  function del(k) { ver++; cache.delete(k); clearTimeout(timers.get(k)); timers.delete(k); return write(k); }
  function flush() { const ps = []; for (const [k, t] of timers) { clearTimeout(t); ps.push(write(k)); } timers.clear(); return Promise.all(ps); }
  const get = (k, d) => cache.has(k) ? cache.get(k) : d;
  const keys = p => [...cache.keys()].filter(k => k.startsWith(p)).sort();
  const dump = () => { const o = {}; for (const [k, v] of cache) o[k] = v; return o; };
  async function replaceAll(obj) {
    await flush(); ver++;
    for (const k of [...cache.keys()]) { cache.delete(k); await write(k); }
    for (const [k, v] of Object.entries(obj)) { cache.set(k, v); await write(k); }
  }
  return { init, get, set, del, keys, dump, flush, replaceAll, info: () => ({ mode, persisted, lastError }), ver: () => ver };
})();

    for (const k of Store.keys('day:')) { const d = Store.get(k); if (d.date < from || d.date >= Dates.today()) continue; const es = d.meals.filter(e => e.meal === mealId); if (es.length) vals.push(es.reduce((a, e) => a + (+e.kcal || 0), 0)); }

}

  return bank;
}
function sweetSuggestions(d, snap, tot) {

    const typ = typicalMealKcal(m.id) ?? snap.kcal * m.share;
    reserveParts.push({ label: m.label.toLowerCase(), kcal: typ });
  }
  const reserve = reserveParts.reduce((a, r) => a + r.kcal, 0);
  const bank = Math.max(0, weekBank(d.date)), bankUse = Math.min(bank, 300);
  const room = snap.kcal - tot.kcal - reserve + bankUse;
  const minRoom = { cut: 150, recomp: 150, maintain: 120, bulk: 100 }[goal] || 150;
  if (room < minRoom) return null;
  // Αγαπημένα: γλυκά που έχεις καταγράψει τις τελευταίες 60 ημέρες

}

function qtyWidgetHTML(f, qty, unit, prefix = 'q') {
  const units = Parser.unitsFor(f).map(u => u === 'g' && f.liquid ? 'ml' : u);
  if (!units.includes(unit)) unit = f.piece ? 'piece' : 'portion';
  return `<div class="qtyw"><input type="text" inputmode="decimal" data-qw="qty" value="${qty}" aria-label="Ποσότητα">

function qtyRead(box, f) {
  const qty = numIn($('[data-qw=qty]', box).value) || 0, unit = $('[data-qw=unit]', box).value;
  const g = unit === 'g' || unit === 'ml' ? qty : qty * Parser.unitGrams(f, unit).g;

function recentFoods() {
  const seen = new Map(), ks = Store.keys('day:').reverse().slice(0, 21);
  for (const k of ks) for (const e of (Store.get(k).meals || []).slice().reverse()) if (e.foodId && !seen.has(e.foodId)) { const f = foods().byId.get(e.foodId); if (f) seen.set(e.foodId, { f, qty: e.qty, unit: e.unit, g: e.g }); }
  return [...seen.values()].slice(0, 8);
}

    <label class="f"><span>Υδατ.</span><input type="text" inputmode="decimal" id="fc" value="${f.c}"></label><label class="f"><span>Λίπος</span><input type="text" inputmode="decimal" id="ff" value="${f.f}"></label></div>
    <div class="grid2"><label class="f"><span>Τυπική μερίδα (g)</span><input type="text" inputmode="decimal" id="fpo" value="${f.portion ?? ''}"></label><label class="f"><span>Βάρος τεμαχίου (g, προαιρ.)</span><input type="text" inputmode="decimal" id="fpi" value="${f.piece ?? ''}"></label></div>

    const chk = () => { const k = numIn($('#fk', body).value), a = (numIn($('#fp', body).value) || 0) * 4 + (numIn($('#fc', body).value) || 0) * 4 + (numIn($('#ff', body).value) || 0) * 9; $('#fwarn', body).textContent = k !== null && Math.abs(a - k) > Math.max(25, k * 0.2) ? `Προσοχή: τα μακροθρεπτικά αντιστοιχούν σε περίπου ${fmt(a)} kcal. Διαφορά δικαιολογείται μόνο με φυτικές ίνες ή αλκοόλ.` : 'Οι τιμές ισχύουν για νέες καταχωρήσεις. Όσα έχεις ήδη καταγράψει δεν αλλάζουν.'; };

      const nf = { id: f.id, name, aliases: $('#fa', body).value.split(',').map(s => s.trim()).filter(Boolean), kcal: vals[0], p: vals[1], c: vals[2], f: vals[3], portion: numIn($('#fpo', body).value) || 100, cat: $('#fcat', body).value, sweet: $('#fsw', body).checked };
      const pc = numIn($('#fpi', body).value); if (pc) nf.piece = pc;
      ['tbsp', 'tsp', 'liquid', 'est', 'pri'].forEach(k => { if (f[k] !== undefined && f[k] !== '') nf[k] = f[k]; });

    });
    const rs = $('#frestore', body); if (rs) rs.addEventListener('click', () => { removeCustomFood(id); toast('Επαναφέρθηκαν οι αρχικές τιμές.'); openFoodManage(); });
    const dl = $('#fdel', body); if (dl) dl.addEventListener('click', () => { if (confirm('Διαγραφή τροφίμου; Οι καταγραφές που το χρησιμοποιούν μένουν ως έχουν.')) { removeCustomFood(id); openFoodManage(); } });
  });
}

/* ----- Backup ----- */
async function doExport() {
  await Store.flush();
  const s = settings(); s.lastBackup = Date.now(); Store.set('settings', s); await Store.flush();
  const withPh = $('#exPhotos') && $('#exPhotos').checked, data = Store.dump();
  if (!withPh) for (const k of Object.keys(data)) if (k.startsWith('photo:')) delete data[k];
  const payload = { app: 'isozygio', version: 3, exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }), name = `weightmeup-backup-${Dates.today()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); toast('Το αντίγραφο δημιουργήθηκε.'); render(); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Το αντίγραφο κατέβηκε.'); render();
}
async function doImport(file) {
  let obj; try { obj = JSON.parse(await file.text()); } catch { toast('Το αρχείο δεν είναι έγκυρο JSON.', 4000); return; }
  if (!obj || obj.app !== 'isozygio' || typeof obj.data !== 'object') { toast('Το αρχείο δεν είναι αντίγραφο αυτής της εφαρμογής.', 4000); return; }
  const n = Object.keys(obj.data).filter(k => k.startsWith('day:')).length;
  if (!confirm(`Import αντιγράφου από ${new Date(obj.exportedAt).toLocaleString('el-GR')} με ${n} ημέρες. Όλα τα τρέχοντα δεδομένα θα αντικατασταθούν. Συνέχεια;`)) return;
  const keepPh = !Object.keys(obj.data).some(k => k.startsWith('photo:')) ? Object.fromEntries(photoKeys().map(k => [k, Store.get(k)])) : {};
  await Store.replaceAll(Object.assign({}, obj.data, keepPh)); foodCache = null; applyTheme(); toast('Τα δεδομένα επανήλθαν.'); render();
}
function applyTheme() { const t = settings().theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ===== ΑΝΑΛΥΣΗ ΠΡΟΠΟΝΗΣΗΣ ===== */
function trainingAnalysis(days) {
  return cached('ta' + days + Dates.today(), () => {
    const end = Dates.today(), start = Dates.add(end, -(days - 1));
    const sess = allSessions().filter(s => s.date >= start && s.date <= end).map(s => ({ date: s.date, ex: s.ex, def: exById(s.ex.exId) }));
    const vol = Calc.muscleVolume(sess, days / 7);
    const workoutDays = new Set(sess.filter(s => Calc.sessionStats(s.ex)).map(s => s.date)).size;
    // Τάσεις ασκήσεων (τελευταίες 8 εβδομάδες)
    const from8 = Dates.add(end, -55), byEx = new Map();
    for (const s of allSessions()) { if (s.date < from8 || s.ex.type === 'c') continue; const st = Calc.sessionStats(s.ex); if (!st) continue; if (!byEx.has(s.ex.exId)) byEx.set(s.ex.exId, []); byEx.get(s.ex.exId).push({ date: s.date, dayIdx: Dates.idx(s.date), stats: st }); }
    const trends = [...byEx.entries()].map(([id, h]) => { h.sort((a, b) => a.date < b.date ? -1 : 1); const def = exById(id); return { id, name: def ? def.name : id, type: def ? def.type : 'w', n: h.length, tr: Calc.trend(h, def ? def.type : 'w'), last: h[h.length - 1] }; })
      .filter(x => x.n >= 2).sort((a, b) => b.n - a.n);
    return { vol, workoutDays, trends, days, sessions: sess.length };
  });
}
function suggestExercisesFor(m, n = 2) {
  const used = new Set(allSessions().map(s => s.ex.exId));
  return exercises().filter(e => (e.prim || []).includes(m)).sort((a, b) => (used.has(b.id) ? 1 : 0) - (used.has(a.id) ? 1 : 0)).slice(0, n).map(e => e.name);
}

/* ===== ΜΗΧΑΝΗ ΠΡΟΤΑΣΕΩΝ =====
   Διαφανείς κανόνες βασισμένοι στα δεδομένα σου. lvl: 'act' (πρόταση αλλαγής), 'watch' (προσοχή), 'good' (πάει καλά), 'info' */
function buildRecs() {
  return cached('recs' + Dates.today(), () => {
    const recs = [], today = Dates.today(), p = profile(), s = settings(), goal = p.goal, G = Calc.GOALS[goal] || Calc.GOALS.maintain;
    const t = baseTargets(today); if (!t) return { recs, learning: null };
    const add = (lvl, area, title, text, src) => recs.push({ lvl, area, title, text, src });
    // Δεδομένα 14/28 ημερών
    const last = n => { const out = []; for (let i = 1; i <= n; i++) { const dd = Dates.add(today, -i), d = Store.get('day:' + dd); if (d) out.push(d); } return out; };
    const d14 = last(14).filter(d => d.meals.length), d28 = last(28).filter(d => d.meals.length);
    const learning = { logged14: d14.length, weigh14: weights().filter(w => w.d >= Dates.add(today, -14)).length };
    const ad = adaptiveOn(today), kg = t.weight;

    /* 1. Ρυθμός μεταβολής βάρους */
    if (ad.ready && ad.span >= 13) {
      const rate = ad.ratePctWk, [lo, hi] = G.rate, mid = (lo + hi) / 2;
      const kcalRaw = (mid - rate) / 100 * kg * ad.density.v / 7, kcalFix = Math.sign(kcalRaw) * Math.min(300, Math.round(Math.abs(kcalRaw) / 50) * 50), capped = Math.abs(kcalRaw) > 325;
      const avgTarget = d28.length ? d28.reduce((a, d) => a + (d.snap ? d.snap.kcal : t.kcal), 0) / d28.length : t.kcal;
      const adherence = ad.avgIntake - avgTarget;
      const firstLog = Store.keys('day:')[0], young = firstLog && Dates.idx(today) - Dates.idx(firstLog.slice(4)) < 21;
      const rTxt = `${sfmt(rate, 2)}% του βάρους την εβδομάδα (${sfmt(ad.slopeKgWk, 2)} kg)`;
      if (rate < lo) {
        if (goal === 'cut' && young) add('watch', 'Διατροφή', 'Γρήγορη αρχική απώλεια', `Χάνεις ${rTxt}. Τις πρώτες 2–3 εβδομάδες ελλείμματος χάνεται και νερό μαζί με γλυκογόνο, οπότε η πτώση φαίνεται μεγαλύτερη. Περίμενε μία ακόμα εβδομάδα πριν αλλάξεις κάτι.`, 'Φυσιολογία γλυκογόνου· Hall 2008');
        else if (adherence < -150 && s.useAdaptive) add('act', 'Διατροφή', 'Τρως λιγότερο από τον στόχο', `Χάνεις ${rTxt}, πιο γρήγορα από το εύρος ${sfmt(lo, 2)} έως ${sfmt(hi, 2)}% που ταιριάζει στον στόχο σου. Κατά μέσο όρο τρως ${fmt(-adherence)} kcal λιγότερο από τον στόχο. Φάε κοντά στον στόχο, για να κρατήσεις μυϊκή μάζα και απόδοση.`, 'Helms 2014, Garthe 2011: 0,5–1%/εβδ. σε έλλειμμα');
        else add('act', 'Διατροφή', goal === 'bulk' ? 'Δεν παίρνεις βάρος' : 'Πολύ γρήγορη απώλεια', `Ρυθμός ${rTxt}. Πρόσθεσε περίπου ${fmt(Math.abs(kcalFix))} kcal την ημέρα, κυρίως από υδατάνθρακες γύρω από την προπόνηση${capped ? ', και ξαναδές σε 2 εβδομάδες. Οι μικρές, σταδιακές αλλαγές είναι πιο εύκολο να τηρηθούν' : ''}.`, goal === 'bulk' ? 'Iraki 2019: ~0,25–0,5%/εβδ. σε πλεόνασμα' : 'Helms 2014: >1%/εβδ. αυξάνει την απώλεια άλιπης μάζας');
      } else if (rate > hi) {
        if (adherence > 150 && s.useAdaptive) add('act', 'Διατροφή', 'Τρως περισσότερο από τον στόχο', `Ρυθμός ${rTxt}, πάνω από το εύρος του στόχου σου. Κατά μέσο όρο τρως ${fmt(adherence)} kcal πάνω από τον στόχο. Δες στην Εβδομάδα ποιες μέρες ξεφεύγουν.`, 'Ενεργειακό ισοζύγιο');
        else add('act', 'Διατροφή', goal === 'bulk' ? 'Πολύ γρήγορη αύξηση' : goal === 'cut' ? 'Η απώλεια είναι αργή' : 'Το βάρος ανεβαίνει', `Ρυθμός ${rTxt}. Αφαίρεσε περίπου ${fmt(Math.abs(kcalFix))} kcal την ημέρα${goal === 'cut' ? ', ή πρόσθεσε 2.000–3.000 βήματα' : ''}${capped ? '. Ξαναδές σε 2 εβδομάδες. Οι μικρές, σταδιακές αλλαγές είναι πιο εύκολο να τηρηθούν' : ''}.`, goal === 'bulk' ? 'Iraki 2019: ταχύτερη αύξηση σημαίνει κυρίως περισσότερο λίπος' : 'Ενεργειακό ισοζύγιο');
      } else add('good', 'Διατροφή', 'Ρυθμός εντός στόχου', `Ρυθμός ${rTxt}, μέσα στο εύρος για ${G.label.toLowerCase()} (${sfmt(lo, 2)} έως ${sfmt(hi, 2)}%).`, 'Helms 2014· Iraki 2019');
    }
    /* 2. Προσαρμοστικό TDEE απενεργοποιημένο αλλά διαφέρει */
    if (ad.ready && ad.confidence >= 0.6 && !s.useAdaptive && Math.abs(ad.tdee - t.formulaTdee) / t.formulaTdee > 0.08)
      add('act', 'Διατροφή', 'Η πραγματική σου κατανάλωση διαφέρει', `Από τα δεδομένα σου, η κατανάλωση είναι ≈${fmt(ad.tdee)} kcal, ενώ ο τύπος δίνει ${fmt(t.formulaTdee)}. Ενεργοποίησε το προσαρμοστικό TDEE στο Προφίλ.`, 'Οι τύποι BMR έχουν ±10% ατομική απόκλιση');
    /* 3. Πρωτεΐνη */
    if (d14.length >= 5) {
      const hit = d14.filter(d => dayTotals(d).p >= 0.9 * (d.snap ? d.snap.p : t.p)).length, share = hit / d14.length;
      if (share < 0.6) {
        const per = MEALS.slice(0, 3).map(m => { const v = d14.map(d => d.meals.filter(e => e.meal === m.id)).filter(a => a.length).map(a => a.reduce((x, e) => x + e.p, 0)); return { m, avg: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null }; }).filter(x => x.avg !== null).sort((a, b) => a.avg - b.avg);
        const weak = per[0];
        add('act', 'Διατροφή', 'Λίγη πρωτεΐνη', `Έπιασες τον στόχο πρωτεΐνης ${hit} στις ${d14.length} μέρες.${weak ? ` Το ${weak.m.label.toLowerCase()} έχει κατά μέσο όρο ${fmt(weak.avg)} g. Ανέβασέ το κοντά στα ${fmt(0.4 * kg)} g, π.χ. με γιαούρτι στραγγιστό (200 g ≈ 20 g), αυγά, τόνο ή κοτόπουλο.` : ''}`, 'Morton 2018· Schoenfeld & Aragon 2018: ~0,4 g/kg ανά γεύμα');
      } else if (share >= 0.8) add('good', 'Διατροφή', 'Σταθερή πρωτεΐνη', `Έπιασες τον στόχο πρωτεΐνης ${hit} στις ${d14.length} μέρες.`, 'Morton 2018');
    }
    /* 4. Μοτίβο Σαββατοκύριακου */
    if (d28.length >= 10) {
      const hiDays = s.highMode === 'long' ? [5, 6, 0] : [6, 0], wk = d28.filter(d => hiDays.includes(Dates.dowNum(d.date))), wd = d28.filter(d => !hiDays.includes(Dates.dowNum(d.date)));
      if (wk.length >= 2 && wd.length >= 4) {
        const avg = a => a.reduce((x, d) => x + dayTotals(d).kcal, 0) / a.length, diff = avg(wk) - avg(wd);
        if (s.highMode === 'none' && diff > 350) add('act', 'Διατροφή', 'Τρως περισσότερο το ΣΚ', `Τα Σαββατοκύριακα τρως κατά μέσο όρο ${fmt(diff)} kcal περισσότερο από τις καθημερινές. Ενεργοποίησε την κατανομή ΣΚ στο Προφίλ, ώστε να το σχεδιάζεις αντί να «χαλάει» την εβδομάδα.`, 'Ευελιξία στη δίαιτα και μακροχρόνια τήρηση (Westenhoefer 1999· Byrne 2018)');
        if (s.highMode !== 'none') { const over = wk.map(d => dayTotals(d).kcal - (d.snap ? d.snap.kcal : t.kcal)); const avgOver = over.reduce((a, b) => a + b, 0) / over.length; if (avgOver > 300) add('watch', 'Διατροφή', 'Οι μέρες ΣΚ ξεπερνούν τον στόχο τους', `Ακόμα και με την επιπλέον ποσότητα, οι μέρες ΣΚ είναι κατά μέσο όρο ${fmt(avgOver)} kcal πάνω από τον στόχο. Σκέψου μεγαλύτερη αύξηση για το ΣΚ, με ανάλογη μείωση τις καθημερινές.`, 'Ενεργειακό ισοζύγιο εβδομάδας'); }
      }
    }
    /* 5. Συνέπεια καταγραφής */
    if (d14.length < 10 && d14.length >= 3) add('info', 'Διατροφή', 'Καταγραφή', `Κατέγραψες ${d14.length} από τις 14 τελευταίες μέρες. Χρειάζονται τουλάχιστον 10 για αξιόπιστο προσαρμοστικό TDEE. Καλύτερα πρόχειρη καταγραφή παρά καμία.`, 'Ακρίβεια υπολογισμού');
    if (ad.excluded && ad.excluded.length >= 3) add('info', 'Διατροφή', 'Μέρες με λίγη καταγραφή', `${ad.excluded.length} μέρες είχαν κάτω από το 50% του στόχου και εξαιρέθηκαν από τον υπολογισμό κατανάλωσης, γιατί μάλλον δεν καταγράφηκαν όλα.`, 'Ποιότητα δεδομένων');
    /* 6. Στόχος κάτω από το ελάχιστο */
    if (t.kcal < (numIn(s.minKcal) || 0)) add('act', 'Διατροφή', 'Στόχος κάτω από το άνετο όριο', `Ο στόχος (${fmt(t.kcal)} kcal) είναι κάτω από τις ${fmt(s.minKcal)} που όρισες. Αντί για αυστηρότερη δίαιτα, αύξησε τα βήματα: περίπου 3.000 βήματα καίνε 100–150 kcal.`, 'Τήρηση δίαιτας· δαπάνη βάδισης');
    /* 7. Βήματα */
    const st14 = last(14).map(d => numIn((d.watch || {}).steps)).filter(v => v !== null);
    if (st14.length >= 7) { const avg = st14.reduce((a, b) => a + b, 0) / st14.length; if (avg < 7000 && (goal === 'cut' || goal === 'recomp')) add('act', 'Δραστηριότητα', 'Λίγα βήματα', `Μέσος όρος ${fmt(avg)} βήματα. Στόχευσε στα 8.000–10.000. Βοηθά στο έλλειμμα χωρίς να κόψεις φαγητό και έχει όφελος για την υγεία.`, 'Paluch 2022 (Lancet Public Health)'); else if (avg >= 8000) add('good', 'Δραστηριότητα', 'Καλή καθημερινή κίνηση', `Μέσος όρος ${fmt(avg)} βήματα.`, 'Paluch 2022'); }
    /* 8. Γλυκά */
    if (d14.length >= 7) {
      const tot = d14.reduce((a, d) => a + dayTotals(d).kcal, 0), sw = d14.reduce((a, d) => a + dayTotals(d).sweet, 0), share = tot ? sw / tot : 0;
      if (share > 0.2 && goal === 'cut') add('watch', 'Διατροφή', 'Πολλές θερμίδες από γλυκά', `Το ${fmt(share * 100)}% των θερμίδων σου είναι από γλυκά. Δεν χρειάζεται να τα κόψεις. Προτίμησε μικρότερες μερίδες, ή γλυκά με πρωτεΐνη (πουτίγκα πρωτεΐνης, γιαούρτι με μέλι), για να μένει χώρος για την πρωτεΐνη.`, 'WHO 2015: ελεύθερα σάκχαρα <10% ενέργειας');
      else if (sw > 0 && share <= 0.15) add('good', 'Διατροφή', 'Γλυκά σε ισορροπία', `Τα γλυκά είναι το ${fmt(share * 100)}% των θερμίδων σου και χωράνε στον στόχο σου.`, 'Ευέλικτη δίαιτα');
    }
    /* Προπόνηση (28 ημέρες) */
    const ta = trainingAnalysis(28);
    if (ta.workoutDays >= 4) {
      const vol = ta.vol.muscles, majors = Object.keys(MUSCLES).filter(m => MUSCLES[m].major);
      const low = majors.filter(m => (vol[m] ? vol[m].perWeek : 0) < G.minSets).sort((a, b) => (vol[a] ? vol[a].perWeek : 0) - (vol[b] ? vol[b].perWeek : 0));
      if (low.length) add('act', 'Προπόνηση', 'Λίγος όγκος σε μύες', low.slice(0, 4).map(m => `${MUSCLES[m].n}: ${fmt(vol[m] ? vol[m].perWeek : 0, 1)} σκληρά σετ/εβδ.${vol[m] && vol[m].soft ? ` (και ${fmt(vol[m].soft / 4, 1)} σετ με RIR 5+, που δεν μετρούν)` : ''}, π.χ. ${suggestExercisesFor(m).join(' ή ')}`).join('. ') + (low.length > 4 ? `. Επίσης: ${low.slice(4).map(m => MUSCLES[m].n).join(', ')}` : '') + `. Για ${G.label.toLowerCase()} στόχευσε σε τουλάχιστον ${G.minSets} σκληρά σετ την εβδομάδα ανά μυ.`, 'Schoenfeld 2017· Pelland 2024 (δόση-απόκριση)');
      const high = majors.filter(m => vol[m] && vol[m].perWeek > 22);
      if (high.length) add('watch', 'Προπόνηση', 'Πολύ υψηλός όγκος', `${high.map(m => `${MUSCLES[m].n} (${fmt(vol[m].perWeek, 1)})`).join(', ')} σετ/εβδ. Πάνω από περίπου 20 σετ το όφελος μειώνεται και η κόπωση αυξάνεται. Αν δεν βελτιώνεσαι, μετέφερε σετ σε μύες με λιγότερο όγκο.`, 'Pelland 2024: φθίνουσα απόδοση');
      const lowFreq = majors.filter(m => vol[m] && vol[m].perWeek >= 8 && vol[m].freq < 1.4);
      if (lowFreq.length) add('info', 'Προπόνηση', 'Όλος ο όγκος σε μία μέρα', `${lowFreq.map(m => MUSCLES[m].n).join(', ')}: γυμνάζονται περίπου 1 φορά την εβδομάδα με πολλά σετ. Αν τα μοιράσεις σε 2 μέρες, τα σετ της ίδιας συνεδρίας θα γίνονται με λιγότερη κόπωση.`, 'Schoenfeld 2016· Pelland 2024 (μικρό όφελος συχνότητας)');
      const V = m => vol[m] ? vol[m].perWeek : 0;
      const push = V('chest') + V('fdelt') + V('triceps'), pull = V('lats') + V('upperback') + V('rdelt') + V('biceps');
      if (pull > 0 && push / pull > 1.5) add('watch', 'Προπόνηση', 'Πιο πολλή ώθηση από έλξη', `Ώθηση ${fmt(push, 1)} σετ, έλξη ${fmt(pull, 1)} σετ την εβδομάδα. Πρόσθεσε κωπηλατικές ή face pulls για ισορροπία στους ώμους.`, 'Πρακτική σύσταση (περιορισμένα στοιχεία)');
      if (V('hams') > 0 && V('quads') / V('hams') > 2) add('watch', 'Προπόνηση', 'Λίγοι οπίσθιοι μηριαίοι', `Τετρακέφαλοι ${fmt(V('quads'), 1)}, οπίσθιοι ${fmt(V('hams'), 1)} σετ/εβδ. Πρόσθεσε leg curl ή RDL.`, 'Πρακτική σύσταση (περιορισμένα στοιχεία)');
      const v = ta.vol;
      if (v.rirN >= 15) {
        const all = allSessions().filter(s => s.date >= Dates.add(today, -27)).flatMap(s => (s.ex.sets || []).filter(x => x.rir !== '' && x.rir !== undefined && x.rir !== null && +x.r > 0).map(x => +x.rir));
        const far = all.filter(r => r >= 4).length / all.length, fail = all.filter(r => r === 0).length / all.length;
        if (far > 0.4) add('act', 'Προπόνηση', 'Σετ μακριά από την αποτυχία', `Το ${fmt(far * 100)}% των σετ σου έχει RIR 4 ή περισσότερο. Για υπερτροφία, τα περισσότερα σετ πρέπει να είναι στο 0–3 RIR. Ανέβασε βάρος ή επαναλήψεις.`, 'Refalo 2023· Robinson 2024');
        else if (fail > 0.5) add('watch', 'Προπόνηση', 'Πολλά σετ μέχρι αποτυχία', `Το ${fmt(fail * 100)}% των σετ φτάνει σε αποτυχία. Το επιπλέον όφελος είναι μικρό και η κόπωση μεγαλύτερη, ειδικά στις σύνθετες ασκήσεις. Κράτα 1–2 RIR στις βαριές ασκήσεις.`, 'Refalo 2023· Robinson 2024');
        else add('good', 'Προπόνηση', 'Καλή ένταση', `Μέσο RIR ${fmt(v.avgRir, 1)}. Τα σετ σου είναι κοντά στην αποτυχία χωρίς υπερβολές.`, 'Refalo 2023');
      } else if (v.unknown > 20) add('info', 'Προπόνηση', 'Πρόσθεσε RIR', 'Γράφε στα σετ πόσες επαναλήψεις σου έμεναν (RIR). Έτσι ο όγκος μετράει μόνο τα σετ που προκαλούν προσαρμογή, και μπορώ να σου πω αν πιέζεσαι αρκετά.', 'Refalo 2023');
      // Στασιμότητα / πτώση
      const plateau = ta.trends.filter(x => x.tr && x.tr.n >= 4 && x.tr.spanDays >= 21 && Math.abs(x.tr.pctWk) < 0.25);
      const drop = ta.trends.filter(x => x.tr && x.tr.n >= 3 && x.tr.pctWk < -1.5);
      if (plateau.length && goal !== 'cut') add('act', 'Προπόνηση', 'Στασιμότητα', `${plateau.slice(0, 3).map(x => x.name).join(', ')}: χωρίς πρόοδο για περίπου ${fmt(plateau[0].tr.spanDays / 7)} εβδομάδες. Δοκίμασε διαφορετικό εύρος επαναλήψεων (π.χ. 6–8 αντί για 10–12), +1 σετ, ή μια εβδομάδα με μειωμένο όγκο.`, 'Αρχή προοδευτικής υπερφόρτωσης');
      if (plateau.length && goal === 'cut') add('good', 'Προπόνηση', 'Διατηρείς τη δύναμη', `${plateau.slice(0, 3).map(x => x.name).join(', ')}: σταθερή δύναμη ενώ είσαι σε έλλειμμα. Είναι καλό σημάδι ότι κρατάς μυϊκή μάζα.`, 'Helms 2014');
      if (drop.length) add('watch', 'Προπόνηση', 'Πτώση δύναμης', `${drop.slice(0, 3).map(x => `${x.name} (${sfmt(x.tr.pctWk, 1)}%/εβδ.)`).join(', ')}. ${goal === 'cut' ? 'Μπορεί το έλλειμμα να είναι μεγάλο. Έλεγξε τον ρυθμό απώλειας και την πρωτεΐνη.' : 'Έλεγξε ύπνο, διατροφή και συνολικό όγκο.'}`, 'Helms 2014');
      const up = ta.trends.filter(x => x.tr && x.tr.n >= 3 && x.tr.pctWk >= 0.5);
      if (up.length) add('good', 'Προπόνηση', 'Πρόοδος', up.slice(0, 3).map(x => `${x.name} ${sfmt(x.tr.pctWk, 1)}% την εβδομάδα`).join(', ') + '.', 'Τάση e1RM');
    } else if (allSessions().length) {
      const lastW = allSessions().map(s => s.date).sort().pop();
      if (Dates.idx(today) - Dates.idx(lastW) > 10) add('info', 'Προπόνηση', 'Διάλειμμα από την προπόνηση', `Τελευταία καταγραφή στις ${Dates.short(lastW)}.`, '');
    }
    /* Ύπνος */
    const sl7 = sleepStats(Dates.add(today, -1), 7);
    if (sl7 && sl7.n >= 4) {
      if (sl7.avg < (goal === 'cut' ? 6.5 : 6)) add('act', 'Ανάκαμψη', 'Λίγος ύπνος', `Μέσος όρος ${fmtSleep(sl7.avg)} την τελευταία εβδομάδα. Με λιγότερο από 7 ώρες ${goal === 'cut' ? 'σε έλλειμμα, χάνεται περισσότερη άλιπη μάζα, αυξάνεται η πείνα και πέφτει η απόδοση' : 'επιβαρύνεται η ανάκαμψη και η απόδοση'}. Στόχευσε σε 7–9 ώρες, με σταθερή ώρα ύπνου.`, 'Nedeltcheva 2010· Watson 2015 (AASM/SRS)');
      else if (sl7.avg < 7) add('watch', 'Ανάκαμψη', 'Ύπνος λίγο κάτω από 7 ώρες', `Μέσος όρος ${fmtSleep(sl7.avg)} (${sl7.short} από ${sl7.n} νύχτες κάτω από 7 ώρες). Ακόμα και 30–60 λεπτά παραπάνω βοηθούν την ανάκαμψη και τον έλεγχο της πείνας.`, 'Watson 2015 (AASM/SRS)');
      else add('good', 'Ανάκαμψη', 'Επαρκής ύπνος', `Μέσος όρος ${fmtSleep(sl7.avg)} την τελευταία εβδομάδα.`, 'Watson 2015');
    }
    /* Check-in */
    const ciAll = checkins(), ciK = Object.keys(ciAll).sort().filter(k => k >= Dates.add(Dates.weekStart(today), -14)), ci = ciK.map(k => ciAll[k]), lastCi = ci[ci.length - 1];
    if (lastCi) {
      const hungry = c => c.hunger >= 4 && c.energy <= 2;
      if (goal === 'cut' && ci.length >= 2 && hungry(ci[ci.length - 1]) && hungry(ci[ci.length - 2])) add('act', 'Διατροφή', 'Διάλειμμα από τη δίαιτα', 'Δύο εβδομάδες με έντονη πείνα και χαμηλή ενέργεια. Σκέψου 1–2 εβδομάδες σε θερμίδες διατήρησης (≈TDEE) και μετά συνέχεια. Τα διαλείμματα βοηθούν στην τήρηση και ίσως στη διατήρηση μυϊκής μάζας.', 'Byrne 2018 (MATADOR)· Peos 2021');
      else if (goal === 'cut' && hungry(lastCi)) add('watch', 'Διατροφή', 'Πείνα και κούραση', 'Αυτή την εβδομάδα είχες πολλή πείνα και λίγη ενέργεια. Βάλε περισσότερο όγκο φαγητού με λίγες θερμίδες (λαχανικά, σούπες, φρούτα) και πρωτεΐνη σε κάθε γεύμα. Αν συνεχιστεί, σκέψου διάλειμμα από τη δίαιτα.', 'Rolls 2009 (ενεργειακή πυκνότητα)· Byrne 2018');
      if (lastCi.sleep && lastCi.sleep <= 2) add('watch', 'Ανάκαμψη', 'Λίγος ύπνος', `Ο ύπνος ήταν ${lastCi.sleep}/5. Σε έλλειμμα, ο λίγος ύπνος αυξάνει την απώλεια άλιπης μάζας και την πείνα. Στόχος 7–9 ώρες, με σταθερή ώρα.`, 'Nedeltcheva 2010· Watson 2015');
      if (lastCi.perf && lastCi.perf <= 2 && goal === 'cut') add('watch', 'Προπόνηση', 'Πτώση απόδοσης', 'Χαμηλή απόδοση στην προπόνηση ενώ είσαι σε έλλειμμα. Έλεγξε αν ο ρυθμός απώλειας είναι πάνω από 1%/εβδ. και αν πιάνεις την πρωτεΐνη. Βάλε υδατάνθρακες πριν την προπόνηση.', 'Helms 2014');
      if (lastCi.stress && lastCi.stress >= 4) add('info', 'Ανάκαμψη', 'Υψηλό στρες', 'Με πολύ στρες, κράτα τον όγκο της προπόνησης σταθερό ή λίγο χαμηλότερο και μην αυξάνεις το έλλειμμα αυτή την εβδομάδα.', 'Stults-Kolehmainen 2014');
      if (lastCi.sleep >= 3 && lastCi.energy >= 3 && (lastCi.hunger || 3) <= 3 && (lastCi.perf || 3) >= 3) add('good', 'Ανάκαμψη', 'Καλή εβδομάδα', 'Ύπνος, ενέργεια, πείνα και απόδοση είναι σε καλά επίπεδα.', 'Check-in');
    }
    /* Σώμα */
    const ms = measures(), mLast = ms[ms.length - 1];
    if (mLast && numIn(mLast.waist) && numIn(p.height)) {
      const whtr = mLast.waist / p.height;
      if (whtr >= 0.5) add('info', 'Σώμα', 'Λόγος μέσης/ύψους', `${fmt(whtr, 2)}. Το όριο για χαμηλό καρδιομεταβολικό κίνδυνο είναι κάτω από 0,5. Η μείωση της μέσης είναι καλύτερος δείκτης υγείας από το βάρος.`, 'NICE 2022');
      const m4 = ms.filter(m => m.d <= Dates.add(mLast.d, -21) && numIn(m.waist)).pop();
      if (m4) {
        const dW = mLast.waist - m4.waist, w1 = weightTrendOn(m4.d), w2 = weightTrendOn(mLast.d), dKg = w1 && w2 ? w2 - w1 : null;
        if (dKg !== null && Math.abs(dKg) < 0.7 && dW <= -1) add('good', 'Σώμα', 'Αναδόμηση σε εξέλιξη', `Η μέση μειώθηκε ${fmt(-dW, 1)} cm ενώ το βάρος έμεινε σταθερό (${sfmt(dKg, 1)} kg). Χάνεις λίπος και κρατάς ή χτίζεις μυ.`, 'Ερμηνεία μετρήσεων');
        if (goal === 'bulk' && dW > 2.5 && dKg !== null && dKg < 2) add('watch', 'Σώμα', 'Η μέση αυξάνεται γρήγορα', `+${fmt(dW, 1)} cm μέση με ${sfmt(dKg, 1)} kg. Ίσως το πλεόνασμα είναι μεγάλο.`, 'Iraki 2019');
      }
    } else if (!ms.length) add('info', 'Σώμα', 'Πρόσθεσε μετρήσεις', 'Με μέση, λαιμό και γλουτούς υπολογίζεται το ποσοστό λίπους και η άλιπη μάζα. Έτσι η πρωτεΐνη και ο BMR γίνονται ακριβέστεροι, και φαίνεται η αναδόμηση ακόμα κι όταν το βάρος δεν αλλάζει.', 'Woolcott 2018 (RFM)· US Navy');
    const order = { act: 0, watch: 1, info: 2, good: 3 };
    recs.sort((a, b) => order[a.lvl] - order[b.lvl]);
    return { recs, learning };
  });
}

/* ===== ΠΡΟΒΟΛΗ ΠΡΟΟΔΟΥ ===== */
function viewProgress() {

      <div class="stat"><div class="k">Ενέργεια ανά kg</div><div class="v">${fmt(ad.density.v)} kcal</div></div></div>

      <table class="tbl"><thead><tr><th>Περιφέρεια</th><th>Τώρα</th><th>Μεταβολή</th></tr></thead><tbody>
      ${rowM('waist', 'Μέση')}${rowM('neck', 'Λαιμός')}${rowM('hip', 'Γλουτοί')}${rowM('chest', 'Στήθος')}${rowM('arm', 'Μπράτσο')}${rowM('thigh', 'Μηρός')}</tbody></table>
      ${bf && bf.src !== 'bmi' ? `<p class="small" style="margin-top:10px">Λίπος σώματος: <b class="est">${fmt(bf.bf, 1)}%</b> ${bf.parts.length ? `(${bf.parts.map(x => `${x.k} ${fmt(x.v, 1)}%`).join(', ')}${bf.scale ? `, ζυγαριά ${fmt(bf.scale, 1)}%` : ''})` : ''}. Άλιπη μάζα <b class="est">${fmt(t.weight * (1 - bf.bf / 100), 1)}</b> kg.</p>` : ''}
      ${numIn(profile().height) ? `<p class="small">Λόγος μέσης/ύψους: <b>${fmt(mL.waist / profile().height, 2)}</b> (υγιές όριο κάτω από 0,5).</p>` : ''}
      <canvas class="chart" id="chWaist" style="height:150px" role="img" aria-label="Περιφέρεια μέσης στον χρόνο"></canvas>
      <p class="note">Οι μέθοδοι με μεζούρα έχουν σφάλμα ±3–4% σε απόλυτη τιμή, αλλά είναι αξιόπιστες για την τάση. Κοίτα τη μεταβολή, όχι τον ακριβή αριθμό. <button class="linkish" data-act="measureList">Όλες οι μετρήσεις</button></p>`;
  } else h += `<p class="small">Καμία μέτρηση ακόμα. Με τη μέση μόνο υπολογίζεται το RFM. Με μέση, λαιμό${profile().sex === 'f' ? ' και γλουτούς' : ''} υπολογίζεται και η μέθοδος US Navy, και χρησιμοποιείται ο μέσος όρος των δύο.</p>`;
  h += `</section>`;
  // Προπόνηση

/* ----- «Τι να φάω για να κλείσω τη μέρα» ----- */
function closingSuggestions(d, snap, tot) {
  const kLeft = snap.kcal - tot.kcal, pLeft = snap.p - tot.p, s = settings();
  const freq = new Map(), from = Dates.add(d.date, -30);
  for (const k of Store.keys('day:')) { const x = Store.get(k); if (x.date < from) continue; for (const e of x.meals) if (e.foodId) freq.set(e.foodId, (freq.get(e.foodId) || 0) + 1); }
  const ok = f => f && !f.sweet && !(s.noSupplements && f.supp);
  const protIds = ['chk_breast_cooked', 'tuna_water', 'egg', 'cottage', 'yog_greek_2', 'salmon_cooked', 'turkey_deli', 'beef_patty', 'shrimp', 'yog_greek_0', 'egg_white', 'lentils'];
  const prot = [...new Set([...[...freq.keys()], ...protIds])].map(id => foods().byId.get(id)).filter(f => ok(f) && f.p * 4 / f.kcal >= 0.3)
    .sort((a, b) => (freq.get(b.id) || 0) - (freq.get(a.id) || 0) || b.p / b.kcal - a.p / a.kcal).slice(0, 6);
  const carbIds = ['rice_white_cooked', 'pasta_cooked', 'bread_whole', 'potato_boiled', 'banana', 'pita_arabic'];
  const carbs = [...new Set([...[...freq.keys()].filter(id => { const f = foods().byId.get(id); return f && ['grain_cooked', 'bread', 'fruit'].includes(f.cat); }), ...carbIds])].map(id => foods().byId.get(id)).filter(ok).slice(0, 4);
  const unitOf = f => f.piece && f.piece >= 30 && f.cat !== 'grain_cooked' ? 'piece' : 'portion';
  const out = [];
  prot.forEach((pf, i) => {
    const u = unitOf(pf), ug = Parser.unitGrams(pf, u).g, pu = ug * pf.p / 100, ku = ug * pf.kcal / 100, cap = u === 'piece' ? (pf.id === 'egg' ? 4 : 2) : 2;
    let n = pLeft > 10 ? Math.min(cap, Math.max(u === 'piece' ? 1 : 0.5, Math.ceil(pLeft * 0.85 / pu * 2) / 2)) : 0;
    if (u === 'piece') n = Math.ceil(n);
    while (n > 0 && n * ku > kLeft + 120) n -= u === 'piece' ? 1 : 0.5;
    if (n <= 0) return;
    const items = [{ f: pf, qty: n, unit: u, g: n * ug }];
    let R = kLeft - n * ku;
    const cf = carbs[i % Math.max(1, carbs.length)];
    if (cf && R >= 150) { const cu = unitOf(cf), cg = Parser.unitGrams(cf, cu).g, ck = cg * cf.kcal / 100; let q = Math.min(1.5, Math.floor(R / ck * 2) / 2); if (cu === 'piece') q = Math.floor(q); if (q > 0) { items.push({ f: cf, qty: q, unit: cu, g: q * cg }); R -= q * ck; } }
    const kc = items.reduce((a, x) => a + x.g * x.f.kcal / 100, 0), pc = items.reduce((a, x) => a + x.g * x.f.p / 100, 0);
    out.push({ items, kcal: kc, p: pc });
  });
  return { kLeft, pLeft, combos: out.sort((a, b) => Math.abs(pLeft - a.p) - Math.abs(pLeft - b.p)).slice(0, 4) };
}
function openCloseDay() {
  const d = getDay(UI.date), snap = daySnap(d), tot = dayTotals(d); if (!snap) return;
  const r = closingSuggestions(d, snap, tot);
  window._closeCombos = r.combos;
  const hour = new Date().getHours(), defMeal = hour < 11 ? 'b' : hour < 17 ? 'l' : 'd';

/* ===================== ΕΚΔΟΣΗ 4: ΠΡΟΪΟΝΤΑ ΣΟΥΠΕΡΜΑΡΚΕΤ ===================== */
/* Πηγή: Open Food Facts (ανοιχτή βάση, άδεια ODbL). Κάθε προϊόν που χρησιμοποιείς αποθηκεύεται
   τοπικά, ώστε να είναι διαθέσιμο offline και στην ανάλυση κειμένου. */
const OFF = (() => {
  const BASE = 'https://world.openfoodfacts.org';
  const FIELDS = 'code,product_name,product_name_el,product_name_en,generic_name,brands,quantity,serving_size,serving_quantity,product_quantity,product_quantity_unit,nutriments,categories_tags,image_front_small_url,nutriscore_grade,countries_tags';
  const stamps = [];
  function allowSearch() { const now = Date.now(); while (stamps.length && now - stamps[0] > 60000) stamps.shift(); if (stamps.length >= 8) return false; stamps.push(now); return true; }
  async function get(url, tries = 2) {
    let last;
    for (let i = 0; i < tries; i++) {
      try {
        const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 12000);
        const r = await fetch(url, { signal: ctrl.signal }); clearTimeout(to);
        if (r.status === 503 || r.status === 429) { last = new Error('busy'); await new Promise(res => setTimeout(res, 1500 * (i + 1))); continue; }
        if (!r.ok) throw new Error('http ' + r.status);
        return await r.json();
      } catch (e) { last = e; if (i < tries - 1) await new Promise(res => setTimeout(res, 1200)); }
    }
    throw last;
  }
  const n = v => { const x = parseFloat(v); return isFinite(x) ? x : null; };
  const has = (tags, arr) => (tags || []).some(t => arr.some(a => t === a || t.startsWith(a)));
  function catOf(tags) {
    if (has(tags, ['en:ice-creams', 'en:frozen-desserts'])) return 'icecream';
    if (has(tags, ['en:chocolates', 'en:biscuits', 'en:cakes', 'en:desserts', 'en:confectioneries', 'en:sweet-snacks', 'en:pastries', 'en:cookies', 'en:wafers'])) return 'sweet';
    if (has(tags, ['en:cheeses'])) return 'cheese';
    if (has(tags, ['en:yogurts', 'en:milks', 'en:dairies', 'en:fermented-milk-products'])) return 'dairy';
    if (has(tags, ['en:breads', 'en:rusks', 'en:crackers', 'en:rice-cakes'])) return 'bread';
    if (has(tags, ['en:breakfast-cereals', 'en:cereal-flakes', 'en:mueslis', 'en:oat-flakes', 'en:pastas', 'en:rices', 'en:cereal-bars'])) return 'grain_dry';
    if (has(tags, ['en:spreads', 'en:honeys', 'en:jams', 'en:nut-butters'])) return 'spread';
    if (has(tags, ['en:nuts', 'en:seeds'])) return 'nut';
    if (has(tags, ['en:beverages'])) return 'drink';
    if (has(tags, ['en:meats', 'en:hams', 'en:sausages', 'en:poultries'])) return 'meat';
    if (has(tags, ['en:fishes', 'en:seafood', 'en:canned-fishes'])) return 'fish';
    if (has(tags, ['en:fats', 'en:vegetable-oils', 'en:olive-oils'])) return 'fat';
    return 'other';
  }
  /* Μετατροπή προϊόντος OFF σε τρόφιμο της εφαρμογής. Επιστρέφει {food, issues} */
  function toFood(p) {
    const nu = p.nutriments || {};
    let kcal = n(nu['energy-kcal_100g']);
    if (kcal === null && n(nu['energy_100g']) !== null) kcal = n(nu['energy_100g']) / 4.184;
    const pr = n(nu.proteins_100g), c = n(nu.carbohydrates_100g), f = n(nu.fat_100g);
    const issues = [];
    if ([pr, c, f].some(v => v === null)) issues.push('Λείπουν μακροθρεπτικά. Συμπλήρωσέ τα από την ετικέτα.');
    if (kcal === null && pr !== null && c !== null && f !== null) { kcal = pr * 4 + c * 4 + f * 9; issues.push('Οι θερμίδες υπολογίστηκαν από τα μακροθρεπτικά.'); }
    if (kcal === null) issues.push('Λείπουν οι θερμίδες.');
    if (kcal !== null && pr !== null && c !== null && f !== null) {
      const at = pr * 4 + c * 4 + f * 9 + (n(nu.fiber_100g) || 0) * 2;
      if (Math.abs(at - kcal) > Math.max(30, kcal * 0.25)) issues.push(`Οι θερμίδες (${Math.round(kcal)}) δεν ταιριάζουν με τα μακροθρεπτικά (≈${Math.round(at)}). Έλεγξε την ετικέτα.`);
    }
    if (p.nutrition_data_per === 'serving') issues.push('Τα στοιχεία είναι ανά μερίδα. Έλεγξε ότι αντιστοιχούν σε 100 g.');
    const tags = p.categories_tags || [], cat = catOf(tags);
    const unitMl = /ml|cl|l\b/i.test(p.product_quantity_unit || p.quantity || '') || cat === 'drink';
    const pq = n(p.product_quantity), sq = n(p.serving_quantity);
    const single = pq && pq <= 250;
    const brand = (p.brands || '').split(',')[0].trim();
    const pname = (p.product_name_el || p.product_name || p.product_name_en || p.generic_name || '').trim();
    const name = [brand, pname && !pname.toLowerCase().startsWith(brand.toLowerCase()) ? pname : (pname || '')].filter(Boolean).join(' ').trim() || `Προϊόν ${p.code}`;
    const food = {
      id: 'off_' + p.code, barcode: p.code, name, brand, qtyLabel: p.quantity || '', src: 'off', offDate: Date.now(),
      aliases: [brand, pname, p.product_name_en, p.generic_name, p.product_name_el, brand && pname ? brand + ' ' + pname : null].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i),
      kcal: kcal !== null ? Math.round(kcal * 10) / 10 : null, p: pr, c, f,
      fiber: n(nu.fiber_100g), sugars: n(nu.sugars_100g), satfat: n(nu['saturated-fat_100g']), salt: n(nu.salt_100g),
      portion: sq && sq >= 5 && sq <= 1000 ? sq : single ? pq : 100, cat, liquid: unitMl,
      sweet: cat === 'sweet' || cat === 'icecream' || has(tags, ['en:sweet-snacks', 'en:chocolate']),
      supp: has(tags, ['en:protein-bars', 'en:protein-powders', 'en:dietary-supplements', 'en:bodybuilding-supplements']),
      nutriscore: p.nutriscore_grade && /^[a-e]$/.test(p.nutriscore_grade) ? p.nutriscore_grade.toUpperCase() : null,
      img: p.image_front_small_url || null,

    if (single) food.piece = pq; else if (sq && sq >= 5 && sq <= 300) food.piece = sq;
    return { food, issues, ok: food.kcal !== null && pr !== null && c !== null && f !== null };
  }
  async function byBarcode(code) {
    const j = await get(`${BASE}/api/v2/product/${encodeURIComponent(code)}.json?fields=${FIELDS}`);
    return j && j.status === 1 && j.product ? toFood(Object.assign({ code }, j.product)) : null;
  }
  async function search(q, greeceOnly) {
    if (!allowSearch()) { const e = new Error('rate'); e.rate = true; throw e; }
    const params = new URLSearchParams({ search_terms: q, search_simple: '1', action: 'process', json: '1', page_size: '24', fields: FIELDS });
    if (greeceOnly) { params.set('tagtype_0', 'countries'); params.set('tag_contains_0', 'contains'); params.set('tag_0', 'greece'); }
    const j = await get(`${BASE}/cgi/search.pl?${params}`, 2);

  }
  return { byBarcode, search, toFood };
})();

const Translit = (() => {
