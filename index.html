  const G2L = { 'α': 'a', 'β': 'v', 'γ': 'g', 'δ': 'd', 'ε': 'e', 'ζ': 'z', 'η': 'i', 'θ': 'th', 'ι': 'i', 'κ': 'k', 'λ': 'l', 'μ': 'm', 'ν': 'n', 'ξ': 'x', 'ο': 'o', 'π': 'p', 'ρ': 'r', 'σ': 's', 'τ': 't', 'υ': 'y', 'φ': 'f', 'χ': 'ch', 'ψ': 'ps', 'ω': 'o' };

/* ----- Σαρωτής barcode: BarcodeDetector (Android/Chrome) ή ZXing (iPhone κ.ά.) ----- */
const Scanner = (() => {
  let stream = null, raf = null, zx = null, active = false;
  function stop() { active = false; if (raf) cancelAnimationFrame(raf); raf = null; if (zx) { try { zx.reset(); } catch {} zx = null; } if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } const b = $('#scanBox'); if (b) b.remove(); }
  function loadZX() {
    if (window.ZXing) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = () => rej(new Error('zxing')); document.head.appendChild(s); });
  }
  async function open(anchor, onCode) {
    stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Η κάμερα δεν είναι διαθέσιμη. Χρειάζεται https. Γράψε το barcode με το χέρι.', 4000); return; }
    const box = document.createElement('div'); box.id = 'scanBox'; box.className = 'scanbox';
    box.innerHTML = `<video playsinline muted></video><div class="scanframe"></div><div class="row between" style="margin-top:6px"><span class="small muted" id="scanSt">Στρέψε την κάμερα στο barcode…</span><button class="btn sm" id="scanStop">Κλείσιμο</button></div>`;
    anchor.parentNode.insertBefore(box, anchor);
    const video = $('video', box); $('#scanStop', box).addEventListener('click', stop);
    const done = code => { if (!active) return; try { navigator.vibrate && navigator.vibrate(80); } catch {} stop(); onCode(code); };
    active = true;
    try {
      if ('BarcodeDetector' in window) {
        const fm = await BarcodeDetector.getSupportedFormats().catch(() => []);
        const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(x => !fm.length || fm.includes(x));
        if (want.length) {
          const det = new BarcodeDetector({ formats: want });
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
          video.srcObject = stream; await video.play();
          let last = 0;
          const loop = async t => { if (!active) return; if (t - last > 180 && video.readyState >= 2) { last = t; try { const r = await det.detect(video); if (r.length) return done(r[0].rawValue); } catch {} } raf = requestAnimationFrame(loop); };
          raf = requestAnimationFrame(loop); return;
        }
      }
      $('#scanSt').textContent = 'Φόρτωση σαρωτή…';
      await loadZX(); if (!active) return;
      zx = new ZXing.BrowserMultiFormatReader();
      $('#scanSt').textContent = 'Στρέψε την κάμερα στο barcode…';
      await zx.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, (result) => { if (result) done(result.getText()); });
    } catch (e) {
      stop(); toast(e && e.name === 'NotAllowedError' ? 'Δεν δόθηκε άδεια για την κάμερα.' : 'Δεν ήταν δυνατή η σάρωση. Γράψε το barcode με το χέρι.', 4000);
    }
  }
  return { open, stop };
})();

function lastMealSource(date, mealId) {

function routineItems(date) {
  const s = settings(), d = getDay(date), wd = +(s.weeklyDay ?? 0), dow = Dates.dowNum(date), items = [];
  const slots = new Set(d.meals.map(e => e.meal));
  // Κάθε μέρα
  items.push({ k: 'weigh', freq: 'Κάθε μέρα', t: 'Ζύγιση', w: 'Πρωί, μετά την τουαλέτα, πριν φας ή πιεις', done: weights().some(x => x.d === date), act: 'goSteps' });
  items.push({ k: 'meals', freq: 'Κάθε μέρα', t: 'Φαγητό', w: d.meals.length ? `${d.meals.length} καταγραφές σε ${slots.size} γεύματα` : 'Κάθε γεύμα, όσο πιο κοντά στην ώρα του', done: slots.size >= 2, act: 'goMeals' });
  const hasSteps = numIn((d.watch || {}).steps) !== null, hasSleep = numIn((d.watch || {}).sleep) !== null;
  items.push({ k: 'watch', freq: 'Κάθε μέρα', t: 'Ύπνος και βήματα', w: `Ύπνος το πρωί, βήματα το βράδυ, από το ρολόι${hasSleep && !hasSteps ? '. Λείπουν τα βήματα' : !hasSleep && hasSteps ? '. Λείπει ο ύπνος' : ''}`, done: hasSteps && hasSleep, act: 'goSteps' });
  const trains = activeProgram() || allSessions().some(x => daysSince(x.date) <= 14);
  if (trains) items.push({ k: 'train', freq: 'Μέρες προπόνησης', t: 'Προπόνηση', w: 'Κιλά, επαναλήψεις και RIR σε κάθε σετ', done: d.ex.some(e => Calc.sessionStats(e)), act: 'goEx', opt: true });
  // Κάθε εβδομάδα (την ημέρα που επέλεξες ή την επόμενη αν ξεχάστηκε)
  const lastM = measures().length ? measures()[measures().length - 1].d : null, sinceM = lastM ? Dates.idx(date) - Dates.idx(lastM) : Infinity;
  const weeklyDue = dow === wd || dow === (wd + 1) % 7;
  if (lastM === date || (sinceM >= 6 && (weeklyDue || sinceM >= 9))) items.push({ k: 'measure', freq: 'Κάθε εβδομάδα', t: 'Μεζούρα', w: 'Μέση, λαιμός, γλουτοί, πρωί πριν φας (2 λεπτά)', done: lastM === date, act: 'measureAdd' });
  const ws = Dates.weekStart(date), ci = checkins();
  const ciWeek = dow === 1 && wd === 0 ? Dates.add(ws, -7) : ws;
  if (dow === wd || (dow === (wd + 1) % 7 && !ci[ciWeek])) items.push({ k: 'checkin', freq: 'Κάθε εβδομάδα', t: 'Check-in', w: 'Ύπνος, πείνα, ενέργεια, στρες, απόδοση (1 λεπτό)', done: !!ci[ciWeek], act: 'checkin', ws: ciWeek });
  // Κάθε 2 εβδομάδες
  const lb = s.lastBackup ? Dates.key(new Date(s.lastBackup)) : null, nDays = Store.keys('day:').length;
  if (lb === date || (nDays >= 5 && (!lb || daysSince(lb) >= 14))) items.push({ k: 'backup', freq: 'Κάθε 2 εβδομάδες', t: 'Αντίγραφο ασφαλείας', w: 'Export και αποθήκευση στο Drive', done: lb === date, act: 'export' });
  // Κάθε μήνα
  const ph = photos(), lp = ph.length ? ph[0].d : null, firstDay = Store.keys('day:')[0];
  if (lp === date || ((lp ? daysSince(lp) >= 28 : firstDay && daysSince(firstDay.slice(4)) >= 3))) items.push({ k: 'photo', freq: 'Κάθε μήνα', t: 'Φωτογραφίες προόδου', w: 'Μπροστά, πλάι, πίσω, ίδιο φως (προαιρετικό)', done: lp === date, act: 'goPhotos', opt: true });
  return items;
}

  const rows = [];
  for (let i = 1; i <= bulkDays; i++) { const dd = Dates.add(Dates.today(), -i), d = Store.get('day:' + dd); rows.push({ dd, has: !!(d && d.meals.length), kcal: d && d.meals.length ? dayTotals(d).kcal : null }); }
  openDlg('Μέρες από άλλη εφαρμογή', `<p class="small">Γράψε για κάθε μέρα τα <b>σύνολα</b> της άλλης εφαρμογής: θερμίδες, πρωτεΐνη, υδατάνθρακες, λιπαρά. Άφησε κενές τις μέρες που δεν κατέγραψες <b>πλήρως</b>. Μια μέρα με ξεχασμένο γεύμα θα έκανε την εκτίμηση κατανάλωσης χαμηλότερη από την πραγματική.</p>
    <div class="bulk"><div class="bh"><span>Ημέρα</span><span>kcal</span><span>Πρωτ.</span><span>Υδατ.</span><span>Λίπ.</span></div>
    ${rows.map(r => `<div class="br ${r.has ? 'has' : ''}" data-d="${r.dd}"><span class="bd">${Dates.dow(r.dd)} ${Dates.short(r.dd)}</span>${r.has ? `<span class="small muted" style="grid-column:span 4">έχει ήδη ${fmt(r.kcal)} kcal</span>` : ['k', 'p', 'c', 'f'].map(f => `<input type="text" inputmode="decimal" data-bf="${f}" aria-label="${f}">`).join('')}</div>`).join('')}</div>
    <button class="linkish small" id="bkMore" style="margin-top:8px">+ 7 παλαιότερες μέρες</button>
    <div class="dlg-f"><button class="btn pri" id="bkSave">Αποθήκευση</button></div>
    <p class="note">Κάθε μέρα αποθηκεύεται ως μία καταχώρηση «Σύνολο ημέρας», που μετρά κανονικά στα σύνολα, στην εβδομάδα και στο προσαρμοστικό TDEE. Για να λειτουργήσει το TDEE, χρειάζονται και ζυγίσεις για τις ίδιες μέρες.</p>`, body => {
    $('#bkMore', body).addEventListener('click', () => { bulkDays += 7; openBulkTotals(); });
    $('#bkSave', body).addEventListener('click', () => {
      let n = 0, bad = 0;
      $$('.br[data-d]', body).forEach(r => {
        const v = k => { const i = $(`[data-bf="${k}"]`, r); return i ? numIn(i.value) : null; };
        const k = v('k'); if (k === null) return;
        if (k < 300 || k > 8000) { bad++; return; }
        const d = getDay(r.dataset.d);
        d.meals.push({ id: uid(), meal: 'd', name: 'Σύνολο ημέρας (από άλλη εφαρμογή)', foodId: null, g: null, per100: null, kcal: k, p: v('p') || 0, c: v('c') || 0, f: v('f') || 0, src: 'manual', est: false, total: true });
        saveDay(d); n++;
      });
      if (bad) { toast(`${bad} μέρες έχουν μη ρεαλιστικές θερμίδες (κάτω από 300 ή πάνω από 8.000) και δεν αποθηκεύτηκαν.`, 4000); if (!n) return; }
      bulkDays = 14; closeDlg(); render(); toast(n ? `Αποθηκεύτηκαν ${n} μέρες.` : 'Δεν συμπληρώθηκε καμία μέρα.');
    });
  });
}

/* ----- Μετρήσεις με οδηγίες ----- */
const MEASURE_GUIDE = {
  waist: ['Μέση', 'Στο ύψος του αφαλού. Όρθιος, κοιλιά χαλαρή (μην τη ρουφάς), μέτρα στο τέλος μιας κανονικής εκπνοής.', true],
  neck: ['Λαιμός', 'Ακριβώς κάτω από το «μήλο του Αδάμ», με τη μεζούρα λίγο προς τα κάτω μπροστά. Κεφάλι ίσια, ώμοι χαλαροί. Αν το αφήσεις κενό, κρατιέται η προηγούμενη τιμή.'],
  hip: ['Γλουτοί', 'Στο πιο φαρδύ σημείο των γλουτών, με τα πόδια ενωμένα. Αν το αφήσεις κενό, κρατιέται η προηγούμενη τιμή.'],
  chest: ['Στήθος', 'Στο ύψος των θηλών, με τη μεζούρα να περνά κάτω από τις μασχάλες και πάνω από τις ωμοπλάτες στην πλάτη. Χέρια χαλαρά κάτω, μέτρα στο τέλος κανονικής εκπνοής. Είναι πιο εύκολο αν σε βοηθήσει κάποιος ή αν χρησιμοποιήσεις καθρέφτη.'],
  arm: ['Μπράτσο', 'Στο πιο φαρδύ σημείο του δικεφάλου, με το χέρι τεντωμένο και χαλαρό δίπλα στο σώμα. Πάντα το ίδιο χέρι.'],
  thigh: ['Μηρός', 'Στο μέσο της απόστασης από τη βουβωνική πτυχή μέχρι το πάνω μέρος του γονάτου. Όρθιος, βάρος και στα δύο πόδια. Πάντα το ίδιο πόδι.'],
};
function openMeasure(date) {
  const m = measures().find(x => x.d === date) || {}, prev = measures().filter(x => x.d < (date || Dates.today())).pop() || {};
  const fld = k => { const [l, how, req] = MEASURE_GUIDE[k]; return `<div class="mf"><label class="f" style="margin:0"><span>${l} (cm)${req ? ' *' : ''}</span><input type="text" inputmode="decimal" id="ms_${k}" value="${m[k] ?? ''}" placeholder="${prev[k] !== undefined ? 'προηγ. ' + fmt(prev[k], 1) : ''}"></label><p class="how">${how}</p></div>`; };
  openDlg('Μέτρηση σώματος', `<label class="f"><span>Ημερομηνία</span><input type="date" id="ms_d" value="${date || Dates.today()}"></label>
    <p class="note">Πρωί, πριν φας, με εσώρουχο. Η μεζούρα οριζόντια, να ακουμπά το δέρμα χωρίς να το πιέζει. Μέτρα 2 φορές και γράψε τον μέσο όρο.</p>
    <h3 class="gh">Κάθε εβδομάδα</h3>${fld('waist')}${fld('neck')}${fld('hip')}
    <details ${m.chest || m.arm || m.thigh ? 'open' : ''}><summary class="gh" style="cursor:pointer">Κάθε μήνα (προαιρετικά)</summary>${fld('chest')}${fld('arm')}${fld('thigh')}</details>
    <label class="f" style="margin-top:10px"><span>Λίπος από ζυγαριά (%, προαιρετικά)</span><input type="text" inputmode="decimal" id="ms_scaleBf" value="${m.scaleBf ?? ''}"></label>
    <div class="dlg-f">${m.d ? '<button class="btn danger" id="ms_del">Διαγραφή</button><span class="grow"></span>' : ''}<button class="btn pri" id="ms_save">Αποθήκευση</button></div>`, body => {
    $('#ms_save', body).addEventListener('click', () => {
      const d = $('#ms_d', body).value; if (!d) return;
      const rec = { d }; ['waist', 'neck', 'hip', 'chest', 'arm', 'thigh', 'scaleBf'].forEach(k => { const v = numIn($('#ms_' + k, body).value); if (v !== null) rec[k] = v; });
      if (rec.waist === undefined) { toast('Η μέση είναι απαραίτητη.'); return; }
      if (rec.waist < 40 || rec.waist > 250) { toast('Μη έγκυρη τιμή μέσης.'); return; }
      Store.set('measures', measures().filter(x => x.d !== d && x.d !== m.d).concat([rec])); refreshTodaySnap(); closeDlg(); render(); toast('Η μέτρηση αποθηκεύτηκε.');
    });
    const del = $('#ms_del', body); if (del) del.addEventListener('click', () => { if (confirm('Διαγραφή μέτρησης;')) { Store.set('measures', measures().filter(x => x.d !== m.d)); refreshTodaySnap(); closeDlg(); render(); } });
  });
}
/* Για το ποσοστό λίπους: η τελευταία μέση, και λαιμός/γλουτοί από την πιο πρόσφατη μέτρηση που τους έχει (έως 120 ημέρες πίσω) */
function measureForBf(date) {
  const ms = measures().filter(x => x.d <= date); if (!ms.length) return null;
  const last = Object.assign({}, ms[ms.length - 1]);
  for (const k of ['neck', 'hip']) if (last[k] === undefined) { const src = ms.slice().reverse().find(x => x[k] !== undefined && Dates.idx(last.d) - Dates.idx(x.d) <= 120); if (src) last[k] = src[k]; }
  return last;
}

</script>
