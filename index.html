<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Weight me up</title>
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E8ECF1; --ink:#0F1E3D; --muted:#6A7488; --line:#E1E6ED;
  --accent:#1B3A6B; --accent-ink:#FFFFFF; --accent-soft:#DCE5F2; --over:#C0443B; --warn:#B7791F;
  --p:#1B3A6B; --c:#5E82BE; --f:#A3AFC2;
  --r-lg:16px; --r-sm:10px; --shadow:0 1px 2px rgba(15,30,61,.04),0 4px 16px rgba(15,30,61,.04);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#111B2E; --sunk:#18253C; --ink:#E7ECF4; --muted:#8B98AF; --line:#1F2D46;
  --accent:#8EB0E6; --accent-ink:#0A1220; --accent-soft:#1C2C4A; --over:#E57368; --warn:#E0A43A;
  --p:#8EB0E6; --c:#5677AE; --f:#5E6B82; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111B2E; --sunk:#18253C; --ink:#E7ECF4; --muted:#8B98AF; --line:#1F2D46;
  --accent:#8EB0E6; --accent-ink:#0A1220; --accent-soft:#1C2C4A; --over:#E57368; --warn:#E0A43A;
  --p:#8EB0E6; --c:#5677AE; --f:#5E6B82; --shadow:none;
}
/* Ρητά border-box: η κληρονόμηση (inherit) σπάει μέσα σε <details> στους νεότερους browsers (::details-content), και τα πεδία ξεχείλιζαν. */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.05rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
p{margin:.3rem 0}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* Κεφαλίδα */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.brand{font-weight:750;letter-spacing:-.01em;font-size:1.05rem}
.brand small{font-weight:500;color:var(--muted);margin-left:6px;font-size:.8rem}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{border:0;background:none;padding:8px 10px;border-radius:var(--r-sm)}
.datenav button:hover{background:var(--sunk)}
.datenav .lbl{font-weight:600;min-width:9.5em;text-align:center}
.datenav .lbl.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

/* Κάτω πλοήγηση */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.bottom button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--accent);font-weight:650}

/* Ενότητες */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.sec > h2{margin-bottom:10px}
.sec.flat{background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1}
.hr{height:1px;background:var(--line);margin:12px 0}

/* Σήμανση εκτιμώμενων / χειροκίνητων τιμών */
.est{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px}
.est::before{content:"≈";margin-right:1px;opacity:.75}
.man::after{content:"✎";font-size:.75em;margin-left:3px;color:var(--warn)}

/* Ισοζύγιο ημέρας */
.ledger .remain{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ledger .big{font-size:2.6rem;font-weight:780;letter-spacing:-.03em;line-height:1}
.ledger .big.over{color:var(--over)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:10px 0 6px}
.bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.bar > i.over{background:var(--over)}
.bar.thin{height:7px;margin:4px 0 0}
.ledger .figs{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.ledger .figs b{color:var(--ink);font-weight:650}
.macros{display:grid;gap:9px;margin-top:14px}
.macro .row{font-size:.86rem}
.macro .name{font-weight:600}
.macro[data-m="p"] .bar > i{background:var(--p)} .macro[data-m="c"] .bar > i{background:var(--c)} .macro[data-m="f"] .bar > i{background:var(--f)}
.macro .bar > i.over{background:var(--over)}

/* Διακόπτης καρτελών */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;margin:14px 0 4px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Γεύματα */
.meal{margin:12px 0}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list li + li{border-top:1px solid var(--line)}
.item{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border:0;background:none;text-align:left}
.item:hover{background:var(--sunk)}
.item .nm{font-weight:550}
.item .sub{font-size:.8rem;color:var(--muted)}
.item .kc{margin-left:auto;font-weight:650;white-space:nowrap}
.addbtn{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px dashed var(--line);
  border-radius:var(--r-lg);background:none;color:var(--accent);font-weight:600;margin-top:6px}
.addbtn:hover{background:var(--surface)}
.empty{padding:12px;color:var(--muted);font-size:.88rem;text-align:center}

/* Κουμπιά & πεδία */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--over)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.linkish{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
label.f{display:block;font-size:.84rem;color:var(--muted);margin-bottom:10px}
label.f > span{display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:40px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media (max-width:380px){.grid4{grid-template-columns:1fr 1fr}}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.9rem;color:var(--ink);background:var(--surface)}
.radios input{margin:0;accent-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:var(--r-lg);padding:10px 12px;margin:12px 0;font-size:.9rem}

/* Άσκηση */
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;margin:10px 0}
.exc .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.exc .hd .linkish{text-align:left;color:var(--ink);font-size:1rem}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:.75rem;font-weight:600;color:var(--muted);text-align:left;padding:2px 4px}
.sets td{padding:3px 4px}
.sets td:first-child{width:2em;color:var(--muted);font-size:.85rem}
.sets td:last-child{width:2.4em;text-align:right}
.sets input{min-height:38px;text-align:center}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:6px}
.x:hover{color:var(--over)}
.fb{font-size:.86rem;margin-top:8px;padding:7px 10px;border-radius:var(--r-sm);background:var(--sunk)}
.fb.up{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.fb.stall{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.fb.down{background:color-mix(in srgb,var(--over) 14%,transparent)}
.fb:empty{display:none}

/* Εβδομάδα */
.weekbal .big{font-size:2.4rem;font-weight:780;letter-spacing:-.03em;line-height:1.05}
.weekbal .big.neg{color:var(--accent)} .weekbal .big.pos{color:var(--over)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-weight:650;font-size:1.05rem}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:right;font-weight:600;color:var(--muted);font-size:.76rem;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--sunk)}
.tbl .neg{color:var(--accent)} .tbl .pos{color:var(--over)}
.scroll-x{overflow-x:auto}
canvas.chart{width:100%;height:180px;display:block}

/* Διάλογος */
dialog{border:0;padding:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;margin:auto auto 0;
  background:var(--surface);color:var(--ink);overflow:hidden}
@media (min-width:700px){dialog{border-radius:18px;margin:auto}}
dialog::backdrop{background:rgba(5,15,18,.5)}
dialog[open]{display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.dlg-b{padding:4px 16px 16px;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.results{list-style:none;padding:0;margin:8px 0;max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.results li + li{border-top:1px solid var(--line)}
.results .item{padding:9px 10px}
.results .item[aria-selected="true"]{background:var(--sunk)}
.parsed{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;margin:8px 0}
.parsed.miss{border-style:dashed}
.preview{display:flex;gap:12px;flex-wrap:wrap;font-size:.88rem;margin:6px 0}
.preview b{font-weight:650}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:10px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}

/* v2 */
.daykind{margin:8px 0 0;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}
.sweet{border-color:var(--accent-soft);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.sweet h2{color:var(--accent)}
ul.plain{list-style:none;margin:8px 0 0;padding:0}
.sweet-opt{padding:8px 0;border-top:1px solid var(--line)}
.qtyw{display:grid;grid-template-columns:5.5em 1fr;gap:8px}
.sets td.rir{width:4.2em}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rec{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:var(--r-sm);padding:9px 12px}
.rec p{margin:.25rem 0 0;font-size:.92rem}
.rec .src{font-size:.78rem}
.rec.act{border-left-color:var(--p)} .rec.watch{border-left-color:var(--warn)} .rec.good{border-left-color:var(--accent)}
.big2{font-size:2.1rem;font-weight:780;letter-spacing:-.03em}
.vol{display:grid;gap:6px;margin-top:6px}
.volrow{display:grid;grid-template-columns:8.6em 1fr 4.6em;align-items:center;gap:8px;font-size:.84rem}
.volrow .vn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.vb .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.vb .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--ink);border-radius:3px;opacity:.75}
.volrow.low .fill{background:var(--warn);opacity:1} .volrow.high .fill{background:var(--over);opacity:1} .volrow.ok .fill{background:var(--accent);opacity:1}
.volrow .vv{text-align:right;font-weight:650} .volrow .vv small{font-weight:400;color:var(--muted)}
@media (max-width:360px){.volrow{grid-template-columns:7em 1fr 4.4em}}

/* v3 */
#timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg)}
.tm-in{display:flex;align-items:center;gap:8px;padding:8px 14px}
.tm-in b{font-size:1.4rem;font-weight:780;min-width:3.2em}
.tm-bar{flex:1;height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--accent);width:0}
#timer .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
#timer .x{color:var(--bg)}
.plan{margin-top:4px;color:var(--p)}
.sets.pg td{padding:2px}.sets.pg input{min-height:34px;padding:4px;text-align:center}
.sets.pg .pgname{font-size:.84rem;color:var(--ink);width:auto}
.sets.pg .rng{white-space:nowrap}.sets.pg .rng input{width:2.6em}
.sets.pg td:first-child{width:auto}
.sets.pg td:nth-child(2) input,.sets.pg td:nth-child(4) input{width:3em}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph{border:0;padding:0;background:none;text-align:left}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.ph span{font-size:.75rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp figure{margin:0}.cmp img{width:100%;border-radius:8px;display:block}
.cmp figcaption{font-size:.8rem;color:var(--muted);text-align:center}
.ci{margin:8px 0}.ci .chips{margin:4px 0 0}.ci .chip{min-width:44px;text-align:center}
a.btn{text-decoration:none;color:inherit;display:inline-block}
#timer:not([hidden]) ~ #toast{bottom:calc(136px + env(safe-area-inset-bottom,0px))}

/* v4 */
.seg5 button{font-size:.78rem;padding:8px 2px}
.pthumb{width:40px;height:40px;object-fit:contain;border-radius:6px;background:#fff;flex:none}
.pthumb.lg{width:64px;height:64px}
.tbl.nut td{padding:5px 4px}
.scanbox{position:relative;margin:10px 0}
.scanbox video{width:100%;max-height:52vh;object-fit:cover;border-radius:10px;background:#000;display:block}
.scanframe{position:absolute;left:12%;right:12%;top:32%;height:22%;border:3px solid var(--accent);border-radius:10px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.25)}

/* v4.2 σχεδιασμός */
h2{font-size:.98rem;font-weight:650;letter-spacing:-.005em}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.brand{color:var(--accent);letter-spacing:-.02em}
.bottom{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.list,.exc,.parsed,.results{border-radius:var(--r-lg)}
.list,.exc{box-shadow:var(--shadow)}
.btn{border-radius:12px}
.btn.pri{box-shadow:0 1px 2px rgba(15,30,61,.15)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{background:var(--sunk);border-radius:12px}
.seg button[aria-selected="true"]{color:var(--accent)}
.addbtn{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.bar{height:10px;background:var(--sunk)}
.bar.thin{height:6px}
.ledger-top{display:grid;grid-template-columns:136px 1fr;gap:16px;align-items:center}
.ring{width:136px;height:136px;display:block}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--accent);transition:stroke-dasharray .5s ease} .ring .ov{stroke:var(--over)}
.ring .num{font-size:25px;font-weight:780;fill:var(--ink);letter-spacing:-.5px}
.ring .num.over{fill:var(--over)}
.ring .lbl{font-size:10.5px;fill:var(--muted)}
.ledger .kv{display:grid;gap:8px}
.ledger .kv div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:.88rem;color:var(--muted)}
.ledger .kv div:last-child{border-bottom:0}
.ledger .kv b{color:var(--ink);font-weight:650;font-size:1rem}
.macros{margin-top:16px}
.macro .name{font-weight:550;font-size:.86rem}
.macro .name::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--mc)}
.macro[data-m="p"]{--mc:var(--p)} .macro[data-m="c"]{--mc:var(--c)} .macro[data-m="f"]{--mc:var(--f)}
.macro .bar > i{background:var(--mc)!important}

.rec{border:1px solid var(--line);border-left-width:3px;background:var(--surface)}

/* ================= v6: μοντέρνος σχεδιασμός ================= */
:root{--r-lg:22px;--r-sm:12px;--shadow:0 1px 2px rgba(15,30,61,.04),0 10px 30px rgba(15,30,61,.07);--hero1:#0F1E3D;--hero2:#23427A}

body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--accent) 9%,var(--bg)) 0%,var(--bg) 60%) fixed;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{border-bottom:0;background:color-mix(in srgb,var(--bg) 80%,transparent)}

.logo{width:28px;height:28px;flex:none;background:var(--accent);-webkit-mask:url(logo-mask.png) center/contain no-repeat;mask:url(logo-mask.png) center/contain no-repeat}
.datenav{background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:2px}

.sec{border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.sec > h2{font-size:1rem;margin-bottom:12px}
/* Hero */
.hero{position:relative;overflow:hidden;margin:14px 0 12px;padding:20px 20px 16px;border-radius:26px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,var(--hero2) 0%,var(--hero1) 60%);box-shadow:0 14px 34px rgba(15,30,61,.28)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .eyebrow{font-size:.78rem;letter-spacing:.04em;opacity:.7}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero-num{font-size:3rem;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin-top:4px}
.hero-num.over{color:#FFB4AB}
.hero-sub{font-size:.88rem;opacity:.75}
.hero-ring{width:96px;height:96px;flex:none}
.hero-ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.hr-bg{stroke:rgba(255,255,255,.14)} .hr-fg{stroke:#fff;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)} .hr-ov{stroke:#FF8A80}
.hr-pct{fill:#fff;font-size:19px;font-weight:750}
.hero-kv{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:16px}

.hero-kv svg{width:16px;height:16px;opacity:.7;grid-row:span 2}
.hero-kv span{font-size:.72rem;opacity:.7}
.hero-kv b{font-size:1rem;font-weight:700}
.hero-tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.78rem;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:999px}
.hero-tag svg{width:14px;height:14px}
.mrings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.mring{display:flex;align-items:center;gap:7px;min-width:0}
.mring svg{width:34px;height:34px;flex:none}
.mring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.mr-t{min-width:0}
.mr-bg{stroke:rgba(255,255,255,.14)}
.mring[data-m="p"] .mr-fg{stroke:var(--p)} .mring[data-m="c"] .mr-fg{stroke:var(--c)} .mring[data-m="f"] .mr-fg{stroke:var(--f)}
.mr-fg.over{stroke:#FF8A80!important}
.mring b{display:block;font-size:.92rem;font-weight:750;line-height:1.15;white-space:nowrap}
.mring b span{font-size:.68rem;font-weight:500;opacity:.65}
.mring small{font-size:.7rem;opacity:.7}
/* Γρήγορες ενέργειες */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}
.quick button{border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:.76rem;font-weight:600}

/* Κάρτες γευμάτων */
.mealcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}

.mc-ic svg{width:21px;height:21px}
.pill{background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:650;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}

.mc-f .linkish{display:inline-flex;align-items:center;gap:6px}
.mc-f svg{width:15px;height:15px}
/* Αιωρούμενη πλοήγηση */
.bottom{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:0;border:0;border-radius:24px;box-shadow:0 10px 30px rgba(15,30,61,.16);background:color-mix(in srgb,var(--surface) 90%,transparent)}
.bottom .wrap{padding:6px}
.bottom button{border-radius:18px;padding:8px 0 7px;font-size:.72rem;transition:background .2s,color .2s}
.bottom button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
#fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;z-index:6;
  background:linear-gradient(145deg,var(--hero2),var(--hero1));color:#fff;box-shadow:0 10px 24px rgba(15,30,61,.35);display:grid;place-items:center}
#fab[hidden]{display:none}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.95)}
#timer{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:12px;right:12px;border-radius:18px}
#timer:not([hidden]) ~ #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:14px}
/* Φόρμες & κουμπιά */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.btn{border:0;background:var(--sunk);border-radius:14px;padding:10px 16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;border-radius:12px}
.seg{padding:4px;border-radius:16px}
.seg button{border-radius:12px;padding:9px 4px}
.addbtn{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:18px;padding:14px}
.exc{border:0;border-radius:var(--r-lg);padding:16px}
.banner{border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.banner .btn{white-space:nowrap;flex:none}
.list{border:0;box-shadow:var(--shadow)}
.results{border:0;background:var(--sunk)}
.parsed{border:0;background:var(--sunk);border-radius:16px}
.parsed.miss{background:transparent;border:1px dashed var(--line)}
/* Πεδία πάνω σε γκρι κάρτα: φόντο επιφάνειας, αλλιώς δεν φαίνεται ότι η ποσότητα/το τρόφιμο αλλάζουν. */
.parsed input[type=text],.parsed input[type=number],.parsed input[type=search],.parsed select,.parsed textarea{background:var(--surface)}
dialog{border-radius:26px 26px 0 0}
.dlg-h{padding:18px 18px 8px}
.dlg-h::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px}
.stats{gap:8px}
.weekbal .big{font-size:2.3rem;letter-spacing:-.04em}
.rec{border:0;border-radius:16px;background:var(--sunk);border-left:4px solid var(--muted)}
.rec.act{border-left-color:var(--accent)} .rec.watch{border-left-color:var(--warn)} .rec.good{border-left-color:var(--c)}
.sweet{border:0;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 65%)}
@media (max-width:360px){.hero-num{font-size:2.5rem}.hero-ring{width:80px;height:80px}.quick button span{font-size:.7rem}}
@media (prefers-reduced-motion:reduce){.hr-fg{transition:none}}

/* v7 */
.rt{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rtrow{display:flex;gap:6px;align-items:stretch}
.rtrow > button:first-child{flex:1}

.rt .ck{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.rt li.done .ck{background:var(--accent);border-color:var(--accent)}
.rt .ck svg{width:15px;height:15px}
.rt .go{color:var(--muted);font-size:1.2rem}
.rt .freq{display:block;font-size:.68rem;font-weight:650;letter-spacing:.03em;color:var(--accent);text-transform:none}
.opt{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;font-weight:500}
.rt-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:0;color:var(--ink);margin-bottom:10px}
.rt-prog{position:relative;width:44px;height:44px;flex:none}
.rt-prog svg{width:44px;height:44px}
.rt-prog circle{fill:none;stroke-width:4;stroke-linecap:round}
.mr-bg2{stroke:var(--sunk)} .mr-fg2{stroke:var(--accent)}

.rtcard .go{font-size:1rem}
.gh{font-size:.9rem;margin:14px 0 6px;color:var(--accent)}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guide li{background:var(--sunk);border-radius:14px;padding:10px 12px}
.mf{margin:0 0 12px}
.how{font-size:.8rem;color:var(--muted);margin:5px 2px 0;line-height:1.4}

.bh,.br{display:grid;grid-template-columns:5.2em repeat(4,1fr);gap:4px;align-items:center}

.bd{font-size:.8rem;font-weight:600}
.br.has{opacity:.6}

/* v9 */
.hero-link{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:.86rem;text-align:left}
.hero-link svg{width:18px;height:18px;opacity:.85}
.hero-link span:nth-child(2){flex:1}
.sweet-c{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}

.sw-ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}

.howto .chips{flex-wrap:wrap;margin:8px 0 0}

details.parsed > summary{list-style:none;cursor:pointer}

.parsed.combo{background:var(--accent-soft)}
.ing{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px}
.ing li{display:flex;gap:8px;font-size:.88rem}
.banner.install{background:var(--accent-soft)}
#tai svg{width:16px;height:16px;vertical-align:-3px}
.rt li button:not(.skip) .freq{margin-bottom:1px}

/* ================= v10: χρώμα με φειδώ ================= */
:root{
  --p:#F07167; --c:#F4B942; --f:#2EC4B6;             /* πρωτεΐνη κοραλί, υδατάνθρακες κεχριμπαρί, λίπος τιρκουάζ */
  --good:#1FA971; --over:#E5484D; --warn:#D98A04; --info:#7C6CF2;
  --mb:#F59E0B; --ml:#14B8A6; --md:#6D5EF0; --ms:#EC4899; --silver:#A3AEC0;
}
:root[data-theme="dark"]{--p:#FF8A7A;--c:#FFC857;--f:#4FD8C9;--good:#34D399;--over:#FF6B6B;--warn:#F5B942;--info:#A89BFF;--mb:#FBBF24;--ml:#2DD4BF;--md:#9B8CFF;--ms:#F472B6;--silver:#6B7A93}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#FF8A7A;--c:#FFC857;--f:#4FD8C9;--good:#34D399;--over:#FF6B6B;--warn:#F5B942;--info:#A89BFF;--mb:#FBBF24;--ml:#2DD4BF;--md:#9B8CFF;--ms:#F472B6;--silver:#6B7A93}}
/* Κάρτα ημέρας: μπλε βάση, χρωματιστές λεπτομέρειες */
.hero-kv .kv-food svg{color:var(--c);opacity:1} .hero-kv .kv-target svg{color:#C9D6EA;opacity:1} .hero-kv .kv-burn svg{color:var(--p);opacity:1}
.hr-ov{stroke:var(--over)}
.hero-num.over{color:#FFB4AB}
.mring[data-m="p"]{--mc:var(--p)} .mring[data-m="c"]{--mc:var(--c)} .mring[data-m="f"]{--mc:var(--f)}
.hero-link svg{color:var(--c);opacity:1}
/* Γεύματα: κάθε γεύμα το χρώμα του */
.mc-ic{background:color-mix(in srgb,var(--mt) 14%,transparent);color:var(--mt)}
.ic-b{--mt:var(--mb)} .ic-l{--mt:var(--ml)} .ic-d{--mt:var(--md)} .ic-s{--mt:var(--ms)}
.mealcard{border-left:0}
.mealcard.open .mc-h{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 4%,transparent),transparent)}
/* Γλυκό */
.sw-ic{background:color-mix(in srgb,var(--ms) 14%,transparent);color:var(--ms)}
.sweet-c.open{box-shadow:var(--shadow),inset 3px 0 0 var(--ms)}
/* Ρουτίνα & «Ξεκίνα εδώ» */
.rt li.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.rt .freq{color:var(--info)}
.mr-fg2{stroke:var(--good)}
.onb .bar > i, .rtcard .bar > i{background:var(--good)}
/* Προτάσεις */
.rec{border-left-width:4px}
.rec.act{border-left-color:var(--accent)} .rec.watch{border-left-color:var(--warn)} .rec.good{border-left-color:var(--good)} .rec.info{border-left-color:var(--info)}
.rec .small.muted:first-child{font-weight:600;letter-spacing:.02em}
.rec.act .small.muted:first-child{color:var(--accent)} .rec.watch .small.muted:first-child{color:var(--warn)} .rec.good .small.muted:first-child{color:var(--good)} .rec.info .small.muted:first-child{color:var(--info)}
/* Εβδομάδα */
.weekbal .big.neg,.tbl .neg{color:var(--good)} .weekbal .big.pos,.tbl .pos{color:var(--over)}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--sc,var(--silver))}
.stats .stat:nth-child(1){--sc:var(--c)} .stats .stat:nth-child(2){--sc:var(--accent)} .stats .stat:nth-child(3){--sc:var(--mb)} .stats .stat:nth-child(4){--sc:var(--p)}
.stats .stat:nth-child(5){--sc:var(--f)} .stats .stat:nth-child(6){--sc:var(--ml)} .stats .stat:nth-child(7){--sc:var(--md)} .stats .stat:nth-child(8){--sc:var(--silver)}
/* Όγκος προπόνησης */
.volrow.ok .fill{background:var(--good)} .volrow.low .fill{background:var(--warn)} .volrow.high .fill{background:var(--over)}
.vb .band{background:color-mix(in srgb,var(--good) 16%,transparent)}
/* Ανατροφοδότηση ασκήσεων */
.fb.up{background:color-mix(in srgb,var(--good) 14%,transparent)} .fb.stall{background:color-mix(in srgb,var(--warn) 16%,transparent)} .fb.down{background:color-mix(in srgb,var(--over) 12%,transparent)}
.plan{color:var(--info)}
/* Κουμπιά/chips: μπλε κύρια, λεπτομέρειες χρώματος */
.quick button svg{color:var(--accent)}
.howto{border-left:3px solid var(--info)}
.parsed.combo{background:color-mix(in srgb,var(--ml) 10%,var(--surface))}
.banner.install{background:color-mix(in srgb,var(--info) 12%,var(--surface))}
.tag{color:var(--mb)}
.bottom button[aria-current="page"] svg{color:var(--accent-ink)}

/* v11 */
#undo{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;font-size:.9rem;transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#undo.show{opacity:1;transform:none;pointer-events:auto}
#undo span{flex:1}
#undo button{border:0;background:none;color:var(--c);font-weight:700;padding:6px 8px}
.note.safety{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:0 10px 10px 0;padding:8px 10px;color:var(--ink)}
.banner.backup{background:color-mix(in srgb,var(--warn) 11%,var(--surface))}
@media (prefers-reduced-motion:reduce){#undo{transition:none}}

/* v12 */
.daydone{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 4px;border:1.5px dashed color-mix(in srgb,var(--good) 50%,var(--line));background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;color:var(--ink)}
.daydone .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--good);display:grid;place-items:center;flex:none;color:#fff;font-weight:800}
.daydone.on{border-style:solid;background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.daydone.on .ck{background:var(--good)}
.setno{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:.8rem}
tr.wu .setno{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);border-color:transparent}
tr.wu input{opacity:.6}
.pgi{border-top:1px solid var(--line);padding:10px 0}
.pgg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.pgg label{display:flex;flex-direction:column;gap:3px;font-size:.68rem;color:var(--muted)}
.pgg input{min-height:36px;padding:4px;text-align:center;width:100%;background:var(--surface);border:1px solid var(--line)}
.pgg label > span:first-child{white-space:nowrap}
.pgg .rng{display:flex;align-items:center;gap:2px}
.pgg .rng input{min-width:0}
@media (max-width:380px){.pgg{grid-template-columns:repeat(3,1fr)}}
.coach-status{font-size:.86rem;color:var(--muted);margin:0 0 10px}
.cb{border-radius:16px;padding:10px 12px;margin:8px 0;background:var(--sunk)}
.cb-h{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.cb-keep{background:color-mix(in srgb,var(--good) 9%,var(--surface))} .cb-keep .cb-h{color:var(--good)}
.cb-change{background:color-mix(in srgb,var(--accent) 8%,var(--surface))} .cb-change .cb-h{color:var(--accent)}
.cb-watch{background:color-mix(in srgb,var(--warn) 10%,var(--surface))} .cb-watch .cb-h{color:var(--warn)}
.cb ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cb li{display:grid;gap:2px}
.cb li .btn{justify-self:start;margin-top:4px}
.allrecs{margin-top:10px}
.allrecs > summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:6px 0}
.allrecs .recs{margin-top:8px}
.rec.sup{opacity:.6}
.rec .btn{margin-top:6px}
.ev{font-size:.68rem;border-radius:999px;padding:1px 7px;font-weight:600;white-space:nowrap}
.ev-high{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.ev-moderate{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.ev-heuristic{background:color-mix(in srgb,var(--silver) 25%,transparent);color:var(--muted)}
.swapbtns{display:flex;flex-direction:column;gap:4px}
.exc .hd .x{padding:6px 8px}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}#toast{transition:none}.ring .fg{transition:none}}
/* Στενές οθόνες: οι κάρτες της ημέρας και η κεφαλίδα χωρούν χωρίς να κόβονται (14.1.3) */
.hero-kv{grid-auto-columns:minmax(0,1fr)}
.hero-kv div{min-width:0}
.hero-kv b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){
 .hero-kv{gap:6px}.hero-kv div{padding:8px 7px;grid-template-columns:14px minmax(0,1fr);column-gap:5px}.hero-kv svg{width:14px;height:14px}.hero-kv b{font-size:.92rem}
 .mrings{gap:6px}.mring{gap:5px}.mring svg{width:28px;height:28px}.mring b span{display:block}
 .mc-h{gap:8px;padding:12px 10px 10px}.mc-ic{width:34px;height:34px;border-radius:12px}
}
.mc-h .grow{min-width:0}
@media (max-width:340px){
 .brand .brandtxt{display:none}
 .hero-kv div{grid-template-columns:minmax(0,1fr);padding:8px}.hero-kv svg{display:none}.hero-kv b{font-size:.88rem}
 .datenav button{padding:7px 8px}
}
</style>

<nav class="bottom" aria-label="Κύρια πλοήγηση"><div class="wrap">

  <button data-nav="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Προφίλ</button>
</div></nav>
<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg-h"><h2 id="dlgTitle"></h2><button class="x" data-act="dlgClose" aria-label="Κλείσιμο">✕</button></div><div class="dlg-b" id="dlgBody"></div></dialog>
<button id="fab" data-act="fab" aria-label="Προσθήκη φαγητού" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="timer" hidden><div class="wrap tm-in"><b id="tmTxt">0:00</b><div class="tm-bar"><i id="tmBar"></i></div><button class="btn sm" data-act="tmSub">−15″</button><button class="btn sm" data-act="tmAdd">+15″</button><button class="x" data-act="tmStop" aria-label="Διακοπή χρονομέτρου">✕</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="undo" role="status" aria-live="polite"><span id="undoMsg"></span><button data-act="undo">Αναίρεση</button></div>
<div id="storageStatus" role="status" style="position:sticky;top:0;z-index:50" hidden></div>
<script data-module="reliability.js">/* WeightMeUp 14: deterministic validation and decision rules. No network or DOM. */
'use strict';
const Reliability = (() => {
  const SCHEMA = 6;
  const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  const num = x => {
    if (typeof x === 'number') return Number.isFinite(x) ? x : null;
    if (typeof x !== 'string' || !/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(x.trim())) return null;
    const n = Number(x.trim().replace(',', '.')); return Number.isFinite(n) ? n : null;
  };
  const blank = x => x === '' || x === null || x === undefined;
  const inRange = (v, lo, hi, integer = false) => num(v) !== null && num(v) >= lo && num(v) <= hi && (!integer || Number.isInteger(num(v)));
  function date(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s) || +s.slice(0, 4) < 1900 || +s.slice(0, 4) > 2100) return false;
    const d = new Date(s + 'T12:00:00Z'); return Number.isFinite(+d) && d.toISOString().slice(0, 10) === s;
  }
  const id = s => typeof s === 'string' && /^[A-Za-z0-9_-]{1,120}$/.test(s);
  const obj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
  const MUSCLE_IDS = ['chest','lats','upperback','traps','fdelt','sdelt','rdelt','biceps','triceps','forearms','quads','hams','glutes','calves','adductors','abs','lowback'];
  const UNITS = ['g','ml','piece','portion','tbsp','tsp','cup','bowl','plate','handful','glass','slice'];
  const POSES = ['front','side','back'];
  const BF_SOURCES = ['','dexa','bodpod','hydro','calipers','bia','other'];
  const ranges = { age:[10,110],height:[100,250],goalPct:[-30,30],proteinPerKg:[0.5,3.5],fatPct:[15,50],bfManual:[3,60],goalKg:[25,350],goalStartKg:[25,350] };
  const overrides = { tdee:[500,10000],kcal:[500,10000],p:[0,1000],c:[0,2000],f:[0,1000] };
  function profile(p) {
    if (!obj(p)) return 'Μη έγκυρο προφίλ.';
    for (const [k,[lo,hi]] of Object.entries(ranges)) if (!blank(p[k]) && !inRange(p[k],lo,hi)) return `Μη έγκυρη τιμή ${k} (${lo}–${hi}).`;
    if (p.sex !== undefined && !['m','f'].includes(p.sex)) return 'Μη έγκυρο φύλο.';
    if (p.goal !== undefined && !['cut','bulk','recomp','maintain'].includes(p.goal)) return 'Μη έγκυρος στόχος.';
    if (p.activity !== undefined && !['sedentary','light','moderate','active','very'].includes(p.activity)) return 'Μη έγκυρη δραστηριότητα.';
    if (p.bfManualSrc !== undefined && !BF_SOURCES.includes(p.bfManualSrc)) return 'Μη έγκυρη μέθοδος μέτρησης λίπους.';
    if (!blank(p.bfManualDate) && !date(p.bfManualDate)) return 'Μη έγκυρη ημερομηνία μέτρησης λίπους.';
    if (!blank(p.goalSince) && !date(p.goalSince)) return 'Μη έγκυρη ημερομηνία στόχου.';
    if (p.transition !== undefined && (!obj(p.transition) || !inRange(p.transition.from,-30,30) || !date(p.transition.since))) return 'Μη έγκυρη μετάβαση στόχου.';
    if (p.goalReached !== undefined && (!obj(p.goalReached) || !date(p.goalReached.d) || !inRange(p.goalReached.kg,25,350) || !['cut','bulk'].includes(p.goalReached.from))) return 'Μη έγκυρη επίτευξη στόχου.';
    if (p.overrides !== undefined && !obj(p.overrides)) return 'Μη έγκυρες χειροκίνητες τιμές.';
    for (const [k,[lo,hi]] of Object.entries(overrides)) if (!blank(p.overrides?.[k]) && !inRange(p.overrides[k],lo,hi)) return `Μη έγκυρη χειροκίνητη τιμή ${k} (${lo}–${hi}).`;
    return null;
  }
  function plan(p) {
    if (!obj(p) || !inRange(p.sets,1,30,true)) return 'Τα σετ πρέπει να είναι ακέραιος από 1 έως 30.';
    if (!inRange(p.lo,1,3600,true) || !inRange(p.hi,1,3600,true) || +p.lo > +p.hi) return 'Το εύρος πρέπει να έχει θετικά ακέραια όρια και το κάτω όριο να μην υπερβαίνει το πάνω.';
    if (!blank(p.rest) && !inRange(p.rest,0,3600,true)) return 'Μη έγκυρο διάλειμμα (0–3600 δευτ.).';
    if (blank(p.rirLo) !== blank(p.rirHi) || (!blank(p.rirLo) && (!inRange(p.rirLo,0,10,true) || !inRange(p.rirHi,0,10,true) || +p.rirLo > +p.rirHi))) return 'Συμπλήρωσε και τα δύο όρια RIR, με 0 ≤ κάτω ≤ πάνω ≤ 10, ή άφησέ τα κενά.';
    if (!blank(p.inc) && !inRange(p.inc,0.01,100)) return 'Το βήμα βάρους πρέπει να είναι θετικό (έως 100 kg).';
    return null;
  }
  function program(p) {
    if (!obj(p) || !id(p.id) || typeof p.name !== 'string' || !p.name.trim() || p.name.length > 200 || !Array.isArray(p.days) || !p.days.length || p.days.length > 31) return 'Χρειάζονται όνομα (έως 200 χαρακτήρες) και ημέρες προγράμματος.';
    if (!blank(p.sessionsPerWeek) && !inRange(p.sessionsPerWeek,1,14,true)) return 'Οι προπονήσεις ανά εβδομάδα πρέπει να είναι 1–14.';
    if (p.scheduleFrom && (!date(p.scheduleFrom) || new Date(p.scheduleFrom+'T12:00Z').getUTCDay() !== 1)) return 'Η έναρξη μέτρησης συνέπειας πρέπει να είναι Δευτέρα.';
    if(p.scheduleHistory!==undefined){if(!Array.isArray(p.scheduleHistory))return 'Μη έγκυρο ιστορικό συχνότητας.';const dates=new Set();for(const h of p.scheduleHistory){if(!obj(h)||!date(h.from)||new Date(h.from+'T12:00Z').getUTCDay()!==1||dates.has(h.from)||!inRange(h.weekly,0,14,true))return 'Μη έγκυρο ιστορικό συχνότητας.';dates.add(h.from);}}
    const ids = new Set();
    for (const d of p.days) {
      if (!obj(d) || !id(d.id) || ids.has(d.id) || typeof d.name !== 'string' || !d.name.trim() || d.name.length > 200 || !Array.isArray(d.items) || !d.items.length || d.items.length > 100) return 'Κάθε ημέρα χρειάζεται μοναδικό αναγνωριστικό, όνομα και τουλάχιστον μία άσκηση.';
      ids.add(d.id);
      for (const it of d.items) { const err=plan(it); if (err || !id(it?.exId)) return err || 'Μη έγκυρη άσκηση.'; }
    }
    return null;
  }
  const timed = e => ['plank','side_plank'].includes(e.exId || e.id) || e.metric === 'seconds';
  const systemLoad = e => ['pullup','chinup','dips_chest','dips_tri'].includes(e.exId || e.id) || e.metric === 'system';
  const metricLabel = key => key?.startsWith('seconds:') ? 'Δευτερόλεπτα' : key?.startsWith('reps:') ? 'Επαναλήψεις' : key === 'system' ? 'Δείκτης ≈1RM σώματος + φορτίου (kg)' : key === 'minutes' ? 'Λεπτά' : 'Εκτιμώμενο 1RM (kg)';
  const metricValue = st => st?.metricValue ?? null;
  // Policies, not calibrated probabilities or medical thresholds.
  function gates({ad, sleep, checkin, readiness, declining=false, progressing=false, protectedProfile=false}={}) {
    // Κενή απάντηση check-in (null/'') δεν ισοδυναμεί με χαμηλή βαθμολογία.
    const ci = k => num(checkin?.[k]);
    const recovery = ['tired','pain'].includes(readiness) || (sleep?.n >= 4 && sleep.avg < 6.5) || (checkin && ((ci('sleep') !== null && ci('sleep') <= 2) || (ci('energy') !== null && ci('energy') <= 2) || (ci('stress') !== null && ci('stress') >= 4))) || declining;
    return { recovery:!!recovery, progressing:!!progressing, calorieChange:!!ad?.eligible && !recovery && !protectedProfile, loadIncrease:!recovery && readiness !== 'short', volumeIncrease:!recovery && !progressing && readiness !== 'short' };
  }
  function gateRecs(recs,g) {
    for (const r of recs) {
      let why='';
      if (r.effect === 'calories' && !g.calorieChange) why=g.recovery ? 'Πρώτα αξιολόγηση της ανάκαμψης.' : 'Ανεπαρκή ή ακατάλληλα δεδομένα για αλλαγή θερμίδων.';
      if (r.effect === 'load' && !g.loadIncrease) why='Πρώτα ανάκαμψη· δεν προτείνεται αύξηση επιβάρυνσης.';
      if (r.effect === 'volume' && !g.volumeIncrease) why=g.progressing && !g.recovery ? 'Υπάρχει ήδη πρόοδος· διατήρησε τον όγκο.' : 'Πρώτα ανάκαμψη· δεν προτείνεται αύξηση όγκου.';
      if (why) { r.suppressed=true;r.note=why; }
    }
    return recs;
  }
  function limitWeekly(previous, proposed, elapsedDays, max=150) {
    if (!Number.isFinite(proposed)) return previous;
    if (!Number.isFinite(previous)) return proposed;
    if (elapsedDays < 7) return previous;
    return previous + Math.max(-max,Math.min(max,proposed-previous));
  }
  // Γενικά όρια: κανένα κείμενο πάνω από 20.000 χαρακτήρες (εκτός από τα δεδομένα εικόνας), κανένας πίνακας πάνω από 100.000 στοιχεία.
  function unsafeTree(x,depth=0,key='') {
    if (depth>24) return true;
    if (typeof x === 'number' && !Number.isFinite(x)) return true;
    if (typeof x === 'string') return key !== 'data' && x.length > 20000;
    if (Array.isArray(x) && x.length > 100000) return true;
    if (x && typeof x==='object') return Object.entries(x).some(([k,v])=>['__proto__','prototype','constructor'].includes(k)||unsafeTree(v,depth+1,k));
    return false;
  }
  // Αυστηρός έλεγχος τύπου για κάθε γνωστό προαιρετικό πεδίο: [πεδίο, 'str', μέγιστο μήκος] | [πεδίο, 'bool'] | [πεδίο, 'num', min, max] | [πεδίο, 'id'].
  const typeErr=(o,spec)=>spec.filter(([k,t,a,b])=>{const v=o[k];if(v===undefined||v===null)return false;
    return t==='str'?typeof v!=='string'||v.length>a:t==='bool'?typeof v!=='boolean':t==='num'?(!blank(v)&&!inRange(v,a,b)):t==='id'?(v!==''&&!id(v)):false;}).map(([k])=>k);
  const EXTRA_UNITS=['cup','bowl','plate','handful','glass','slice'];
  const MEAL_SPEC=[['src','str',40],['foodId','id'],['sweetKcal','num',0,100000],['note','str',300],['alc','num',0,20000]];
  const FOOD_SPEC=[['brand','str',200],['barcode','str',40],['src','str',40],['cat','str',40],['qtyLabel','str',200],['offDate','num',0,1e16],['nutriscore','str',2],['supp','bool'],['liquid','bool'],['pri','num',0,100],['alc','num',0,100],['img','str',1000],['group','str',100],['modified','bool'],['custom','bool'],['builtin','bool'],...EXTRA_UNITS.map(u=>[u,'num',.01,100000])];
  function validateData(data) {
    const errors=[]; const err=(s)=>{if(errors.length<20)errors.push(s);};
    if (!obj(data) || unsafeTree(data)) return ['Μη έγκυρη δομή δεδομένων.'];
    const nut=(e,path,per100=false,depth=0)=>{
      if(!obj(e)||depth>8) {err(path);return;}
      for(const k of ['kcal','p','c','f']) if(!inRange(e[k],0,per100?(k==='kcal'?1000:100):(k==='kcal'?100000:20000)))err(path+'.'+k);
      for(const k of ['fiber','salt','satfat','sugars','alc']) if(!blank(e[k])&&!inRange(e[k],0,per100?100:20000))err(path+'.'+k);
      for(const f of ['edited','est','sweet','total'])if(e[f]!==undefined&&typeof e[f]!=='boolean')err(path+'.'+f);
      if(e.per100!==undefined&&e.per100!==null)nut(e.per100,path+'.per100',true,depth+1);
      for(const k of ['g','qty'])if(!blank(e[k])&&!inRange(e[k],.001,100000))err(path+'.'+k);
      if(!blank(e.unit)&&!UNITS.includes(e.unit))err(path+'.unit');
      if(e.name!==undefined&&(typeof e.name!=='string'||e.name.length>300))err(path+'.name');
      if(e.items!==undefined){if(!Array.isArray(e.items))err(path+'.items');else e.items.forEach(x=>nut(x,path+'.items',false,depth+1));}
    };
    const set=(s,type,path)=>{
      if(!obj(s)){err(path);return;}if(s.wu!==undefined&&typeof s.wu!=='boolean')err(path+'.wu');
      for(const [k,hi] of Object.entries(type==='c'?{min:1440,km:1000}:{w:1500,r:3600,rir:10})) if(!blank(s[k])&&!inRange(s[k],0,hi,['r','rir'].includes(k)))err(path+'.'+k);
    };
    for (const [k,v] of Object.entries(data)) {
      if(k.startsWith('_')) continue;
      if(k.startsWith('day:')) {
        if(!obj(v)||!date(v.date)||k!=='day:'+v.date||!Array.isArray(v.meals)||!Array.isArray(v.ex)){err(k);continue;}
        const ids=new Set();
        for(const e of v.meals){nut(e,k+'.meals');if(!e||!id(e.id)||ids.has(e.id)||typeof e.name!=='string'||!['b','l','d','s'].includes(e.meal)){err(k+'.meal');continue;}ids.add(e.id);for(const f of typeErr(e,MEAL_SPEC))err(k+'.meals.'+f);for(const it of Array.isArray(e.items)?e.items:[])if(obj(it))for(const f of typeErr(it,MEAL_SPEC))err(k+'.items.'+f);if(e.items!==undefined){if(!Array.isArray(e.items))err(k+'.items');else e.items.forEach(i=>nut(i,k+'.items'));}}
        const eids=new Set();
        for(const e of v.ex){if(!obj(e)||!id(e.id)||eids.has(e.id)||!id(e.exId)||typeof e.name!=='string'||!['w','bw','c'].includes(e.type)||!Array.isArray(e.sets)||e.sets.length>200){err(k+'.ex');continue;}eids.add(e.id);if(e.name.length>300||(e.sug!==undefined&&(typeof e.sug!=='string'||e.sug.length>1000)))err(k+'.ex.name');e.sets.forEach(s=>set(s,e.type,k+'.sets'));if(e.plan&&plan(e.plan))err(k+'.plan');if(e.prog&&(!obj(e.prog)||!id(e.prog.pid)||(e.prog.did!==undefined&&!id(e.prog.did))))err(k+'.prog');}
        if(v.watch){if(!obj(v.watch))err(k+'.watch');else for(const [f,max] of Object.entries({steps:150000,sleep:24,kcal:30000,kcalOverride:30000}))if(!blank(v.watch[f])&&!inRange(v.watch[f],0,max))err(k+'.watch.'+f);}
        if(v.snap){nut(v.snap,k+'.snap');for(const f of ['tdee','bmr'])if(!blank(v.snap[f])&&!inRange(v.snap[f],1,10000))err(k+'.snap.'+f);}
        if(v.complete!==undefined&&typeof v.complete!=='boolean')err(k+'.complete');
        if(v.readiness!==undefined&&!['','normal','tired','pain','short'].includes(v.readiness))err(k+'.readiness');
      } else if(k==='profile'){const e=profile(v);if(e)err(e);}
      else if(['weights','measures','scalebf'].includes(k)) {
        if(!Array.isArray(v)){err(k);continue;}const ds=new Set();
        for(const x of v){if(!obj(x)||!date(x.d)||ds.has(x.d)){err(k);continue;}ds.add(x.d);if(k==='weights'&&!inRange(x.kg,25,350))err(k+'.kg');if(k==='weights'&&x.src!==undefined&&(typeof x.src!=='string'||x.src.length>20))err(k+'.src');if(k==='scalebf'&&!inRange(x.bf,3,60))err(k+'.bf');if(k==='measures'){for(const f of ['waist','neck','hip','chest','arm','thigh'])if(!blank(x[f])&&!inRange(x[f],5,300))err(k+'.'+f);if(!blank(x.scaleBf)&&!inRange(x.scaleBf,3,60))err(k+'.scaleBf');}}
      } else if(k==='programs') {

    const invalid=intake.some(x=>!x||!Number.isInteger(x.d)||x.d<0||x.d>=window||!Number.isFinite(x.kcal)||x.kcal<0||x.kcal>10000)||weights.some(x=>!x||!Number.isInteger(x.d)||x.d<0||x.d>window||!Number.isFinite(x.kg)||!Reliability.inRange(x.kg,25,350));

    if(a>b*1.005)return {kind:'up',text:'Υψηλότερος συγκρίσιμος δείκτης σε αυτή τη συνεδρία. Η μακροχρόνια τάση χρειάζεται περισσότερες καταγραφές.'};

})();

/* ===== ΗΜΕΡΟΜΗΝΙΕΣ (τοπική ώρα, όχι UTC) ===== */
const Dates = (() => {
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const today = () => key(new Date());
  const add = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
  const weekStart = k => { const d = parse(k); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return key(d); };
  const idx = k => Math.round(parse(k).getTime() / 864e5);
  const DAYS = ['Κυρ', 'Δευ', 'Τρί', 'Τετ', 'Πέμ', 'Παρ', 'Σάβ'];
  const MONTHS = ['Ιαν', 'Φεβ', 'Μαρ', 'Απρ', 'Μαΐ', 'Ιουν', 'Ιουλ', 'Αυγ', 'Σεπ', 'Οκτ', 'Νοε', 'Δεκ'];
  const label = k => { const d = parse(k); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const short = k => { const d = parse(k); return `${d.getDate()}/${d.getMonth() + 1}`; };
  const dow = k => DAYS[parse(k).getDay()];
  const dowNum = k => parse(k).getDay();
  return { key, parse, today, add, weekStart, idx, label, short, dow, dowNum };
})();

/* ===== ΑΝΑΛΥΤΗΣ ΕΛΕΥΘΕΡΟΥ ΚΕΙΜΕΝΟΥ (τοπικός, χωρίς API) ===== */

}
function effectiveProfile(date) { const p = profile(), v = transitionPct(p, date); return v === null ? p : { ...p, goalPct: v }; }
/* Βάρος-στόχος: όταν η τάση βάρους (μέσος 7 ημερών) τον φτάσει, η μείωση/αύξηση γίνεται διατήρηση με σταδιακή μετάβαση. */
function checkGoalReached() {
  const p = profile(), g = numIn(p.goalKg), T = Dates.today(), kg = weightTrendOn(T);
  if (g === null || !kg || !((p.goal === 'cut' && kg <= g) || (p.goal === 'bulk' && kg >= g))) return false;
  const pct = numIn(p.goalPct) ?? Calc.GOALS[p.goal].pct;
  Object.assign(p, { goal: 'maintain', goalPct: '', goalSince: T, goalReached: { d: T, kg: Math.round(kg * 10) / 10, from: p.goal }, transition: { from: pct, since: T } });
  if (!saveProfile(p)) return false;
  toast(`Έφτασες τον στόχο των ${fmt(g, 1)} kg! Ο στόχος έγινε «Διατήρηση», με σταδιακή αύξηση θερμίδων τις επόμενες εβδομάδες.`, 8000); return true;
}
/* Πρόοδος προς τον βάρος-στόχο και εκτίμηση άφιξης από τον πραγματικό ρυθμό (τάση 4 εβδομάδων). */
function goalProgress(date = Dates.today()) {
  const p = profile(), g = numIn(p.goalKg), now = weightTrendOn(date); if (g === null || !now) return null;
  const start = numIn(p.goalStartKg) ?? now, prev = weightTrendOn(Dates.add(date, -28)), rate = prev ? (now - prev) / 4 : null;
  const total = start - g, done = start - now, pct = Math.abs(total) > 0.05 ? Math.max(0, Math.min(100, done / total * 100)) : 100;
  const toward = rate !== null && Math.abs(rate) >= 0.05 && Math.sign(rate) === Math.sign(g - now);
  const weeks = toward ? (g - now) / rate : null;
  return { goal: g, start, now, pct, rate, weeks, eta: weeks !== null && weeks < 260 ? Dates.add(date, Math.round(weeks * 7)) : null };
}
function goalProgressHTML() {
  const gp = goalProgress(), p = profile(), tv = transitionPct(p, Dates.today());

  if (gp) h += `<p class="small">Βάρος-στόχος <b>${fmt(gp.goal, 1)} kg</b>: τώρα ${fmt(gp.now, 1)} kg (από ${fmt(gp.start, 1)}), πρόοδος <b>${fmt(gp.pct)}%</b>. ${gp.rate === null ? 'Ο ρυθμός υπολογίζεται μετά από 4 εβδομάδες ζυγίσεων.' : `Ρυθμός ${fmt(gp.rate, 2)} kg/εβδ. ` + (gp.eta ? `· εκτιμώμενη άφιξη <b>${Dates.label(gp.eta)}</b> (≈${fmt(gp.weeks)} εβδ., αν συνεχιστεί ο ίδιος ρυθμός).` : '· με τον τωρινό ρυθμό δεν πλησιάζεις τον στόχο.')}</p>`;
  if (tv !== null) h += `<p class="note">Μετάβαση σε διατήρηση μετά τον στόχο: αυτή την εβδομάδα μεταβολή θερμίδων ${fmt(tv, 1)}%, μέχρι να φτάσει στο 0.</p>`;
  if (p.goalReached && p.goal === 'maintain') h += `<p class="small muted">Ο στόχος επιτεύχθηκε ${Dates.label(p.goalReached.d)} (${fmt(p.goalReached.kg, 1)} kg).</p>`;
  return h;
}
function baseTargets(date) {
  return cached('t'+date,()=>{
    const kg=weightTrendOn(date);if(!kg)return null;
    const p=effectiveProfile(date),bf=bfOn(date),tb=trustedBf(date),ad=adaptiveOn(date),s=settings(),opts={bf:tb?tb.bf:(bf?.bf??null),bfSrc:tb?'manual':(bf?.src==='manual'?'manual-unverified':bf?.src||null),adaptive:ad,useAdaptive:s.useAdaptive};
    let t=Calc.targets(p,kg,opts);if(!t)return null;
    if(!s.useAdaptive||numIn(p.overrides?.tdee)!==null)return t;
    // Η κατανάλωση δεν εξαρτάται από τον στόχο: αλλαγή στόχου (π.χ. μείωση → διατήρηση) δεν σβήνει ό,τι έμαθε το προσαρμοστικό TDEE.
    const signature=JSON.stringify([p.sex,p.age,p.height,p.activity,p.bfManual,p.bfManualSrc,p.bfManualDate,p.overrides?.tdee]);
    let state=Store.get('targetState');
    if(!state||state.signature!==signature){state={signature,value:t.formulaTdee,date,source:'formula'};if(date===Dates.today())Store.set('targetState',state);}
    if(date===Dates.today()&&recoveryGate(date,ad).calorieChange&&Dates.idx(date)-Dates.idx(state.date)>=7){
      // Σε κάθε αξιολόγηση ο στόχος κινείται προς την εκτίμηση από τα δεδομένα κατά τον συντελεστή εμπιστοσύνης (έως 35%/80%),
      // ξεκινώντας από τον τρέχοντα στόχο και όχι από τον τύπο: έτσι το λάθος του τύπου μειώνεται σε κάθε αξιολόγηση αντί να μένει μόνιμα.
      const proposed=ad.confidence*ad.tdee+(1-ad.confidence)*state.value;

    return t;
  });
}

function splitFor(t) { const s = settings(); return Calc.split(t.kcal, s.highMode, numIn(s.highBoost), Math.max(numIn(s.minKcal) || 0,t.floor||0,t.minor||t.lowBmi?t.tdee:t.lean?t.tdee*.9:0,t.p*4)); }

function saveDay(d) {

let foodCache = null;
function foods() {

  const custom = Store.get('foods', []) || [];
  const byId = new Map(BUILTIN_FOODS.map(f => [f.id, Object.assign({ builtin: true }, f)]));
  for (const c of custom) { const b = BUILTIN_FOODS.find(x => x.id === c.id); byId.set(c.id, Object.assign({ cat: b ? b.cat : 'other' }, b ? { sweet: b.sweet } : {}, c, { builtin: !!b, modified: !!b, custom: !b })); }
  const list = [...byId.values()];
  foodCache = { list, byId, index: Parser.prepareIndex(list) };

}
function foodSnapshot(f){return Object.fromEntries(['id','name','kcal','p','c','f','fiber','salt','satfat','sugars','portion','piece','tbsp','tsp','cat','liquid'].filter(k=>f[k]!==undefined).map(k=>[k,f[k]]));}
function saveCustomFood(f) { const arr = (Store.get('foods', []) || []).filter(x => x.id !== f.id); arr.push(f); Store.set('foods', arr); foodCache = null; }
function removeCustomFood(id) { const source=foods().byId.get(id),arr=(Store.get('foods',[])||[]).filter(x=>x.id!==id);if(source)for(const f of arr)for(const it of f.recipe?.items||[])if(it.foodId===id&&!it.per100)it.per100=foodSnapshot(source);Store.set('foods',arr);foodCache=null; }
const GROUP_DEFAULT_MUSCLES = { 'Στήθος': ['chest'], 'Πλάτη': ['lats', 'upperback'], 'Πόδια': ['quads', 'glutes'], 'Ώμοι': ['sdelt'], 'Χέρια': ['biceps'], 'Κορμός': ['abs'], 'Καρδιο': [] };

function nutrientsFor(per100,g) {return Object.fromEntries(['fiber','satfat','salt','sugars'].map(k=>[k,numIn(per100?.[k])!==null?per100[k]*g/100:null]));}
function macrosFor(per100,g) {const k=g/100;return {kcal:per100.kcal*k,p:per100.p*k,c:per100.c*k,f:per100.f*k,...nutrientsFor(per100,g)};}
function nutrientTotals(entries) {
  const out={};for(const k of ['fiber','satfat','salt','sugars']){
    let known=0,knownKcal=0,totalKcal=0;
    for(const e of entries){if(e.items&&!e.edited){const t=nutrientTotals(e.items)[k];known+=t.known;knownKcal+=t.knownKcal;totalKcal+=t.totalKcal;continue;}totalKcal+=+e.kcal||0;
      const v=e.edited&&e.items?null:numIn(e[k])??(numIn(e.per100?.[k])!==null&&numIn(e.g)!==null?e.per100[k]*e.g/100:null);
      if(v!==null){known+=v;knownKcal+=+e.kcal||0;}}

}

function noTargetsReason(date = Dates.today()) {

/* ----- Πρόταση γλυκού (μόνο όταν περισσεύουν θερμίδες) ----- */
function typicalMealKcal(mealId) {
  return cached('tm' + mealId + Dates.today(), () => {
    const from = Dates.add(Dates.today(), -28), vals = [];
    for (const k of dayKeysBetween(from, Dates.add(Dates.today(), -1))) { const d = Store.get(k); const es = d.meals.filter(e => e.meal === mealId); if (es.length) vals.push(es.reduce((a, e) => a + (+e.kcal || 0), 0)); }
    return vals.length >= 3 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  });
}
function weekBank(date) {
  // Θερμίδες που «περίσσεψαν» τις προηγούμενες ημέρες της εβδομάδας (μόνο καταγεγραμμένες ημέρες)
  let bank = 0; const ws = Dates.weekStart(date);
  for (let dd = ws; dd < date; dd = Dates.add(dd, 1)) { const d = Store.get('day:' + dd); if (d && d.meals.length && d.snap) bank += d.snap.kcal - dayTotals(d).kcal; }
  return bank;
}
function sweetSuggestions(d, snap, tot) {
  if (!snap || d.date !== Dates.today()) return null;
  const goal = profile().goal, hour = new Date().getHours();
  const reserveParts = [];
  for (const m of MEALS.slice(0, 3)) {
    if (d.meals.some(e => e.meal === m.id) || hour >= m.end) continue;
    const typ = typicalMealKcal(m.id) ?? snap.kcal * m.share;
    reserveParts.push({ label: m.label.toLowerCase(), kcal: typ });
  }
  const reserve = reserveParts.reduce((a, r) => a + r.kcal, 0);
  const bank = Math.max(0, weekBank(d.date)), bankUse = Math.min(bank, 300);
  const room = snap.kcal - tot.kcal - reserve + bankUse;
  const minRoom = { cut: 150, recomp: 150, maintain: 120, bulk: 100 }[goal] || 150;
  if (room < minRoom) return null;
  // Αγαπημένα: γλυκά που έχεις καταγράψει τις τελευταίες 60 ημέρες
  const freq = new Map(), from = Dates.add(d.date, -60);
  for (const k of dayKeysBetween(from, null)) { const x = Store.get(k); for (const e of x.meals) if (e.sweet && e.foodId) freq.set(e.foodId, (freq.get(e.foodId) || 0) + 1); }
  const all = foods().list.filter(f => f.sweet && !(settings().noSupplements && f.supp));
  const opts = [];
  for (const f of all) {
    const unit = f.piece ? 'piece' : 'portion', ug = Parser.unitGrams(f, unit).g, uk = ug * f.kcal / 100;
    let qty;
    if (unit === 'piece') { const maxPieces = Math.max(1, Math.round((f.portion || ug) / ug)); qty = Math.min(maxPieces, Math.floor(room / uk)); }
    else qty = uk <= room ? 1 : uk / 2 <= room ? 0.5 : 0;
    if (qty <= 0) continue;
    opts.push({ f, unit, qty, g: qty * ug, kcal: qty * uk, fav: freq.get(f.id) || 0, pRatio: f.p * 4 / f.kcal });
  }
  if (!opts.length) return null;
  opts.sort((a, b) => b.fav - a.fav || (goal === 'cut' ? a.kcal - b.kcal : b.kcal - a.kcal));
  const pick = opts.slice(0, 4);
  const pLeft = snap.p - tot.p;
  let protein = null;
  if (pLeft > 25) { protein = opts.filter(o => o.pRatio >= 0.3).sort((a, b) => b.pRatio - a.pRatio)[0] || null; if (protein && pick.includes(protein)) protein = null; }
  return { room, reserveParts, bankUse, pick, protein, pLeft };
}

function goalNote(g) {
  return {
    cut: 'Έλλειμμα ≈17,5% και υψηλή πρωτεΐνη. Στόχος απώλεια 0,5–1% του βάρους την εβδομάδα, διατηρώντας τη δύναμη.',
    bulk: 'Πλεόνασμα ≈10%. Στόχος αύξηση 0,1–0,5% του βάρους την εβδομάδα, για να μπαίνει κυρίως μυς και λιγότερο λίπος.',
    recomp: 'Αναδόμηση: μικρό έλλειμμα (≈5%), υψηλή πρωτεΐνη και προοδευτική προπόνηση. Το βάρος μένει περίπου σταθερό. Η πρόοδος φαίνεται στη μέση (μειώνεται) και στη δύναμη (αυξάνεται). Είναι πιο αργή από μια καθαρή φάση μείωσης λίπους, αλλά χωρίς μεγάλες διακυμάνσεις. Ταιριάζει σε άτομα με λίγα χρόνια προπόνησης και μέτριο ποσοστό λίπους (Barakat κ.ά. 2020).',
    maintain: 'Θερμίδες διατήρησης. Κατάλληλο για διάλειμμα από τη δίαιτα ή για σταθεροποίηση μετά από μια φάση.',
  }[g] || '';
}
function splitPreviewHTML() {
  const t = baseTargets(Dates.today()); if (!t || settings().highMode === 'none') return '';
  const sp = splitFor(t), lo = Calc.dayTarget(t, 2, sp), hi = Calc.dayTarget(t, 6, sp);
  return `<p class="small">Καθημερινές <b class="est">${fmt(lo.kcal)}</b> kcal, ${settings().highMode === 'long' ? 'Παρ–Κυρ' : 'Σάβ–Κυρ'} <b class="est">${fmt(hi.kcal)}</b> kcal.${sp.limited ? ' <span style="color:var(--warn)">Η αύξηση περιορίστηκε από το ελάχιστο των καθημερινών.</span>' : ''}</p>`;
}
function profResultsHTML() {
  const t = baseTargets(Dates.today());
  if (!t) return `<p class="muted">${esc(noTargetsReason())}</p>`;
  const pc = v => t.kcal ? Math.round(v / t.kcal * 100) : 0, ad = adaptiveOn(Dates.today());
  const tdeeLbl = { formula: `BMR × ${fmt(t.actF, 3)}`, manual: 'χειροκίνητο', held:'σταθερός στόχος από τύπο', adaptive: 'προσαρμοστικό', blend: 'σταδιακά προσαρμοσμένος στόχος' }[t.tdeeSrc];
  const bfo = bfOn(Dates.today()), bfRange = bfo && bfo.parts && bfo.parts.length > 1 ? `≈${fmt(Math.min(...bfo.parts.map(x => x.v)), 0)}–${fmt(Math.max(...bfo.parts.map(x => x.v)), 0)}%` : `≈${fmt(t.bf, 1)}%`;
  const bfLbl = t.bf === null || t.bfSrc === 'bmi' ? '' : `${bfRange}${bfo?.parts?.length>1 ? ' (εύρος δύο τύπων, όχι διάστημα εμπιστοσύνης)' : ''} (${{ manual: 'χειροκίνητο', 'manual-unverified': 'χειροκίνητο, μόνο ενημερωτικά', tape: 'από μετρήσεις', scale: 'από ζυγαριά' }[t.bfSrc] || 'εκτίμηση'})`;
  return `<table class="tbl"><tbody>
    ${bfLbl ? `<tr><td>Λίπος σώματος</td><td>${bfLbl}</td></tr>` : ''}
    ${t.ffm ? `<tr><td>Άλιπη μάζα</td><td>${E(t.ffm, true, 1)} kg</td></tr>` : ''}
    <tr><td>BMR (${t.bmrMethod})</td><td>${E(t.bmr, true)} kcal</td></tr>
    <tr><td>TDEE (${tdeeLbl})</td><td>${M(E(t.tdee, !t.tdeeManual), t.tdeeManual)} kcal</td></tr>
    <tr><td>Στόχος θερμίδων (${sfmt(t.pct, 1)}%)</td><td><b>${M(E(t.kcal, !t.kcalManual), t.kcalManual)} kcal</b></td></tr>
    <tr><td>Πρωτεΐνη ${t.pBasis === 'ffm' ? `(${fmt(t.pffm, 1)} g/kg άλιπης μάζας)` : t.pBasis === 'bw' ? `(${fmt(t.p / t.weight, 1)} g/kg)` : t.pBasis === 'ref' ? `(${fmt(t.p / t.refKg, 1)} g/kg βάρους αναφοράς)` : ''}</td><td>${M(E(t.p, !t.pManual), t.pManual)} g <span class="muted small">${pc(t.p * 4)}%</span></td></tr>
    <tr><td>Υδατάνθρακες</td><td>${M(E(t.c, !t.cManual), t.cManual)} g <span class="muted small">${pc(t.c * 4)}%</span></td></tr>
    <tr><td>Λίπος</td><td>${M(E(t.f, !t.fManual), t.fManual)} g <span class="muted small">${pc(t.f * 9)}%</span></td></tr>
  </tbody></table>
  ${t.safety.includes('minor') ? '<p class="note safety">Είσαι κάτω από 18 ετών. Η εφαρμογή δεν προτείνει έλλειμμα θερμίδων σε ανηλίκους, γιατί ο οργανισμός αναπτύσσεται ακόμα. Για αλλαγές στο βάρος, μίλησε με γιατρό ή διαιτολόγο.</p>' : ''}
  ${t.safety.includes('lowBmi') ? `<p class="note safety">Ο δείκτης μάζας σώματος (BMI ${fmt(t.bmi, 1)}) είναι κάτω από 18,5. Η εφαρμογή δεν προτείνει έλλειμμα θερμίδων. Αν θέλεις να χάσεις βάρος, συζήτησέ το πρώτα με γιατρό ή διαιτολόγο.</p>` : ''}
  ${t.safety.includes('lean') ? `<p class="note safety">Με BMI ${fmt(t.bmi, 1)} το έλλειμμα περιορίζεται στο 10% και ο στόχος απώλειας στο 0,25–0,5% την εβδομάδα, για προστασία της μυϊκής μάζας.</p>` : ''}

  ${t.pBasis === 'ref' ? `<p class="note">Πρωτεΐνη και ελάχιστο λίπος υπολογίζονται στο βάρος αναφοράς ${fmt(t.refKg)} kg (BMI 25), όχι στο συνολικό βάρος, με ανώτατο 35% των θερμίδων. Με μέτρηση λίπους (DEXA, δερματοπτυχές κ.λπ.) υπολογίζονται από την άλιπη μάζα.</p>` : ''}

  ${Math.abs(t.macroKcal - t.kcal) > 50 ? `<p class="note" style="border-color:var(--warn)">Τα μακροθρεπτικά αθροίζουν ${fmt(t.macroKcal)} kcal, όχι ${fmt(t.kcal)}. Έλεγξε τις χειροκίνητες τιμές.</p>` : ''}
  ${t.kcal < (numIn(settings().minKcal) || 0) ? `<p class="note" style="border-color:var(--warn)">Ο στόχος είναι κάτω από τις ${fmt(settings().minKcal)} kcal που όρισες ως ελάχιστο. Σκέψου μικρότερο έλλειμμα ή περισσότερα βήματα.</p>` : ''}
  <p class="small muted" style="margin-top:8px">Βάρος υπολογισμού ${fmt(t.weight, 1)} kg (μέσος όρος 7 ημερών). ${t.tdeeSrc === 'formula' ? 'Οι τύποι BMR έχουν απόκλιση περίπου ±10% ανά άτομο. Η προσαρμογή ενεργοποιείται μόνο με επαρκή πλήρη δεδομένα και εφαρμόζεται σταδιακά.' : ''}</p>`;
}

/* Ποσότητα + μονάδα */
function qtyWidgetHTML(f, qty, unit, prefix = 'q') {
  const units = Parser.unitsFor(f).map(u => u === 'g' && f.liquid ? 'ml' : u);
  // ml ↔ g είναι ισοδύναμα (1:1)· μια αναγνωρισμένη μονάδα εκτός λίστας προστίθεται, ώστε η ποσότητα να μη μετατρέπεται σιωπηρά σε μερίδες.
  if (unit === 'ml' && !f.liquid) unit = 'g'; else if (unit === 'g' && f.liquid) unit = 'ml';
  if (unit && UNIT_LABELS[unit] && !units.includes(unit)) units.push(unit);
  if (!units.includes(unit)) unit = f.piece ? 'piece' : 'portion';
  return `<div class="qtyw"><input type="text" inputmode="decimal" data-qw="qty" value="${esc(qty ?? '')}" aria-label="Ποσότητα">
    <select data-qw="unit" aria-label="Μονάδα">${units.map(u => { const ug = Parser.unitGrams(f, u === 'ml' ? 'g' : u).g; return `<option value="${u}" ${u === unit ? 'selected' : ''}>${UNIT_LABELS[u]}${u !== 'g' && u !== 'ml' ? ` (${fmt(ug, 1)} g)` : ''}</option>`; }).join('')}</select></div>`;
}
function qtyRead(box, f) {
  const qty = numIn($('[data-qw=qty]', box).value) || 0, unit = $('[data-qw=unit]', box).value;
  const g = unit === 'g' || unit === 'ml' ? qty : qty * Parser.unitGrams(f, unit).g;
  return { qty, unit, g };
}

function recentFoods() {
  const seen = new Map(), ks = Store.keys('day:').reverse().slice(0, 21);
  for (const k of ks) for (const e of (Store.get(k).meals || []).slice().reverse()) if (e.foodId && !seen.has(e.foodId)) { const f = foods().byId.get(e.foodId); if (f) seen.set(e.foodId, { f, qty: e.qty, unit: e.unit, g: e.g }); }

}

/* Προέλευση και αξιοπιστία τιμών τροφίμου */
function provenance(f) {
  if (!f) return '';
  if (f.src === 'label') return 'Ετικέτα κατασκευαστή (καταχώρηση δική σου)';
  if (f.src === 'off') return 'Open Food Facts (καταχώρηση κοινότητας· έλεγξε με την ετικέτα)';

  if (f.builtin) return f.modified ? 'Βάση εφαρμογής, με δικές σου αλλαγές' : f.est ? 'Βάση εφαρμογής (τυπική συνταγή, ενδεικτικό)' : 'Βάση εφαρμογής (τιμές USDA/πίνακες σύνθεσης)';

function foodDetail(det, f, lastQty, lastUnit) {

    <div class="small muted">Ανά 100 ${f.liquid ? 'ml' : 'g'}: ${fmt(f.kcal)} kcal, Π ${fmt(f.p, 1)}, Υ ${fmt(f.c, 1)}, Λ ${fmt(f.f, 1)}${f.est ? '. Σύνθετο φαγητό, οι τιμές είναι ενδεικτικές.' : ''}</div><div class="small muted" data-prov>Πηγή: ${esc(provenance(f))}</div>

    <div class="preview" id="fprev"></div><div class="dlg-f"><button class="btn pri" id="fadd">Προσθήκη</button></div></div>`;
  const pv = $('#fprev', det);
  const upd = () => { const r = qtyRead(det, f), m = macrosFor(f, r.g); pv.innerHTML = `<span>${fmt(r.g)} g</span><span><b>${fmt(m.kcal)}</b> kcal</span><span>Π <b>${fmt(m.p, 1)}</b></span><span>Υ <b>${fmt(m.c, 1)}</b></span><span>Λ <b>${fmt(m.f, 1)}</b></span>`; };
  // Ένας χειριστής ανά πάνελ: η επιλογή άλλου τροφίμου αντικαθιστά τον προηγούμενο αντί να προστίθεται.

function makeEntry(f, r, src, est) {
  // Οι θερμίδες υπολογίζονται από τα ίδια (στρογγυλεμένα) γραμμάρια που αποθηκεύονται.
  const g = Math.round(r.g * 10) / 10, per100 = Object.fromEntries(['kcal','p','c','f','fiber','satfat','salt','sugars','alc'].map(k=>[k,f[k]??null])), m = macrosFor(per100, g);
  if (per100.alc === null) delete per100.alc;
  return { id: uid(), name: f.name, foodId: f.id, g, qty: r.qty, unit: r.unit, per100, kcal: m.kcal, p: m.p, c: m.c, f: m.f, ...nutrientsFor(per100,g), ...(numIn(per100.alc) !== null ? { alc: per100.alc * g / 100 } : {}), src, est, sweet: !!f.sweet };

function addEntries(entries, meal) {

  const d = getDay(UI.date);
  // Ποσότητα εκτός ορίων (π.χ. «150 κιλά» αντί για «150 γρ»): σαφές μήνυμα αντί για γενικό σφάλμα επικύρωσης.
  if(entries.some(e=>(e.g!==null&&e.g!==undefined&&!Reliability.inRange(e.g,.001,100000))||(e.items||[]).some(i=>i.g!==null&&i.g!==undefined&&!Reliability.inRange(i.g,.001,100000)))){toast('Μη ρεαλιστική ποσότητα (πάνω από 100 κιλά). Έλεγξε τη μονάδα. Δεν προστέθηκε καταχώρηση.',6000);return;}
  if(entries.some(e=>['kcal','p','c','f'].some(k=>!Reliability.inRange(e[k],0,k==='kcal'?100000:20000)))){toast('Μη έγκυρα διατροφικά στοιχεία. Δεν προστέθηκε καταχώρηση.',5000);return;}
  entries.forEach(e => { e.meal = meal; d.meals.push(e); });
  UI.mealOpen = UI.mealOpen || {}; UI.mealOpen[meal] = true; UI.tab = 'meals';
  saveDay(d); render(); toast(entries.length === 1 ? 'Προστέθηκε.' : `Προστέθηκαν ${entries.length} τρόφιμα.`);
}

  const collect = () => { const out = []; $$('.parsed[data-i]', res).forEach(b => { if (!$('[data-inc]', b).checked) return; const f = fOf(b), r = qtyRead(b, f); if (f && r.g > 0) out.push(makeEntry(f, r, 'text', true)); }); return out; };
  const updTotal = () => { const t = $('#ttot', res); if (!t) return; const es = collect(), s = k => es.reduce((a, e) => a + e[k], 0); t.innerHTML = es.length ? `Σύνολο: <b>${fmt(s('kcal'))}</b> kcal · Π ${fmt(s('p'))} · Υ ${fmt(s('c'))} · Λ ${fmt(s('f'))}` : ''; };

/* Αυστηρή ανάγνωση αριθμητικού πεδίου: κενό = null, μη αριθμός = σφάλμα (ποτέ σιωπηρά 0). */
function fieldNum(val, lo, hi, parse = numIn) { const raw = String(val ?? '').trim(); if (raw === '') return { blank: true, v: null }; const v = parse(raw); return v === null || v < lo || v > hi ? { bad: true } : { v }; }
/* Συνέπεια ενέργειας–μακροθρεπτικών (4·Π + 4·Υ + 9·Λ, αλκοόλ 7 kcal/g). Επιστρέφει κείμενο προειδοποίησης ή ''. */
function macroCheck(kcal, p, c, f, alc = 0) {
  const k = +kcal || 0, m = 4 * (+p || 0) + 4 * (+c || 0) + 9 * (+f || 0) + 7 * (+alc || 0);
  if (!(m > 0)) return '';
  if (m > k * 1.15 + 20) return `Τα μακροθρεπτικά αντιστοιχούν σε ≈${fmt(m)} kcal, περισσότερες από τις ${fmt(k)} kcal που δηλώνεις. Έλεγξε τις τιμές.`;

function openEditEntry(id) {

    const recalc = () => { qtyTouched = true; const r = qtyRead(qw, fx), m = macrosFor(e.per100, r.g); $('#ek', body).value = Math.round(m.kcal); $('#ep', body).value = Math.round(m.p * 10) / 10; $('#ec', body).value = Math.round(m.c * 10) / 10; $('#ef', body).value = Math.round(m.f * 10) / 10; };
    if (qw) { qw.addEventListener('input', recalc); qw.addEventListener('change', recalc); }
    const sp = $('#esplit', body); if (sp) sp.addEventListener('click', () => { const sc = splitScale(e); if (sc.changed && !confirm(`Το σύνολο του πιάτου έχει διορθωθεί (${fmt(e.kcal)} kcal, ενώ τα υλικά αθροίζουν ${fmt(e.items.reduce((s, it) => s + (+it.kcal || 0), 0))}). Τα υλικά θα προσαρμοστούν αναλογικά ώστε το σύνολο να μείνει ${fmt(e.kcal)} kcal. Συνέχεια;`)) return; const i = d.meals.findIndex(x => x.id === id); d.meals.splice(i, 1, ...splitEntry(e)); saveDay(d); closeDlg(); render(); toast('Το πιάτο χωρίστηκε σε τρόφιμα.'); });

    $('#esave', body).addEventListener('click', () => {
      // Πεδίο που δεν άλλαξε κρατά την ακριβή αποθηκευμένη τιμή (όχι τη στρογγυλεμένη της οθόνης).
      const vals = Object.fromEntries([['kcal', 'ek'], ['p', 'ep'], ['c', 'ec'], ['f', 'ef']].map(([k, id]) => { const v = numIn($('#' + id, body).value); return [k, !qtyTouched && v === shown[k] ? +e[k] || 0 : v]; }));

      if (['kcal', 'p', 'c', 'f'].some(k => vals[k] !== (+e[k] || 0))) { const w = macroCheck(vals.kcal, vals.p, vals.c, vals.f, e.alc); if (w && !confirm(w + '\n\nΝα αποθηκευτεί όπως είναι;')) return; }
      if (qw) { const r = qtyRead(qw, fx); if (!(r.g > 0)) { toast('Δώσε ποσότητα μεγαλύτερη από 0.'); return; } if (r.qty !== +e.qty || r.unit !== e.unit) { e.g = Math.round(r.g * 10) / 10; e.qty = r.qty; e.unit = r.unit; } }
      const calc = e.per100 && !e.items ? macrosFor(e.per100, e.g) : null;
      const itemSum = k => e.items.reduce((a, i) => a + (+i[k] || 0), 0);
      const differs = calc ? ['kcal', 'p', 'c', 'f'].some(k => Math.abs((vals[k] ?? 0) - calc[k]) > (k === 'kcal' ? 1 : 0.15)) : e.items ? ['kcal', 'p', 'c', 'f'].some(k => Math.abs((vals[k] ?? 0) - itemSum(k)) > (k === 'kcal' ? 1 : 0.2)) : e.edited;
      // Γλυκά σε σύνθετο πιάτο: αναλογικά με τη νέα ενέργεια, ποτέ πάνω από το σύνολο· το «Γλυκό» ορίζει ρητά όλο/τίποτα όταν αλλάζει.
      if (e.items) { const was = +e.sweetKcal || 0, on = $('#esw', body).checked, base = +e.kcal || 0;
        if (!on) { if (was > 0) e.sweetKcal = 0; } else if (was <= 0) e.sweetKcal = vals.kcal; else if (vals.kcal !== base) e.sweetKcal = Math.min(vals.kcal, base > 0 ? was * vals.kcal / base : was); else e.sweetKcal = Math.min(was, vals.kcal); }

      if(e.items&&differs){for(const k of ['fiber','salt','satfat','sugars'])e[k]=null;}
      e.edited = !!differs;
      saveDay(d); closeDlg(); render(); toast('Αποθηκεύτηκε.');
    });
  });
}

/* ----- Κρυπτογράφηση αντιγράφου (AES-GCM 256, κλειδί από κωδικό με PBKDF2-SHA256) ----- */
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pass, salt, iter) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptPayload(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000; // OWASP 2023· τα παλιά αρχεία (310.000) διαβάζονται με την τιμή που γράφουν
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pass, salt, iter), new TextEncoder().encode(JSON.stringify(obj)));
  return { app: 'isozygio', enc: 'AES-GCM-256/PBKDF2-SHA256', iter, salt: b64e(salt), iv: b64e(iv), ct: b64e(new Uint8Array(ct)), exportedAt: obj.exportedAt };
}
async function decryptPayload(o, pass) {
  if(o.enc!=='AES-GCM-256/PBKDF2-SHA256'||!Reliability.inRange(o.iter||310000,100000,2000000,true)||b64d(o.salt).length!==16||b64d(o.iv).length!==12)throw new Error('Μη έγκυρα στοιχεία κρυπτογράφησης.');

  return JSON.parse(new TextDecoder().decode(pt));
}

/* ----- Υπενθυμίσεις: αρχείο ημερολογίου (.ics). Το ημερολόγιο του κινητού ειδοποιεί αξιόπιστα και με κλειστή την εφαρμογή. ----- */
function remindersIcs(opt) {
  const pad2 = n => String(n).padStart(2, '0'), start = Dates.add(Dates.today(), 1).replace(/-/g, ''), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', url = location.href.split('#')[0];
  const ev = (id, title, time, rule) => { const [h, m] = time.split(':'); return ['BEGIN:VEVENT', `UID:wmu-${id}-${stamp}@weightmeup`, `DTSTAMP:${stamp}`, `DTSTART:${start}T${pad2(h)}${pad2(m)}00`, 'DURATION:PT5M', `RRULE:${rule}`, `SUMMARY:${title}`, `DESCRIPTION:Weight me up: ${url}`, `URL:${url}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT']; };
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//WeightMeUp//GR', 'CALSCALE:GREGORIAN'];
  if (opt.weigh) L.push(...ev('weigh', 'Ζύγιση (πρωί, μετά την τουαλέτα)', opt.weigh, 'FREQ=DAILY'));
  if (opt.close) L.push(...ev('close', 'Κλείσε τη μέρα στο Weight me up', opt.close, 'FREQ=DAILY'));
  if (opt.backup) L.push(...ev('backup', 'Αντίγραφο ασφαλείας Weight me up (Export)', opt.backup, 'FREQ=WEEKLY;BYDAY=SU'));
  L.push('END:VCALENDAR');
  // RFC 5545: γραμμές έως 75 bytes, συνέχεια με κενό στην αρχή (τα ελληνικά είναι 2 bytes/χαρακτήρα)
  const fold = line => { const out = []; let cur = '', n = 0; for (const ch of line) { const b = new TextEncoder().encode(ch).length; if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; n = 0; } cur += ch; n += b; } out.push(cur); return out.join('\r\n '); };
  return L.map(fold).join('\r\n') + '\r\n';
}

  if (broken) {
    try { await Store.replaceAll(cur); } catch { toast('Το αντίγραφο δεν εμφανίζεται σωστά και η αυτόματη επαναφορά απέτυχε. Προφίλ → «Αναίρεση import».', 8000); UI.view = 'profile'; render(); return; }
    foodCache = null; UI.view = view; applyTheme(); render(); toast('Το αντίγραφο απορρίφθηκε: περιέχει δεδομένα που η εφαρμογή δεν μπορεί να εμφανίσει. Τα προηγούμενα δεδομένα έμειναν ως είχαν.', 8000); return;
  }
  UI.view = view; applyTheme(); toast('Τα δεδομένα επανήλθαν. Αν κάτι δεν είναι σωστό: Προφίλ → «Αναίρεση import».', 5000); render();
}
async function undoImport() {
